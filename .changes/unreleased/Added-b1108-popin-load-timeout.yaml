kind: Added
body: 'An opt-in load limit for popins, `loadTimeout`, in milliseconds: per popin with `new Popin({ name, loadTimeout: 15000 })`, or for every popin without its own value with `gina.setOptions({ popin: { loadTimeout: 15000 } })`; a popin''s own `0` means no limit for it. A popin whose content request never answered kept its loading shell, and its trigger stayed busy, for as long as the request hung. With a limit, a load still unanswered at it is aborted and fails like any failed load: `error` fires with `{ status: 408, error: ''Request Timeout'' }`, then the shell closes unless a listener loaded content, and the trigger is released. A close during the load still cancels it without an `error`. A hover or focus warm of the URL carries the same limit, so a click that adopted a stalled warm fails at most twice the limit after the warm began. There is no limit unless one is set. The popin plugin ships in the browser bundle: run `gina bundle:build` to pick it up. (#B1108)'
