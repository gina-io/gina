kind: Added
body: 'A bundle now warns once at boot, in one `[CONFIG][loadBundleConfig]` line, about each route whose `param` block binds a URL placeholder under a key gina reads as configuration, such as `"section": ":section"`. The presence of a key in `param` is what binds a URL segment, but `req.routing.param` keeps the placeholder text for every key the matcher does not fill, so gina reads `":section"` as `page.section`, `":code"` as the redirect status and `":isPopinContext"` as false. The warning covers the 24 keys gina reads as configuration: `requireAuth`, `public`, `roles`, `policy`, `dto`, `responseDto`, `messageValidator`, `lane`, `wsHandler` and `wsOptions` (a placeholder there already stops the boot), `control`, `route`, `url`, `urlIndex`, `ext`, `project`, `hostname`, `port` and `method` (it fails per request), and `ignoreWebRoot`, `section`, `isPopinContext`, `keep-params` and `code` (a wrong value, with no error). It names the binding whatever the route does, so a route that binds `code` and never redirects is warned too. `path`, `namespace`, `title` and `file`, which gina fills from the URL, and `culture`, which a `culturePrefix` route reads from the URL, are not warned. Bind the segment under another name (`"url": "/item/:itemCode"` with `"itemCode": ":itemCode"`); nothing is rewritten. Pick it up with a bundle restart. (#B1124)'
