kind: Added
body: 'A bundle now warns once at boot, in one `[CONFIG][loadBundleConfig]` line, about each route URL segment that holds a placeholder followed by a character other than a letter, a digit or an underscore, such as `"url": "/:lang-code/home"`. A placeholder''s name is its letters, digits and underscores: except on a DELETE route with `requirements`, gina reads `:lang-code` as the placeholder `:lang`, so a binding under `lang-code` is never filled, the route matches only when its `param` also binds `lang`, and a `culturePrefix` route that binds `"culture": ":lang-code"` reads no culture from the URL. Name each placeholder with letters, digits and underscores (`:lang_code`); nothing is rewritten. Pick it up with a bundle restart. (#B1143)'
time: 2026-11-18T22:09:51+01:00
