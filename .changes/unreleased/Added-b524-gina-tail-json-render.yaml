kind: Added
body: '`gina tail` honours the logger''s JSON render mode. When its own logger resolves the output format to `json` — `GINA_LOG_FORMAT=json` on the `gina tail` process — every relayed line is written as one JSON object (`ts`, `level`, `bundle`, `message`, plus the `group`/`msg` aliases) instead of the coloured text. This is the JSON answer for a container that runs a framework daemon (`gina start`, then `gina bundle:start`, with `gina tail` as the foreground process): the daemon discards the bundle''s own stdout once the bundle has started, so the tail relay is the only path a runtime line has to `kubectl logs`, and it must stay on — do not set `GINA_LOG_STDOUT=true` in that topology. The relay carries no request context, so `requestId` and `durationMs` are not present on these lines. (#B524)'
