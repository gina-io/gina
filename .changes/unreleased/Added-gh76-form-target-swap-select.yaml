kind: Added
body: 'A form can swap its `text/html` XHR answer into any element of the page, htmx-style, with three attributes on the `<form>`: `data-gina-form-target` (the `hx-target` grammar - `this`, `closest <selector>`, `find <selector>`, or a CSS selector; `next`/`previous` reserved), `data-gina-form-swap` (`innerHTML` by default, `outerHTML`, `textContent`, `beforebegin`, `afterbegin`, `beforeend`, `afterend`, `delete`, `none`) and `data-gina-form-select` (a CSS selector picking the part of the answer to swap, every match). The target is resolved at submit, from the form, and a target or strategy that cannot be honoured refuses the submit before anything is sent (`error` callback with `{ status: 422, reason: ''targetError'' }`). The success payload keeps `contentType`/`content`/`status` and adds `data`/`view` (the action''s data when the answer carries the dev-mode hidden inputs, `null` otherwise), `target`, `swap` and `swapped`. Two events on the form for the main swap: `beforeswap` (cancelable with `preventDefault()`; `detail.content` may be rewritten) and `afterswap` (after the region is bound; declarative hook `data-gina-form-event-on-swap`). The swapped region is bound through the shared `bindRegion()` policy: src scripts the document does not have are re-created once, forms that opt in are bound, `data-gina-link` anchors too; a swap that replaces the submitting form binds its replacement after the `success` callback. A declared target wins over the popin the form is in; absent, a form inside a popin keeps loading its answer into that popin (https://github.com/gina-io/gina/issues/76)'
