kind: Added
body: 'A form''s `text/html` answer can update elements anywhere in the page, independently of where the answer itself goes: any element of the answer carrying `data-gina-swap-oob` is swapped into the page element with the same `id` (htmx''s `hx-swap-oob`). `true` or an empty value replaces that element (`outerHTML`); a strategy name (`innerHTML`, `textContent`, `beforebegin`, `afterbegin`, `beforeend`, `afterend`, `delete`, `none`) applies the out-of-band element''s CONTENT, the wrapper being dropped; `<strategy>:<selector>` is reserved. Out-of-band elements are always removed from the answer, whether or not they swapped, so the main fragment stays clean, and they run BEFORE `data-gina-form-select` narrows it, so an element outside the selection still lands; where both address the same element, the main swap wins. They are processed on all three answer paths - a declared `data-gina-form-target`, a form rendered inside a popin, and a form with neither - so an answer carrying nothing else still updates the page. A missing `id`, no matching page element, a reserved or unknown value: the element is dropped and reported with a `reason`, never thrown, and named in a dev-mode console notice. The success payload gains `oob` (one entry per element: `id`, `strategy`, `swapped`, and `reason` when it did not swap) and `remainder` (the answer without them - what a handler should insert, since `content` stays the raw answer and would land them twice); both are absent when the answer carried no out-of-band element. Two events per element: `oobbeforeswap` (cancelable with `preventDefault()`; `detail.content` may be rewritten) and `oobafterswap`, each carrying `oob: true` and `oobId`. A form inside a popin updates the page behind it this way, and when nothing but out-of-band elements was addressed the dialog keeps its own content rather than being blanked. An out-of-band swap that replaces the submitting form rebinds it after the `success` callback, as a main swap does. An element wrapped in a `<template>` is honoured, and a wrapper emptied of them is dropped with them. An answer with no `data-gina-swap-oob` anywhere takes exactly the path it did before (https://github.com/gina-io/gina/issues/76)'
