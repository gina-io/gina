kind: Added
body: 'A server can now have the last word on where a form''s `text/html` answer goes and how: three response headers, read at settle once the answer is known to be HTML and before `beforeswap`, override the form''s declared `data-gina-form-target` / `-swap` / `-select` — `X-Gina-Retarget` (the target grammar: `this`, `closest <selector>`, `find <selector>`, a CSS selector; it creates a target where none was declared, replaces a declared one, and wins over the popin a form sits in), `X-Gina-Reswap` (one of the nine strategies) and `X-Gina-Reselect` (a selector applied to the answer) — htmx''s `HX-Retarget`, `HX-Reswap` and `HX-Reselect`. The invalid-value rule is asymmetric: a Retarget that cannot be resolved means no swap at all, not into the declared target and not into the popin, and the success callback still runs with `swapped: false` and `reason: ''retargetError''` (never an error callback: the request succeeded); an invalid Reswap or Reselect is ignored and the declared value kept, as is either one without any target. Every refused or ignored value is named in a dev-mode console notice, and the success payload gains an `overrides` key — present only when the answer carried at least one of the headers — with one `{ value, applied, reason }` entry per header; `beforeswap` receives the same object in its detail and keeps the last word. A JSON answer never reaches the read. The three headers are honoured only from a response whose origin is the page''s own - the transport''s `responseURL`, the URL after redirects, against `location.origin` - so a responder elsewhere may neither choose the element its answer lands in nor reshape or trim the swap the form declared: a cross-origin Retarget is refused exactly as an unresolvable one (no swap, `reason: ''crossOrigin''`), a cross-origin Reswap or Reselect is ignored and the declared value kept, and a transport that cannot say where the answer came from (no `responseURL`, or an opaque origin on either side) reads as not-same-origin. `Access-Control-Expose-Headers` therefore changes nothing for these three. htmx needs no such read because `selfRequestsOnly` refuses the cross-origin request itself; a form here posts to its raw `action`, so the gate lives at the read (https://github.com/gina-io/gina/issues/76)'
