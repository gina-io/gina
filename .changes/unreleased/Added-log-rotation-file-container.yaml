kind: Added
body: 'Log rotation for the logger''s opt-in `file` container, on by default at 10MB with 5 files kept — deliberately the same shape as the kubelet''s own `containerLogMaxSize` / `containerLogMaxFiles`. Configure it under `rotate` in `~/.gina/user/extensions/logger/file/config.json`, where the container is already enabled and which is the machine-level surface matching the per-host file it writes: `enabled` (default true), `when` (`"daily"` or null), `size` (default `"10MB"`), `count` (default 5) and `maxAge` (e.g. `"30d"`, off by default). The live file is renamed and reopened rather than copied and truncated, so no line is lost while rotating, and the sink now holds one append stream per group instead of reopening the file for every record. A size or age without an explicit unit is refused rather than guessed — `"10"` is never read as bytes — and any invalid value disables rotation for that group with a loud message naming the key, the value and the consequence, while logging itself continues. Rotation defaults to ON because this sink appends without bound otherwise, and a silently unbounded log file is the worst of the available behaviours. Note the file container receives its lines over the MQ socket and so only writes while the framework daemon is running: in a container there is no daemon, and stdout with platform-side rotation remains the supported path there.'
