kind: Added
body: 'Maintenance mode can now be turned on from the environment: a bundle started with `GINA_MAINTENANCE=1` (or `true`) boots with its maintenance gate closed, exactly as if `settings.json > server.maintenance.enabled` were `true` — for replacement pods created during a window, or any process that must come up closed without a configuration edit. The variable can only close a bundle, never open one: `0`, `false` or an unset value leave the configured state in place, and any other value is ignored with a boot warning naming the accepted values. The runtime toggle keeps its meaning — `POST /_gina/maintenance {"enable":false}` still reopens the process — and `GET /_gina/maintenance` reports `source: "env"` for a closure that came from the variable. Honoured under both launchers (`gina bundle:start` and `gina-container`); under the daemon the variable must be present in the environment of the process that started the daemon (a pod init script), because a warm daemon passes only its launch-time environment to the bundles it spawns.'
