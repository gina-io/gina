kind: Added
body: 'Maintenance mode can now stay coherent across the replicas of one deployment. Point `server.maintenance.store` at a declared kv namespace (redis-backed for replicas on different hosts, sqlite-backed for processes on one host) and every `POST /_gina/maintenance` writes its runtime override there, while each process polls it (`pollInterval`, default 2000 ms, an unref-ed timer) — so one POST anywhere closes or reopens every replica within one interval, and a replica joining mid-window follows the shared state within one store round-trip. The gate itself keeps reading local memory synchronously. A store outage freezes each replica in its last-known state and never reopens a closed site; a `ttlSeconds` window expires deployment-wide through the record TTL; an `enable:false` is written, not deleted, so it wins over a configured `enabled: true` on every replica exactly as it does locally. A namespace the kv primitive cannot hand out, or one running `failMode: "open"`, refuses the boot with a message naming the fix; a memory-backed namespace runs with a boot warning that replicas will not follow each other. `GET /_gina/maintenance` gains a `sync` field (`store`, `key`, `lastSyncAt`, `lastError`) and a `POST` reply carries `store: {written, error}` — a write that fails still applies locally and answers 200 with `written: false`. Without `store` nothing changes.'
