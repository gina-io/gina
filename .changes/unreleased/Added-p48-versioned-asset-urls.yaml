kind: Added
body: 'Versioned asset URLs, so browsers can keep a bundle''s scripts and stylesheets for a year: in production, the `<link>` and `<script>` tags gina writes from `templates.json` (and their HTTP/2 preload hints) end in `?v=` plus the first 10 hex characters of the file''s SHA-384, and the statics gina serves answer `Cache-Control: public, max-age=31536000, immutable` when the token names the file''s current bytes, `no-cache` for any other token, and exactly as before without one. The client routing table is fetched the same way, its token carried on gina''s own script tag. A deploy that changes a file changes its URL, so a returning visitor fetches it once and no stale copy survives. On by default; `assetVersioningEnabled: false` in `templates.json > _common` keeps the plain URLs. Not versioned: dev mode, renders without a layout, `isExternalPlugin` scripts, hand-written tags. A front server such as nginx needs a rule keyed on the token pattern (see the statics reference). Restart the bundle to pick it up; if your build copies `gina.min.js` into your own static files, rebuild that copy before the restart: an older copy compares script URLs exactly, so it can run a script twice when a popin or a swapped region includes a file the page loaded under its versioned URL. (#P48)'
