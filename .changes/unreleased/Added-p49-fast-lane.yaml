kind: Added
body: 'The fast lane: a JSON route can skip the controller. Declare `"param": { "lane": "users", "control": "list" }` in `routing.json` and export `list` from the bundle''s `lanes/users.js`: the function receives one context object and answers with `ctx.json()` or `ctx.error()`, with `ctx.params`, `ctx.body`, `ctx.session`, `ctx.getConfig()` and `ctx.hasRole()` at hand. Everything gina does before the router still runs (the request id, CORS, the security headers, maintenance mode, statics, body parsing, the route match and its requirements), and so does the bundle''s own middleware, such as the session and CSRF layers; the access line, the metrics and the JSON error envelope are those of any route. Measured with one process serving the same JSON answer both ways: a median 0.39 times the CPU of the controller route, about 150 microseconds less per request. Lane routes are checked at boot, which refuses one that declares route middleware, `cache`, `negotiate`, `namespace` or `method: "ws"`, and, in this release, any gate (authorization, rate limit, idempotency, message validation, request DTO), including the implicit ones of `auth.requireAuthByDefault` and `server.rateLimit`. A lane module edit is picked up in dev mode; a routing change needs a restart. Opt-in: existing routes are unchanged, unless one already used a `param` key named `lane` for its own data. Restart the bundle to pick it up; nothing to re-bake. (#P49)'
