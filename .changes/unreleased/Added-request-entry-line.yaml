kind: Added
body: 'With `settings.json > server.logRequestStart: true`, each application request writes one info line when it arrives, before its body is read: `METHOD [>] /path [ req <id> ]`, the id being the request''s correlation id (the `X-Request-Id` the answer echoes). gina otherwise logs a request when it completes, so a request that blocked the bundle (a slow body parse, middleware, action or render) appeared nowhere in its log. The path carries no query string and its control characters are written as visible escapes; in JSON log mode the line also carries `requestId` and `durationMs`. The health route, the other `/_gina/*` endpoints, static files and maintenance answers write no line, nor does a page the isaac engine''s in-memory render cache serves. Off by default; only the boolean `true` turns it on, read once at boot.'
