kind: Added
body: 'RFC 9218 request priorities (#H12, slice 1): `req.priority` is parsed on both engines from the `Priority` header — urgency 0–7 (default 3) and the incremental flag, with out-of-range, wrong-type or malformed values ignored exactly as the RFC requires — `self.query()` and `self.forward()` propagate a present inbound priority to the target bundle (a caller-set `headers.priority` wins, `priority: false` suppresses, an explicit `priority` option is sent normalized), and `self.setPriority()` emits the response header. The header is advisory and client-supplied: the framework carries the signal, it never reorders response writes.'
