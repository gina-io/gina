kind: Added
body: 'Per-bundle login session cookie lifetimes, declared in a bundle''s `security.json`. `session.expires` sets the cookie lifetime applied at `req.login()` for an ordinary login and `session.remember` the lifetime for a login that asked to be remembered — both unit-suffixed duration strings (`"15m"`, `"3h"`, `"15d"`; the unit is required). A login counts as remembered when the caller passes `{ remember: true }` to `req.login()`, or when the login request carries a truthy `remember` field (`on`, `1`, `true`, `yes`); an explicit option always wins over the request field. Both keys are optional and a bundle that declares neither behaves exactly as before. These two keys were documented but interpreted by nothing until now, so a value already sitting in one may not be a duration string: such a value is reported at boot naming the bundle, environment and key, and then ignored — the bundle keeps the cookie lifetime it already had and the boot is never refused. Everything that governed a session before still does: an application setting `req.session.cookie.maxAge` in its own login callback still wins, an absolute session timeout still caps the total lifetime, and a session store''s `ttl` still governs the server-side record independently of the cookie. Declared in the published `security.json` schema.'
