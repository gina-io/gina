kind: Added
body: 'With `settings.json > server.stallWatchdog: { "enabled": true }`, a worker thread watches the bundle''s main thread and reports a stall while it is still happening: when the main thread''s heartbeat has not moved for `threshold` (default `"5s"`, at least `1s`), the thread writes one crit line itself, `[ STALL ] main thread blocked: no heartbeat for 5.3s — frames: OrdersController.import (src/api/controllers/controller.orders.js:57:13) <- … — in flight 2: PUT /orders/42 [ req <id> ] 5.4s, …`, naming the blocked thread''s call frames (on Node) and the application requests in flight, oldest first, by the `X-Request-Id` their answers echo. It writes the line to the process''s stdout and, when the bundle runs under the framework daemon, through its own connection to the log relay `gina tail` reads. A blocked main thread runs none of its own logging, and an orchestrator''s liveness probe may end the process before the block ends, so this line is what reaches the log. When the main thread resumes, a warn line gives the whole silence, and with app.json metrics enabled `gina_main_thread_stalls_total` and `gina_main_thread_stall_seconds` count the stall. The line is masked with the log redaction rules, and it is one JSON object in JSON log mode. Off by default: only the boolean `true` turns it on, read once at boot, and on an enabled block an unknown key or a wrong value refuses the boot. To read the frames, the thread connects to the main thread''s inspector, with no `--inspect` flag, pauses it for about a millisecond and resumes it; files are named relative to the project or the framework directory. A main thread inside a native call answers nothing, so after a one-second deadline the line says `frames: none (native-call-or-outside-js)`; a debugger already holding the thread paused is left alone (`frames: none (debugger)`); on Bun the line says `frames: none (bun)`. `captureFrames: false` leaves the frames out, `frames` (1 to 32, default 8) sets how many are named and `inFlight` (1 to 64, default 8) how many requests. Works on Node and Bun.'
