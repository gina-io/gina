kind: Changed
body: 'Gina now requires `@rhinostone/swig` `^2.9.11` in both manifests (#B1022). Swig 2.9.11 is a fix release, with no advisory, that changes what some native swig templates render. A filter in a `set`, `if`, `elseif`, `for`, `include` or `filter` tag argument now applies to its own operand, as in an output: `{% set y = arr[0]|upper %}` over an empty array no longer throws, shapes such as `{% for c in (x)|reverse %}` or `{% include name|default("p.html") %}` now compile, and a filter after a function or method call with an expression before it now applies to that call only, in a `set`, `if`, `elseif` or `for` argument alike, where it applied to the whole expression before it: `{% set y = a + f(x)|upper %}` with `a = "x"` and `x = "ab"` gives `xAB`, where it gave `XAB`, and `{% if z and f(x)|upper %}` with `z = 0` is now false. A filter after a literal in an output that holds an operator or a ternary applies to the literal: `{{ 3|default(1) + 1 }}` gives 4, where it gave 3. An output whose variable is followed by a filter renders an empty string when the last filter returns undefined or null, for example `{{ items|first }}` over an empty array, or a custom filter that returns nothing; swig printed the word undefined or null. Inside an `{% autoescape true %}` region, a missing subscript or member, or a call that returns undefined, renders an empty string; gina''s own `settings.swig.autoescape` is a boolean, which already did. Gina''s own templates use none of these shapes. Upgrading gina installs 2.9.11 or later (a project copy loaded through `swig.useProject`, or a frontend selected through `swig.package`, keeps its own version); restart your bundles.'
