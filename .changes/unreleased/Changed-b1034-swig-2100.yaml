kind: Changed
body: 'Gina now requires `@rhinostone/swig` `^2.10.0` in both manifests (#B1034). Native swig templates change between 2.9.11 and 2.10.0 through 2.9.12 and 2.9.13, fix releases with no advisory; 2.10.0 itself changes only the swig-twig, swig-jinja2 and swig-django frontends. What a native template can render differently: `date` of a missing, null, empty or unparseable value renders an empty string, where it printed `NaN/NaN/NaN`. A filter or call result that is undefined or null reads as an empty string at a `+` or unary operand, in outputs and in `set` arguments alike: `{{ "a" + f() }}` renders `a`, where it printed `aundefined`, `{{ 1 + f() }}` renders 1 and `{{ -f() }}` renders 0, where they printed NaN. A filter after a filter or a call that found nothing renders an empty string: `{{ items|first|lower }}` over an empty array threw, and `{{ f()|upper }}` with a null result printed `[object Object]`. `first`, `last` and `replace` give an empty string for an undefined or null input, and `length` gives 0, where they threw. Blocks nested in blocks follow one chain of definitions per block name: a block nested in any block of an extending template defines its name even when the root has no block for the enclosing one, `{% parent %}` in a block nested in an override renders the next definition of its name, where it rendered nothing, as does `{% parent %}` in an override of a nested block on the sync path, as the async path already did, and a block that renders itself through a nested block or `{% parent %}` fails with an error naming the block, where the render overflowed the stack. The engines gina builds pass `cache: false`, so the template cache that swig 2.9.13 added to its async loader path does not engage: a layout and an include are still loaded on every render. Gina''s own templates use none of these shapes. Upgrading gina installs 2.10.0 or later (a project copy loaded through `swig.useProject`, or a frontend selected through `swig.package`, keeps its own version); restart your bundles.'
