kind: Changed
body: 'Locking @rhinostone/swig 2.12.4 in both lockfiles (both manifests keep ^2.12.1, so a fresh install already resolves 2.12.4 or later): in a gina process, a template''s read of `count` or `functionCount`, gina''s own Object.prototype helpers, now reads only an object''s own key, so `{{ r.count() }}` renders an empty string where it rendered the number of keys, and `{% if r.count %}` is false for an object without its own `count` key, where it was true (a query row''s `count` column reads as before); a template''s `{{ _ext.name }}` renders an empty string, while a custom tag''s compiled code still reads `_ext`; a context key named like a JavaScript global (`JSON`, `Math`, `encodeURIComponent`) that holds null or undefined now hides that global. swig 2.12.4''s own notes list its other read changes. Server-side only: a bundle restart picks it up, no re-bake. (#B1138)'
