kind: Changed
body: 'The Isaac HTTP/2 rapid-reset guard (CVE-2023-44487) now counts the streams a CLIENT cuts short — a `RST_STREAM` of any code, or the peer destroying the stream, before the response completed — per session per rolling second, instead of counting new streams. Counting new streams made a sibling bundle''s own multiplexed `self.query()` calls trip it: above 200 calls per second on one cached session the target sent `GOAWAY(ENHANCE_YOUR_CALM)` and every in-flight call failed with a 500 (17% of calls at 50 concurrent callers with default settings). A well-behaved multiplexing caller never resets a stream, so it never trips the re-scoped guard; new streams stay bounded by `maxConcurrentStreams`. The setting is renamed to say what it counts: `http2Options.maxStreamResetsPerSecond` (default 200). The old key `maxStreamsPerSecond` is no longer read — a bundle still setting it gets one boot warning and the default — because a raised value left over from the workaround must not quietly widen the reset limit. Two new pass-through keys, `http2Options.streamResetBurst` and `streamResetRate` (both required together), tune the runtime''s own frame-level reset limit, which stays the primary guard: nghttp2 closes a session with `GOAWAY(INTERNAL_ERROR)` after a 1,000-reset burst (then 33/s), silently on the server side; gina''s guard is the observable, configurable, tighter-burst layer on top. Not a vulnerability fix — the protection was in place; its scope changes so it no longer fires on the framework''s own traffic. Engine-side aborts (a server-side destroy, the teardown a GOAWAY causes) are told apart and never counted. Pickup: bundle restart, no re-bake (#B611)'
