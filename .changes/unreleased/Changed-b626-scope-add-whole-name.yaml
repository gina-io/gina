kind: Changed
body: '`gina scope:add` now checks the whole scope name and refuses one it cannot use: a name is made of letters, digits, `_`, `.` and `-`, starts with a lowercase letter, a digit, `_` or `.`, and is neither `.`, `..` nor the name of a property every object inherits, such as `constructor`. It used to check the first character only. The `<bundle>/<scope>` form the command help documented as adding a scope to one bundle is retired: it never limited a scope to a bundle, it registered a project scope literally named `<bundle>/<scope>`. That form is now refused with a pointer to the per-bundle mechanism, the `scopes` allow-list on a bundle entry in `manifest.json`. A name that failed the old first-character check, such as `Staging`, used to be dropped without a message; it is now refused. Scopes already registered are unchanged, `scope:remove` still removes them, and the Couchbase connector still accepts a `/` in a scope, so a scope registered under the old form keeps booting. (#B626)'
