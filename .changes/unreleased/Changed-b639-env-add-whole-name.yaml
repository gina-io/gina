kind: Changed
body: '`gina env:add` now checks the whole environment name and refuses one it cannot use, as `scope:add` now does for scopes: a name is made of letters, digits, `_`, `.` and `-`, starts with a lowercase letter, a digit, `_` or `.`, and is none of `.`, `..` and `global`, which already names the configuration overlay that applies to every environment. It used to check the first character only. The `<bundle>/<env>` form the command help documented as adding an environment to one bundle is retired: it never limited an environment to a bundle, it registered a project environment literally named `<bundle>/<env>`. A name that failed the old check, such as `Staging`, used to be dropped without a message; it is now refused. Both `env:add` and `scope:add` also refuse the name of a property every object inherits, such as `constructor` or `__proto__`: the project files are indexed by these names, and such a name would reach the shared prototype instead of an entry of its own. Environments and scopes already registered are unchanged. (#B639)'
