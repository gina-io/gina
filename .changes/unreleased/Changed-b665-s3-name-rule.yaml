kind: Changed
body: 'A new project or bundle name must now be made of letters, digits, `_`, `.` and `-`, and start with a lowercase letter, a digit, `_` or `.`; `.`, `..` and the names every object inherits, such as `constructor`, are refused. `project:add`, `bundle:add`, the new name given to `project:rename`, `bundle:rename` or `bundle:copy`, and the name `project:restore` registers are checked before anything is written, and `bundle:add` checks every name of its list before it adds the first bundle. Until now only the first character was checked, so names holding spaces, quotes, `$` or `/` were registered, and `project:add @constructor` took the name for a registered project with no path and failed. A project or bundle already registered under a name outside the rule keeps working, including with `project:import`, `bundle:add --import` and `bundle:add --replace`. (#B665)'
time: 2026-09-27T19:35:05+01:00
