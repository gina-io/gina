kind: Changed
body: 'A `self.query()` call to an HTTP/2 upstream that reaches its `requestTimeout` now fails with `TIMEOUT` at that moment and is never sent again. Before, the timeout destroyed the session and sent a safe method (or a call with `retryUnsafe: true`) up to twice more: a slow but live upstream ran the same action three times while the caller waited three timeouts and half a second, every other request in flight on that session failed with a 500 that carried no error code, and an attempt waiting on a session that never connected raised an uncaught `ERR_HTTP2_STREAM_CANCEL`. Now, on a connected session, only the timed-out request is cancelled. A connected session is kept, and the next call checks it with a PING before using it; a session that never finished connecting is dropped, the next call opens a new one, and the calls that were waiting on it, never sent, are sent again on a new session (#B981). A call that a second attempt used to save now fails with `TIMEOUT`: an upstream that answers slowly once (a cache warming up), a connection lost during the call when `requestTimeout` is under about 8 seconds (the next call recovers), and a call with `retryUnsafe: true`. Each timeout sends an `RST_STREAM`, which the upstream counts: more than `http2Options.maxStreamResetsPerSecond` timeouts (200 by default) within one second on one session make an Isaac upstream close that session with a warning, and an upstream running on Node.js also closes it at a sustained rate above 33 per second, once the runtime budget of 1,000 resets is spent (the `streamResetBurst` / `streamResetRate` defaults of Node.js, which an Isaac upstream changes only when its `http2Options` sets both). The calls still in flight on a closed session are retried as after any `GOAWAY` (a safe method, or `retryUnsafe`); raise the limits on the upstream, or set `server.query.http2SessionPool` on the caller. HTTP/1.1 calls are unchanged. Server-side only: a running bundle picks this up at its next restart. (#B967, #B628, #B970)'
