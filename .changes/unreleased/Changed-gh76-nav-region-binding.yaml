kind: Changed
body: 'Fragment navigation (`gina/nav`) binds the swapped region through the same policy the validator now uses for form-answer swaps, the shared `bindRegion()` helper (utils/dom): the fragment''s src-bearing scripts the document does not already have are re-created once, `data-gina-link` anchors are bound through the live link plugin, and forms are bound ONLY when they opt in (#B549: a `data-gina-form-*` attribute, an id naming a registered rule, or a `gina-upload-*` id). A bare id-bearing form inside a navigated fragment was bound regardless, and its submit silently became an XHR - the pre-#B549 bind-everything shape re-entering through swapped content (measured on the real bundle: bound and posted over XHR after a swap, left alone on the initial page). Such a form now keeps its native submit; add `data-gina-form-rule` or any `data-gina-form-*` attribute to opt it in. The validator publishes the gate as `gina.validator.bindRegion($root)` (https://github.com/gina-io/gina/issues/76)'
