kind: Changed
body: 'The popin context a request and its answer carry is decided by containment - the popin the submitting form is inside - instead of by whichever popin is open: (1) the `X-Gina-Popin-Id` / `X-Gina-Popin-Name` request headers, and therefore `self.isPopinContext()`, `Setup.isPopinContext` and a popin-style XHR redirect from `self.redirect()`, are now produced only for a form rendered inside a popin, not for a page form submitted while a popin happened to be open; (2) a plain `location` XHR redirect answering a page form navigates the page instead of being loaded into an open popin, and a name-less `location` redirect arriving after its popin was closed no longer reopens it; (3) `getActivePopin()` no longer returns a registered popin that is not open, so a no-argument `gina.popin.close()`, `destroy()` or `unbind()` during a popin''s own click-time load window is a no-op, and with two popins open the most recently opened one is the active one rather than the first registered; (4) a name-less `popin: { close: true }` answer with nothing open to close is a no-op rather than a `422`. A page that deliberately fed a non-modal popin from a page form''s answer sees the dev-mode notice and keeps that behaviour explicitly with `data-gina-form-target` pointing at the dialog, or by rendering the form inside the popin (https://github.com/gina-io/gina/issues/76)'
