kind: Changed
body: 'Two forms whose answers land in the same region no longer race. A form already declares, at submit time, where its answer goes and what it does when it gets there, and that is the whole of what the decision needs: when `data-gina-form-swap` REPLACES the region the form targets - `innerHTML` (the default), `outerHTML`, `textContent` or `delete` - a newer submit into the same target SUPERSEDES the request still in flight, whose answer was about to be overwritten anyway; when the swap ADDS to the region (`beforebegin`, `afterbegin`, `beforeend`, `afterend`) or writes nothing (`none`), there is no conflict to resolve and both land, exactly as before. Nothing is declared for any of this. The key is the RESOLVED swap target, which is what makes two DIFFERENT forms coordinate at all - a form-keyed guard never sees them - and a form declaring no `data-gina-form-target` is untouched, the module-wide `withRateLimit` rule still governing it and its own re-submits. BEHAVIOUR CHANGE, in exactly one shape: two or more forms targeting one element with a replacing swap, where both answers used to arrive and the older one is now aborted. Declare `data-gina-form-sync="queue"` on the later form to serialise them instead, or an insertion swap if what was wanted was both. `data-gina-form-sync` on the form overrides the derived decision where it is wrong - `replace`, `drop` or `queue` (one submit waits per region, the most recent) - and when declared it owns that form''s decision, the module-wide `withRateLimit` option yielding to it so `replace` and `queue` are reachable without changing a global. Three htmx `hx-sync` spellings are REFUSED rather than parsed, each with a message naming the reason and the alternative: `abort` (its disposable-GET idiom, where a form submit is a validated POST with side effects - use `replace` or `drop`), the `queue first|last|all` modifiers (htmx has them because its trigger spec has `queue:` modifiers of its own; there is no trigger spec here, and one submit waiting per region is the only thing that region can act on), and `<selector>:<strategy>` (it names the element to coordinate on, which is already known - the resolved swap target). A superseded request releases everything it held - its trigger, its loading state, its a11y state - and then stops: it fires a new `abort` event on the form, `{ status: 0, reason: ''superseded'', sync, derived }`, and never reaches the `error` channel, so the 408 an aborted transport would otherwise look like is not raised and `data-gina-form-event-on-submit-error` never sees it. `derived` says whether the rule was read from the swap strategy or declared on the form, because the default needs no attribute and a page seeing the event may find nothing in its own markup that asked for it. The loading state follows the same logic: a submit turned away by `drop` releases the `data-gina-loading` its own click armed, since it will never reach a settle that could; a queued submit keeps it, being pending rather than abandoned. `data-gina-form-disabled-elt` holds elements disabled for the life of a request: a comma-separated list in the `data-gina-form-target` grammar, resolved before the request is opened and released at the one settle that covers success, error, abort and timeout alike. Each element is refcounted, so two overlapping requests naming the same element release it once, and marked `data-gina-disabled-by` with the form id; an element the page had already disabled is left alone and never cleared by us. An unreadable `sync` value or a part of `disabled-elt` that resolves to nothing refuses the submit before anything is sent - the same pre-send refusal a bad `data-gina-form-target` gets, `{ status: 422, reason: ''targetError'' }` with `attribute` naming which one - deliberately louder than htmx, which skips an unmatched `hx-disabled-elt` silently (https://github.com/gina-io/gina/issues/76)'
