kind: Changed
body: '`self.getConfig()` — the bare form and `getConfig(''name'')` alike — now returns a per-call copy-on-write view of the configuration instead of a deep clone. Reads pass through to the shared configuration at no copy cost, a write lands in the view''s own overlay (it never reaches the live configuration and no other call sees it), and the first enumeration of a node (`Object.keys`, `JSON.stringify`, `for…in`, spread) copies that subtree once. Every read, write and serialisation that worked on the clone works on the view. Measured on the profiling harness, a route behind a middleware pair whose constructors each read `this.getConfig()` went from 14,719 ms to 1,884 ms for 3,000 requests and the deep-clone share of its CPU from 72.9 % to 3.1 % — the bare form was deep-copying a 445 KB resolved configuration on a minimal scaffold, megabytes on a large bundle. Three things a deep clone allowed do not work on a node you have not enumerated yet: `structuredClone(result)` throws a `DataCloneError`, `Object.freeze` / `Object.seal` throw a `TypeError` (enumerate the parent first — the node is then a plain copy), and `console.log` / `util.inspect` show the shared values rather than your writes (property reads and `JSON.stringify` are truthful). A bundle whose code relies on one of them opts back into deep clones with the new `settings.json` key `controller.getConfig.mode: "clone"`. The view also preserves the configuration''s `settings` / `content.settings` aliasing, which the clone silently broke. New library `lib/conf-view`, on the framework''s lib registry as `confView` (`create()` / `isView()`). On the same per-request path, the router no longer deep-clones the whole routing map for every matched request: it shallow-copies the map and the matched rule — the only per-request write there is the replacement of that rule''s `param`, and the middleware list the request consumes is already its own copy from the matcher — so every other rule is shared by reference; a large routing table stops paying a per-request deep copy, and nothing observable changes for a bundle. Pickup: a bundle restart; no re-bake. (#P40)'
