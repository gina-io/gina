kind: Changed
body: 'The warm route cache, the per-process record of which rule matched each `METHOD:path` pair (up to 5,000 of them), is now one `Map`. A lookup and an eviction cost the same at any size: with the cache full, a lookup went from 18-74 µs to about 1.5 µs, and an insert that evicts the oldest entry from 26-80 µs to about 1 µs (two runs on a loaded host). The rules are unchanged: the first write to a key wins, the oldest key is evicted first, and a hit does not move an entry. A cache entry now keeps only the rule''s name and object. It used to also keep the route parameters and the data of the request that first matched it (for a POST, its body, a login form''s included) for as long as the entry lived, which is the life of the process unless 5,000 other paths pushed it out. The unused radix trie is removed: `lib/routing/src/radix.js` and the routing library''s internal `buildTrie()` and `lookupTrie()`, which no running code called (the route candidate index replaces them). Pickup: bundle restart, and a re-bake to carry the rebuilt browser bundle (#P46)'
