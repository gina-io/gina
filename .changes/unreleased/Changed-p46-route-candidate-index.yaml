kind: Changed
body: 'Route matching no longer evaluates every rule of a bundle for a request the warm route cache has not seen. Once per routing table, the engine indexes which rules could match a URL: segment count, static segments, parameters (a `:` anywhere in a segment, so inline parameters included), each variant of a comma-separated URL, and each rule''s raw `url`. The declaration-order scan then skips every other rule, so the first matching rule still wins and every per-rule check (scope, method, requirements) runs as before, and a request no rule can match gets its 404 without a scan. Measured on the routing step alone, over a 380-rule table: matching a late rule went from about 440 µs to about 14 µs, and a 404 from about 510 µs to about 12 µs. Some requests and rules are still scanned in full: the root path, a path with a trailing or doubled slash, a path holding `?` (the express engine keeps the query in the path), and a rule declaring two or more `requirements` that are not bound to a whole `:key` segment of its `url`. A rule the index skips no longer runs its requirement checks for that request. A `validator::` requirement on such a rule is no longer evaluated, so a malformed one no longer answers 500 for other URLs, and a `validator::{ query: ... }` no longer sends its backend request. On a 404 or a 405, `req.params` also no longer carries values that a skipped rule used to capture. Pickup: bundle restart, no re-bake (#P46)'
