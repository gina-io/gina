kind: Changed
body: 'Over HTTP/2, `self.query()` no longer adds `status: 200` to an upstream JSON body that carries no `status`, and no longer logs `Response status code is undefined: switching to 200` on every such call. The caller receives the body as the upstream sent it, as it always did over HTTP/1.1, and so does the end client of a `control: "forward"` route, which relayed the added key. Success is decided as before: a body without `status` is a success on both transports, and a body that carries one, numeric or not, is delivered unchanged. A JSON string body such as `"[]"` is now a success over HTTP/2 too; the added key threw on it and the call answered 500. Code that read `status` on such a result now reads `undefined` and should treat an absent `status` as success, as the framework does; code that deleted the added key no longer needs to. Pickup: bundle restart, no re-bake (#P47)'
