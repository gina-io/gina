kind: Changed
body: 'A staged file input now refuses, before any request is sent, a chosen or dropped file of a type its `accept` attribute excludes, or larger than its new `data-gina-form-upload-max-size` attribute. Until now the browser''s file dialog only filtered what it showed (a user could still choose « All files »), a drop was not filtered at all, and every file was sent to the staging route; the server was the only check, and it stays the authority. `accept` is read as the browser reads it: comma-separated tokens, trimmed and case-insensitive; `.ext` matches the end of the file name, `type/*` the start of its type (`*/*` any file, one with no type included), any other `type/subtype` the type exactly, and a file the browser gives no type matches an extension token or `*/*` only. A token of another shape (`jpg`, a type with parameters) is ignored, with a warning in dev mode. `data-gina-form-upload-max-size` reads as `upload.maxFieldsSize` does: a number with an optional `b`, `kb`/`k`, `mb`/`m` or `gb`/`g` (1024-based), a bare number in megabytes, `0` or an empty value for no limit; a value that does not parse checks no size, with a warning in dev mode. A selection holding one refused file is refused whole: nothing of it is staged, the files the input already held keep their previews, links and hidden fields, and a staging of its earlier selection still in flight finishes. The input''s error element shows « photo.png was not uploaded: this type of file is not accepted » or « scan.pdf was not uploaded: the file is too large », one line per reason (two new strings, `uploadTypeRefused` and `uploadSizeRefused`, translatable through `gina.config.a11y`), the form''s live region announces them, and the input''s `data-gina-form-upload-on-error` callback runs with `{ refused: true, reason, files, error, transportError: false }`, where `reason` is `''type''` when a file was refused for its type, else `''size''`, and `files` names every refused file. A staged input whose `accept` names fewer types than its upload group allows now refuses the files of the other types: list them in `accept`, or remove it.'
