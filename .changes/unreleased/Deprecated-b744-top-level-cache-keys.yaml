kind: Deprecated
body: 'In `settings.json`, the top-level `cache` block carries the render cache''s default backend (`type`, `store`, `name`); its switch and bundle-wide defaults (`enable`, `path`, `ttl`, `sliding`, `maxAge`, `maxEntries`) have always been read from `server.cache` only and were silently ignored in the top-level block. A bundle now logs a boot warning for each such key found there, naming `server.cache`, and the settings schema marks them deprecated at that place (#B744).'
