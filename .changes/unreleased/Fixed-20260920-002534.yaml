kind: Fixed
body: 'A JSON config carrying a `/**` docblock and, in a string value, a `/*` with no `*/` after it — a glob or certificate path such as `"…/ssl/*.example.pem"` — no longer hangs the bundle boot. The block-comment strip in `requireJSON` was a regular expression that backtracked about 2× per line (4× per CRLF line) following such a value, so a config with a glob path a few dozen lines from its bottom hung until the CLI start-wait killed the process, with nothing logged. The strip is now a linear, string-aware scan; a `/*` inside a quoted value is data and survives intact, where the regex also removed `/**/` out of glob values such as `"./lib/**/*"`. Everything else is unchanged: block comments are still stripped only when the file carries a docblock (#B568)'
