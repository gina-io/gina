kind: Fixed
body: 'An `<a>` in popin content that has no `href` when the content is bound, and is given one by the page afterwards, now works when clicked. Before, its click did nothing, and `gina.popin.close(name)` and a form''s `close()` were ignored afterwards. It now follows the rules of a link: its page loads into the popin, and one carrying a `target`, a `download`, a `#` in its URL or a URL scheme other than http(s) is left to the browser, which opens that window, saves the file, moves to the fragment or hands the URL to its handler. This also holds after a partial swap of the popin (`data-gina-dialog-target`). Its load carries no `?inheritedData`, even inside a form carrying inherited data in a popin registered with the validator. An anchor carrying `disabled` still does nothing. Browser-bundled: restart the bundle and re-bake it (`gina bundle:build`) to pick it up. (#B1015)'
