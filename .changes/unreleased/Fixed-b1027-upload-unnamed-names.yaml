kind: Fixed
body: 'A reset no longer names a staged file or its preview « undefined » when the staging answer gives no name for it (#B1027). The staging success wrote the answer''s `originalFilename` and its preview''s `originalFilename` into the preview node without a check, so a missing name was stored as the text « undefined », and the reset sent it in its removal request and in the removal callback''s `payload.files`. The guide''s `preview` example carries no `originalFilename`, so a reset of a file staged with that shape named its preview « undefined ». A name is now recorded only when the answer gives one: a preview without one is left out of the removal request, and a file the answer left unnamed is named by the browser file''s name.'
