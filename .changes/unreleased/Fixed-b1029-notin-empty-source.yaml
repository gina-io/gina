kind: Fixed
body: '`Collection.notIn()` and `delete()` on an empty source now return `[]` (#B1029). Up to 0.7.7 the array form, `notIn(rows, key)` (also with no key, or with `false`), returned `rows` itself when the searched array was empty, a new Collection over `[]` or an empty query result chained into `notIn`, so the call handed back the very rows it excludes, none of which belong to the source; `delete(rows, key)` delegates to `notIn` and did the same. The filter-object form, `notIn({ … })`, already returned `[]`. This changes the result for code that relied on the old one: a caller that wants the excluded rows when the source is empty now takes them directly. `lib/collection` ships in the browser bundle, so the pickup is a bundle restart and a re-bake.'
