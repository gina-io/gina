kind: Fixed
body: '`self.requireController(namespace)` called without its `options` argument (or with `null`) now builds the controller with the options of the request being served, the object an action passes as `self._options`. It used to throw `TypeError: Cannot read properties of undefined (reading ''controlRequired'')` before doing anything, although the argument is documented as optional. A route middleware and a bundle''s `controllers/setup.js` have no `self._options` of their own, so in them the method threw however it was called; it now works there too. A call that passes options is unchanged. (#B1031)'
time: 2026-11-11T05:30:05+01:00
