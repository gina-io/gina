kind: Fixed
body: 'A form reset no longer runs the live check (#B1037). `form.reset()`, a click on a reset button and the handle''s `.resetFields()` restore the values, clear the error display and the `errors` store, and re-read the submit trigger, with nothing painted or announced. Up to 0.7.7 each field ran its own live pass: the live region announced an error and kept it, a required value-carrying checkbox or radio stayed painted, and `.resetFields()` alone left every empty required field painted. A `query` verdict that comes back after a reset is dropped, and a submit it refuses paints nothing. The submit trigger is re-read also when the `query` field is not the last of its rule set (up to 0.7.7 it kept its state, and the first click on a valid form was refused) and once a master checkbox has applied its group; a request in flight keeps its trigger locked. With live check off, `.resetFields()` runs no check. A bound field removed from the page and an empty `<select>` no longer make the reset throw, which left nothing reset. `.resetFields()` still ends on each control''s value at bind, and `form.reset()` still ends `text` and `hidden` inputs on their `defaultValue`.'
