kind: Fixed
body: 'A form no longer freezes the browser tab or sends `query` requests without end when a field''s only rule is `query`, or when a `query` field also drives a `_case_` block (#B1039). On an otherwise valid form, the re-validation that follows a clean verdict asked the same `query` again, and its clean verdict started that re-validation again. With a value, the tab froze when the user typed, or at page load for a field last or alone in its rule set (0.6.7 to 0.7.7). With an empty field, requests streamed from page load (0.6.5 to 0.7.7). The re-validation no longer asks again a `query` whose answer is in. Workaround on a published version: add a sync rule such as `isRequired` or `isString` to the field; it does not help a field that drives a `_case_` block. The browser bundle changed: restart the bundles and re-bake.'
