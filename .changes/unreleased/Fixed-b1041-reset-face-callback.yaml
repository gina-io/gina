kind: Fixed
body: 'A form reset (`form.reset()`, a reset button, or the handle''s `.resetFields()`) now restores a form-associated custom element through its own `formResetCallback`. The browser''s native reset runs that callback; gina cancels the native reset and restores the bound controls itself, and it never ran it, so a component kept the value of its last commit and the reset''s pass read that value: the submit control stayed open on an emptied required component. A component without a `formResetCallback` keeps its value, as a native reset leaves it, and a callback that throws is reported without stopping the reset of the other fields. As under a native reset, the callbacks run once every other control of the form is restored, and a component moved into another form after the form was bound is left to that form. (#B1041, #B1087)'
