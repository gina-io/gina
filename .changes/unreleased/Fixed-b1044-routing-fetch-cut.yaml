kind: Fixed
body: 'The browser no longer reports a failed routing fetch on a page that is going away, and a page whose fetch was cut gets its routing table (#B1044). A navigation can cut the fetch of `_gina/assets/routing.json` while a page boots. The page being left then printed « routing dependency failed to load » in the console. On WebKit, when that navigation did not replace the page (it answered a 204, or was a download), the page also stayed with no table, so client `getRoute()` and `toUrl()` stayed degraded until reload. A fetch that got no answer is now asked again after 300 ms, 1 s and 2.5 s before it counts as a failure. On a real network failure the error and the `gina.ready` handlers therefore come about 3.8 s later; an HTTP error or a body that is not JSON still fails at once. The browser bundle changed: restart the bundles and re-bake.'
