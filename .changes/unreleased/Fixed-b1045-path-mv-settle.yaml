kind: Fixed
body: '`PathObject.mv()` and `.rm()` now settle every call, whatever happens to the path meanwhile (#B1045). A source taken by another move or remove between the check in `mv()` and the copy threw from an async callback, past any `try` or callback, as an uncaught exception, which `lib/proc.js` answers by stopping the bundle. A path gone before the remove reached it, or a failed `lstat` or `readdir` during the remove, never called back, so the move or remove never completed. A path another operation takes now counts as done: a move whose copy finished reports a success. Any other failure reaches the callback, including a denied `unlink`, which read as a success with the source still there. `mv()` with no callback now logs a failure where it threw. Server-side: a bundle restart picks it up.'
