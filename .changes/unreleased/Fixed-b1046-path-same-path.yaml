kind: Fixed
body: '`PathObject.mv()` and `.cp()` no longer destroy a path when the target already is the source (#B1046). `mv(x, x)` copied the file onto itself and then removed it, and `mv(dir, dir)` and `cp(dir, dir)` removed the folder before copying from it; all of them reported a success. Such a call is now a no-op that reports a success. A file moved to the folder it already sits in, which landed on itself and was then removed, stays too. A rename that only changes the case, which destroyed the path on a case-insensitive filesystem, now renames. The same file by another spelling or through a symlinked parent counts as the same path, and so does a hard link of it, which is now left in place with the source. Server-side: a bundle restart picks it up.'
