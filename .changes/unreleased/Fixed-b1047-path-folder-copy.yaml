kind: Fixed
body: 'A folder `cp()` or `mv()` now reports a file it could not copy, and `mv()` keeps its source (#B1047). The walk dropped the error, so moving a folder that held an unreadable file reported a success and then removed the source, and the file was gone. The walk still copies everything it can and reports its first failure at the end. A failed `readdir` or `lstat` during the walk, or a symlink that resolves to nothing, threw from an async callback, and an existing destination that could not be cleared called `process.exit(1)`; each now reaches the callback. Check your builds: `bundle:build`, `project:build`, `bundle:copy` and `bundle:add` now fail on a file they could not read, where they silently left it out. Server-side: a bundle restart picks it up.'
time: 2026-10-31T09:36:54+01:00
