kind: Fixed
body: '`PathObject.cp()` and `.mv()` now refuse a folder copied or moved onto a folder that holds it, or into itself (#B1050). The copy clears an existing destination first, so `cp(parent/child, parent)` destroyed the whole of `parent`, source included, and then threw from an async callback as an uncaught exception. A folder copied into itself walked its own copy until the path was too long, never called back, and left that nest on disk. Both now reach the callback with an `Error` coded `EINVAL` before anything is written, whatever the spelling, the case or a symlinked parent. A `.cp()` into itself with an `excluded` list still runs, since the list can leave the destination out of the walk. Server-side: a bundle restart picks it up.'
