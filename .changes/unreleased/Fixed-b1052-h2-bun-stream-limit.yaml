kind: Fixed
body: 'On Bun 1.4, an HTTP/2 `self.query()` session no longer stops sending at the upstream''s stream limit (#B1052). Gina dropped every listener of a finished stream, and on Bun 1.4 one of them gives the stream''s slot back to the count against the upstream''s `SETTINGS_MAX_CONCURRENT_STREAMS`, so up to 0.7.7, after as many completed calls as that limit (256 against an Isaac upstream''s default), every later call on the session waited for a slot that never came: it failed `TIMEOUT` with a short `requestTimeout`, never called back with the default one, and the session did not recover (6 minutes measured). A finished stream keeps its listeners on Bun. Node.js and Bun 1.2 and 1.3 were not affected. Server-side: restart the bundle.'
