kind: Fixed
body: 'On Node.js 24, Node.js 26 and Bun 1.4, an HTTP/2 `self.query()` call sent on a session that had just been destroyed is now re-sent on a fresh session, as the HTTP/2 resilience guide describes (#B1054). Up to 0.7.7, on a connection that had silently dropped, a call whose pre-flight PING was pending when the keepalive deadline destroyed the session failed with a 500 `STREAM_ERROR` « The session has been destroyed », for any method, though nothing had been sent. Node.js 22 and 25 and Bun 1.2 and 1.3 already recovered. Server-side: restart the bundle.'
time: 2026-10-31T14:29:29+01:00
