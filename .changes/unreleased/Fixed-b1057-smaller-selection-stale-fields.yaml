kind: Fixed
body: 'A staged file input that held several files and then took a selection of fewer files no longer posts the files it replaced. The page showed the new files only, but the hidden fields of the indices the new selection no longer has stayed in the form, so the save posted the replaced files beside the new ones: three files staged, then one, posted all three. Those fields are now taken out when the new staging succeeds, as a reset takes them out: a field marked `data-gina-form-upload-is-locked` stays, and a later, larger selection brings back the fields the page declared at those indices. On an edit form that shows saved files, a selection of fewer files than the saved ones now posts the new files only, as the page shows; the fields of the saved files at the other indices were posted with them. (#B1057)'
