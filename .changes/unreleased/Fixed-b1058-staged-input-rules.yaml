kind: Fixed
body: 'A rule on a staged file input (`data-gina-form-upload-action`), declared under the input''s name, runs again. Since 0.7.2 the input was collected without a value, so none of its rules ran, and `isRequired` on it let the form be sent with no file. With a rule, the input is now judged on the files it holds: the files it staged, a selection still staging, and the saved files an edit form shows. A required staged input with no file refuses the submit and is marked `aria-invalid`. Its own value (the browser''s `C:\fakepath\` placeholder) is still never sent: the files travel through their staged fields. On a live-checked form the submit trigger follows those files: a required staged input keeps it closed until a file is chosen, and closes it again after a reset or a failed staging. A staged input without a rule is unchanged. Declare such a rule at the top level of the rule file, under the input''s name: a rule that a `_case_` condition adds is not applied to a staged input, and a key written as a regular expression does not match one. On the server, an input with no file sends none of the fields gina writes for its files, and `gina.plugins.Validator(rules, data, formId)` checks only the fields present in the data it is given: give it an empty string under the input''s name when the body has none, or check for the files in your action. (#B1058)'
