kind: Fixed
body: 'A rule on a staged file input (`data-gina-form-upload-action`), declared under the input''s name, runs again. Since 0.7.2 the input was collected without a value, so none of its rules ran, and `isRequired` on it let the form be sent with no file. With a rule, the input is now judged on the files it holds: the files it staged, a selection still staging, and the saved files an edit form shows. A required staged input with no file refuses the submit and is marked `aria-invalid`. Its own value (the browser''s `C:\fakepath\` placeholder) is still never sent: the files travel through their staged fields. On a live-checked form the submit trigger follows those files: a required staged input keeps it closed until a file is chosen, and closes it again after a reset or a failed staging. A staged input without a rule is unchanged. (#B1058)'
