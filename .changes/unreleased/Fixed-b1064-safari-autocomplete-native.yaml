kind: Fixed
body: 'On Safari, a live-checked `<input>` with `autocomplete="off"` (or `"false"`) behaves natively while it has focus (#B1064): Enter submits the form, `maxlength` holds, ArrowUp, ArrowDown and Shift with an arrow work, `input` and `beforeinput` fire for each key, and a `query` rule waits for the typing pause instead of sending one request per key. A `readonly` you write stays yours: in the markup or from a script, at any time, gina neither lifts it on focus nor replaces it on blur, where it used to lift it on every focus. The field itself is still `readonly` until it has focus, because Safari''s form fill skips a readonly control; gina now writes that as `readonly="gina"`, which `[readonly]` selectors and the `readOnly` property still see, and which a selector on the old value, `[readonly="readonly"]`, no longer matches. Browser-bundled: restart the bundle and re-bake it (`gina bundle:build`).'
