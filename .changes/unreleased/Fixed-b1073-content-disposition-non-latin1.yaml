kind: Fixed
body: 'A download whose file name holds a character above U+00FF (a decomposed accent, a typographic apostrophe, CJK, emoji) now names the file (#B1073). `downloadFromURL`, `downloadFromLocal` and `serveFromStorage` wrote the name raw into the `Content-Disposition` header, which Node refuses on HTTP/1.1: the first two answered 500, and `serveFromStorage` with `download` or `filename` exited the bundle process, because it sets that header inside the storage driver''s callback. On HTTP/2 the name came out mangled or missing. Such a name is now sent as a Latin-1 `filename` fallback followed by the RFC 8187 `filename*` parameter (UTF-8); a name Node already accepted keeps exactly the bytes it had, and a decomposed accent is normalised to its precomposed letter. A header error inside `serveFromStorage` now answers 500 instead of exiting the process. The browser bundle''s XHR download path (`data-gina-link` links, form downloads) reads `filename*`. Pickup: a bundle restart and a re-bake.'
