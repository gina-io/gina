kind: Fixed
body: '`self.sendTrailers(fields)` delivers its fields over HTTP/2. In every release from 0.4.0, which added trailer support, through 0.7.8, the render delegates sent the fields from their own `wantTrailers` listener, which runs after the one the HTTP/2 compatibility response registers when it is built; that one had already sent the response''s own, empty, trailer list, so no field arrived (no trailer block, or an empty one on Bun 1.2.21). `renderJSON`, `renderStream`, `renderXML`, and `render` with swig or nunjucks (from disk or a memory loader, with or without bundle middleware) now hand each field to the compatibility response (`response.addTrailers()`), which sends them after the body. A field the HTTP/2 layer could not send is dropped when it is recorded, and the others are sent: a name that is not an HTTP token, a connection-specific name (`connection`, `upgrade`, `http2-settings`, `keep-alive`, `proxy-connection`, `transfer-encoding`, and `te` unless its value is `trailers`), a value that is neither a string nor a number, or a string value holding a character other than a tab, U+0020 to U+007E and U+0080 to U+00FF (a CR, a LF, a NUL or another control character, DEL, or a character above U+00FF). Names are sent lower-case. An answer that `throwError()` gives (a custom error page, a JSON error body) carries no trailers: it drops the fields recorded before it. A HEAD and a 204 carry none, as before: their stream ends with its headers. An action that answers on `res.stream` itself and sends trailers from its own `wantTrailers` listener still sends none: call `res.addTrailers(fields)` before `res.stream.respond(headers, { waitForTrailers: true })`. (#B1080)'
