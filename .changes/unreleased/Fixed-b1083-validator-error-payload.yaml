kind: Fixed
body: 'A form''s error callback (`data-gina-form-event-on-submit-error`, the `error.<id>` event) now says that the server answered and what it answered: whenever an answer came back, the payload carries `transportError: false` and `contentType` (the answer''s `Content-Type` as the browser reads it, `null` when there is none; a JSON error body that carries its own `contentType` keeps it, except in an answer sent as an attachment). An answer that is not JSON, such as a reverse proxy''s `502` page, still arrives whole in `message`, so check `contentType` before showing it. Before, a server error carried no `transportError` key at all, although the forms guide says `false` (a check `data.transportError === false` never matched), and nothing told a proxy''s HTML page apart from a message the application wrote. An answer sent as an attachment now keeps a body that is not JSON in `message` too; that body used to be dropped. A failure to handle a `2xx` answer (a JSON body that does not parse), reported as `422`, carries both keys as well. (#B1083)'
