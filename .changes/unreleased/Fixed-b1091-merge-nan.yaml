kind: Fixed
body: '`merge()` returns when an array holds object elements and then `NaN` (#B1091). When an array inside an object the target lacks held two or more object elements followed by `NaN`, or when an array was merged with itself, `merge()` never returned: it kept pushing the `NaN` onto the source array it was walking until the heap ran out. Its primitive merge decided whether a value was already present with `indexOf`, which never finds `NaN`. A `NaN` is now present once the result holds one, and it is never topped up: `[1, NaN]` + `[NaN, 2]` gives `[1, NaN, 2]` (it gave `[1, NaN, NaN, 2]`), and merging the same source a second time is a no-op for `NaN` too. The request parsers produce no `NaN` (form and query values arrive as strings, and JSON has no `NaN`), so this takes a `NaN` the application computes. Every other value merges as before. The browser bundle carries the same fix. Pickup: a bundle restart and a re-bake.'
