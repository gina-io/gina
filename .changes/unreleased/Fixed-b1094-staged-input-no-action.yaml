kind: Fixed
body: 'A staged file input that has no `data-gina-form-upload-action`, on a page without an `upload-to-tmp-xml` route to fall back on, now refuses a chosen or dropped file before any request is sent (#B1094). The file used to be posted to `/null`, and the 404 that answered was reported as a failed staging. Now the input''s error element shows « photo.png was not uploaded » (a new `uploadNotSent` string, translatable through `gina.config.a11y`), the form''s live region announces it, and the input''s `data-gina-form-upload-on-error` callback runs with `{ refused: true, reason: ''action'', files, error, transportError: false }`. The input is emptied once its `change` event is over, and the files it already held keep their previews, links and hidden fields. In dev mode a console error names the missing attribute.'
