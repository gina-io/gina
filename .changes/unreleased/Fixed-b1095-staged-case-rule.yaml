kind: Fixed
body: 'A rule that a `_case_` condition gives a staged file input now judges the files the input holds (#B1095). With one `_case_` key the rule was never applied, so a required staged input refused nothing; with two or more, the condition of a driver that is not the last one judged the input''s own value, so an edit form showing a saved file was refused, and a file that had just been staged passed on the browser''s placeholder. The submit control also follows the input''s files when the form''s rules hold a `_case_` key. A top-level rule key written as a regular expression that matches the input''s name was already a rule of its own, which judges the files since 0.7.9. The browser bundle carries the fix. Pickup: a re-bake.'
