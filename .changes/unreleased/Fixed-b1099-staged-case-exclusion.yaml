kind: Fixed
body: 'A staged file input''s value is no longer posted when the input has a rule at the top level of the form''s rules and a matching `_case_` condition names it too (#B1099). Since 0.7.9 a rule of a staged input judges the files it holds, and the value it judges (the names of those files, or an empty value) is left out of the data. In that shape the value was posted beside the input''s hidden fields: when the page renders saved-file fields before the input, it replaced the array of the files'' records, and with no file it was posted as an empty value. Every staged input is left out now, whichever rule judged it. The browser bundle carries the fix. Pickup: a re-bake.'
time: 2026-11-05T13:28:03+01:00
