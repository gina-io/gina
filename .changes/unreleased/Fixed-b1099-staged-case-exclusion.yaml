kind: Fixed
body: 'A staged file input''s own value is no longer sent with the form''s data when the input has a rule of its own and a matching `_case_` condition names it too: the known issue of 0.7.9 (#B1099). A rule of its own is one declared at the top level of the rule file under the input''s name, or a top-level key written as a regular expression that matches it. Since 0.7.9 such a rule judges the files the input holds, and the value it judges (the names of those files, or an empty string) is left out of the data; in that shape it was sent. If fields of the input''s files came before it in the form, that value landed in the files'' list: under a top-level name such as `doc` it replaced the list, and the fields that came before it were lost; under a nested name such as `doc[files]` the list ended with that string. Every staged input is left out now, whichever rule judged it. The browser bundle carries the fix. Pickup: a re-bake.'
