kind: Fixed
body: 'A cached page now answers each cross-origin caller with its own `Access-Control-Allow-Origin`. With `access-control-allow-origin` set to a comma-separated list in `server.response.header`, gina answers a request with its origin when the list holds it, and with none otherwise; a hit of the output cache answered with the value picked for the request that filled the entry instead, so a caller from another listed origin was refused by its browser, and an unlisted caller, or a request without `Origin`, received the first caller''s origin. The same held for the bundle''s own origin and for an empty configured value, which both answer with the request''s origin. An entry no longer stores the header, and every hit computes it for its own request by the same rule as an uncached response, an entry stored by an earlier release included. A bundle restart picks it up (#B1104)'
