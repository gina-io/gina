kind: Fixed
body: 'A page served from the render cache on a rate-limited route no longer sends the `RateLimit` and `RateLimit-Policy` headers of the request that filled the entry: every hit answered later visitors, anonymous ones included, with that caller''s remaining quota. A hit is answered before the rate-limit gate, so it is not counted, and it now carries neither header. A bundle restart picks it up (#B1105)'
time: 2026-11-25T21:49:08+01:00
