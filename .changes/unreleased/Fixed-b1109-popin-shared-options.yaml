kind: Fixed
body: 'Popins loaded with `gina.popin.load(name, url)` and no options, or with one options object passed to several loads, no longer share one options object. Before, the second popin loaded that way took the first one''s `preOpen` (it showed the first popin''s loading shell), `loadingShell` and class, and the options object passed gained the popin''s options. `load()` now copies the options it is given and leaves the caller''s object as it was. A load without options to another site also no longer stops later popin loads to a sibling subdomain from sending credentials. Popins opened by their `data-gina-dialog` triggers were not affected. The popin plugin ships in the browser bundle: run `gina bundle:build` to pick it up. (#B1109)'
