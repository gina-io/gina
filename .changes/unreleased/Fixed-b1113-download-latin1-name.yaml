kind: Fixed
body: 'A download name holding a Latin-1 letter (`résumé.pdf`, `Accusé de réception.pdf`) is now sent by `self.downloadFromLocal()`, `self.downloadFromURL()` and `self.serveFromStorage()` (on its in-process path; the `s3` offload path is unchanged) with an RFC 8187 `filename*=UTF-8''''…` parameter after an all-ASCII `filename` fallback (`resume.pdf`). Such a name was sent as raw bytes in `filename="…"`, which Chromium and WebKit decode as UTF-8, so the browser saved the file with U+FFFD in place of each accented letter. The fallback drops accents and writes `?` for any other non-ASCII character, so a client that reads only `filename` (`curl -OJ`) saves `resume.pdf`; a name above U+00FF now gets the same fallback, and a printable ASCII name keeps the header it had. (#B1113)'
time: 2026-11-08T04:14:49+01:00
