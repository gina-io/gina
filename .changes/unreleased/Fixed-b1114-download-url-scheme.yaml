kind: Fixed
body: '`self.downloadFromURL(url)` now answers a 500 through `throwError()` when `url` is not a string, and accepts only the `http` and `https` schemes. A url that was `undefined`, `null` or a number made the method throw inside its promise, so the request got no response; a scheme such as `httpfoo` passed the old check and the method rejected with « Cannot find module », also with no response, and `http2` loaded Node''s http2 module before failing. Such schemes now get the « Scheme not supported » 500 that `ftp` already got. (#B1114)'
time: 2026-11-07T20:33:46+01:00
