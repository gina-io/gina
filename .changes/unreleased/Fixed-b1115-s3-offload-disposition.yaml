kind: Fixed
body: 'On the `s3` storage adapter, a download served through the offload path (`self.serveFromStorage()` with `download` or `filename`, or the driver''s own `resolve()` with them) now signs the `Content-Disposition` value the in-process path sends: a name of printable ASCII keeps its quoted `filename`, and any other name gets an all-ASCII `filename` fallback (`resume.pdf`), then `filename*=UTF-8''''…`. The presigned `response-content-disposition` carried the name raw, and the provider copies it into its response header: AWS S3 sent a Latin-1 name such as `résumé.pdf` back re-encoded as ISO-8859-1, which Chromium and WebKit save with U+FFFD in place of each accented letter, and refused any name with a character above U+00FF (`l’offre.pdf`, a CJK or emoji name) with `400 InvalidArgument`, so the download failed after the redirect; MinIO sent the name back unchanged. `offload: false` avoided it. (#B1115)'
