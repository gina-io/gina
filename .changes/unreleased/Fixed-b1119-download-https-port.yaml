kind: Fixed
body: '`self.downloadFromURL(url)` now sends an `https` url that names no port, such as `https://example.com/brand/logo.png`, to port 443. Its defaults carried `port: 80`, so such a url opened TLS on port 80 and the download answered 500. A port in the url or in `options.port` is used as before, and an `http` url without one still goes to port 80. (#B1119)'
time: 2026-11-09T12:32:12+01:00
