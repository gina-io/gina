kind: Fixed
body: 'On a route with `culturePrefix: true`, `req.culture` now takes the URL value of the segment bound to `param.culture`, as the i18n guide describes: `GET /fr/dashboard/42` gives `fr`, also when a cookie or `Accept-Language` asks for another culture. The negotiator read `req.routing.param.culture`, the route''s configuration, where a binding such as `"culture": ":culture"` keeps its placeholder text, so the URL step never matched a catalog and the request took its culture from the cookie, `Accept-Language` or the bundle default. A literal `param.culture` is used as before. Bind the culture segment in `param`: a `:culture` segment left out of it makes the route match nothing. (#B1123)'
time: 2026-11-15T11:59:24+01:00
