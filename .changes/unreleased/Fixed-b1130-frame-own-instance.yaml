kind: Fixed
body: 'A gina page loaded in a same-origin frame now starts its own client instead of taking over the parent page''s. Up to 0.7.10 the client merged the parent frame''s `gina` instance into the frame''s at start-up, and the parent''s values won: the frame''s loader stopped at once, so its own configuration, session and forms were never applied, its popin, validator and navigation were not started, and `new Popin()` in the frame looked for the parent''s popin container in the frame''s document and threw `Cannot read properties of undefined (reading ''addListener'')`. Every document now has its own instance and the client no longer reads its parent frame at all, so a cross-origin parent (0.6.28) cannot interrupt the start-up either. Code in a frame that read its parent''s values through its own `gina` now reads its own; read `parent.gina` where the two pages share an origin. The client ships in the browser bundle: run `gina bundle:build` to pick it up. (#B1130, gh#103)'
