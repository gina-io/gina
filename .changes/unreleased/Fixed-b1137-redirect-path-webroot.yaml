kind: Fixed
body: 'Under a non-root webroot, a `routing.json` redirect route that sets `param.path` now redirects to that path under the webroot: with the webroot `/web/`, `"path": "/general"` and `"path": "general"` answer `/web/general`, and `"path": "/"` answers `/web/`. The path only lost its first character, so the `Location` was relative (`general`, `eneral`, or empty) and the browser resolved it against the request URL. A custom action that calls `self.redirect(req, res, next)` on a route with `param.path` gets the same. Every other reader gets `param.path` as written, where it got it without its first character: a page route whose `param.path` names its template file, and an action that reads `param.path`. `ignoreWebRoot`, a `route` target and an absolute URL are unchanged; a route that relied on the relative `Location` can set `ignoreWebRoot: true` with the full path, which answers the same before and after. Pick it up with a bundle restart. (#B1137)'
