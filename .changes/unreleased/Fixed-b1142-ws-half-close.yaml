kind: Fixed
body: 'A WebSocket-over-HTTP/2 session now closes with `1006` as soon as the peer ends its stream without a Close frame, and ends its own side. It used to stay open until the application closed it or the HTTP/2 connection ended, holding one of the connection''s concurrent streams. A Close frame followed by the end of the stream still closes with the peer''s code. Restart each bundle after the upgrade (#B1142).'
