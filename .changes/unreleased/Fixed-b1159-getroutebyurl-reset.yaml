kind: Fixed
body: 'A route lookup through `lib.routing.getRouteByUrl()` now leaves the request as it found it when a candidate rule does not match: the values that rule bound into `req.params` and into the request method''s bag (`req.get`, `req.post`, ...) are undone before the next candidate and after a lookup that matched nothing. The matched route''s own value could lose to a failed candidate''s in the bag, and `self.redirect()`, which looks its target up with the request''s method and then with GET, could carry a failed candidate''s value across a POST→GET redirect. The bag keeps its object: `req.body`, `req.query` and an array body stay shared. `lib/routing` is in the browser bundle: restart each bundle and run `gina bundle:build` after the upgrade (#B1159).'
time: 2026-11-28T11:16:02+01:00
