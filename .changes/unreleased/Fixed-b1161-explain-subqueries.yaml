kind: Fixed
body: 'The Inspector''s Query tab no longer marks a Couchbase statement "no index — full bucket scan" (the red badge, counted in the "queries without index" banner) when its reads sit in subqueries. Couchbase plans a `LET` or `WITH` subquery, a correlated subquery and a nested subquery apart, and lists their plans beside the statement''s own plan, which was the only plan the badge read. The badge now reports the indexes of every subquery plan as well, each index once; a subquery in a `FROM` clause was already reported, as Couchbase plans it inside the statement. A statement that reads no keyspace at all, such as `SELECT 1` or an `INSERT … VALUES`, now shows a green "no keyspace read" chip instead of the red badge; a plan holding any other operator keeps the previous reading. A bundle restart picks it up (#B1161)'
