kind: Fixed
body: 'A cached route''s response now names, in `Vary`, the request headers its page depends on. The page follows the visitor''s language (the `Accept-Language` header or the culture cookie) and, behind a proxy, the forwarded host, scheme and prefix, and it is sent with `Cache-Control: <visibility>, max-age=<seconds>`; it carried no `Vary`, so a browser kept the copy it held for the page''s whole `max-age` after the visitor''s language changed. The response that fills a cache entry and every hit now append `Accept-Language, Cookie, X-Forwarded-Host, X-Forwarded-Proto, X-Forwarded-Prefix` to `Vary`, after the names it already carries (a configured `vary: Origin` stays first), and the entry stores them. `Vary: Cookie` makes a browser fetch the page again after any cookie changes, and most shared caches do not reuse a response that varies on `Cookie`. A bundle restart picks it up (#B1164)'
