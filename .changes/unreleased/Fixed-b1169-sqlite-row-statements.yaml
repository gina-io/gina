kind: Fixed
body: 'A SQLite `.sql` method whose statement starts with `WITH`, `VALUES` or a `PRAGMA` that reads a value returns its rows: the connector read rows only from a statement starting with `SELECT` and ran every other one with `run()`, so those methods returned `{ changes: 0, lastInsertRowid: 0 }` with no error. It now asks each prepared statement once, when the bundle loads it, whether it returns rows: `columns()` on node:sqlite (from Node 22.16.0 and 23.11.0), `reader` on bun:sqlite, and the leading keyword where the statement offers neither. A method whose statement is `INSERT`, `UPDATE` or `DELETE … RETURNING` now returns the rows its `RETURNING` clause lists instead of the write''s `{ changes, lastInsertRowid }`. A bundle restart picks it up (#B1169)'
