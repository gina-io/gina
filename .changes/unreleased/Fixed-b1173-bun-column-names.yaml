kind: Fixed
body: 'On a Bun whose bun:sqlite statements carry no `reader`, as on Bun 1.2.21, the SQLite connector asks each statement''s `columnNames`, the column list bun:sqlite reports, whether it returns rows, so there too a `.sql` method whose statement is a `WITH` clause feeding a write returns `{ changes, lastInsertRowid }`, and one whose statement is `INSERT`, `UPDATE` or `DELETE … RETURNING` returns its rows. A bundle restart picks it up (#B1173)'
