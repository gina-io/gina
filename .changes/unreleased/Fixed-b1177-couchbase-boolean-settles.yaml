kind: Fixed
body: 'A Couchbase statement annotated `@return {boolean}` could leave its caller waiting forever: when it matched no row (a `SELECT` without `COUNT(`, a `COUNT(` with `GROUP BY` that matched nothing, a write without `RETURNING`), when it returned a `null` row, and on every failed query, `COUNT(` statements included. The connector turned an empty result into `null` and then read its length inside the driver''s result callback; the throw was only logged, so the request got no response. A boolean statement now settles `false` when no row comes back and `true` when one does, a failed query rejects with its own error, and a throw left in either result handler settles the call with that error instead of leaving it waiting. A write needs `RETURNING` for its `@return {boolean}` to report the rows it changed. Restart each bundle after the upgrade (#B1177).'
