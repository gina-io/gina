kind: Fixed
body: 'The form validator''s upload trigger warning now names only a control the page has to provide: a saved file''s delete link, or an id declared with `data-gina-form-upload-reset-trigger` or `data-gina-form-upload-delete-trigger` that matches no element. It warned "did not find `upload reset trigger`" at the first selection of every upload input, for the reset control Gina adds itself once the staging succeeds (twice when the input had no preview container), and a `$forms[id].reBind()` of an edit form warned "did not find `upload delete trigger`" for a saved file''s delete link that was on the page and already bound. Removing a file works as before. One case still warns: a `reBind()` after a file was staged reads the staged file''s preview as a saved file and looks for its delete link. Re-bake your bundles (#B292).'
