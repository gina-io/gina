kind: Fixed
body: 'A staged upload no longer writes a flat `<prefix>[i][preview]` hidden input valued `[object Object]` into a form that declares no `[preview][...]` sub-fields. The client layer auto-creates one hidden input per metadata field the form did not declare, and `preview` — whose value is an object, not a string — was auto-created like the others, so when the staging response carried a `preview` object the shared assignment string-coerced it and the real form''s submit posted the literal text. That form now posts no `preview` field at all, matching the documented field set; the thumbnail still renders from the response, and a form that declares the `[preview][location|uri|width|height]` sub-fields is unchanged — declaring them remains the way to persist the preview. Server code that keyed on the presence of a `preview` field for such forms should key on its value: the field was garbage before and is absent now. The fix is in the browser bundle, so bundles must be rebuilt (re-baked) as well as restarted. (#B459)'
