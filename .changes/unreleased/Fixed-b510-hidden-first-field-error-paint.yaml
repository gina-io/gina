kind: Fixed
body: 'A server-side field error now reaches the visible control when two controls share a `name` and the hidden one comes first in document order. The client-side error painter walked the form in document order and stopped on the first control whose name matched, whether or not it could paint it — and a bare `type="hidden"` control never can — so with the recommended shape for a control that must render disabled yet still post (a visible control plus a hidden twin carrying rule `"exclude": false`), the hidden twin consumed the error: no message, no `aria-invalid`, and on a shared wrapper the error class was set with nothing inside it. A bare hidden control is now skipped when another control of the same name can be painted; a hidden control that is the only one of its name keeps the former behaviour, and a hidden control inside a `form-item-wrapper` is still painted after its wrapper. The fix is in the browser bundle, so bundles must be rebuilt (re-baked) as well as restarted. (#B510)'
