kind: Fixed
body: 'A path-form `getUrl` route containing `@` — the retina-asset idiom `''/assets/img/common/header@2x.png'' | getUrl` — no longer renders a 500. Both the swig and the nunjucks filter split every `@`-bearing route as `rule@bundle` before checking whether it was a path, cut the path at the `@`, failed the bundle lookup on the remainder and called `throwError(500)` in the middle of the template, so the page came back as a 500 while the action''s own render was discarded. A route with a leading `/` now bypasses the split on both engines. One consequence to know: a path-form route cannot name a bundle in-string (`''/x.png@web''`) — pass the bundle as the filter''s base argument (`| getUrl(null, ''web'')`), which was already the working form and is unchanged. (#B511)'
time: 2026-09-08T01:02:48+01:00
