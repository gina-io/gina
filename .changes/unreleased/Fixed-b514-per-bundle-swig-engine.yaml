kind: Fixed
body: 'The default swig render path now renders through a per-bundle engine instead of the process-wide swig singleton, so one bundle''s template root can no longer reach another bundle''s `{% include %}` / `{% extends %}` resolution. `controller.js` stamped a per-bundle loader onto the shared engine with `swig.setDefaults({ loader })` once per render, and the render delegates then await before compiling — the same interleave window that produced the render-context bleed fixed alongside this. In merged-process mode (several bundles sharing one process and port) a concurrent bundle''s stamp lands inside that window, so a resumed render resolves its layout and includes against the other bundle''s templates root, or trips swig-core''s outside-root refusal. Each template root now gets its own `new swig.Swig({ loader })` instance, keyed and owner-guarded exactly like the async delegate''s registry, and `self.engine` points at it so a bundle''s own `controllers/setup.js` filters register on the engine that actually renders it. A per-call `loader` passed to `swig.compile()` was measured to be incapable of fixing this: swig-core merges per-call options into a local that never leaves `parse`, while the parent-chain walk and `parseFile` read the instance loader unconditionally, and the include codegen carries only `resolveFrom`. The module-level `setDefaults` is deliberately kept, because the framework still compiles inline routing and asset strings through the module. No consumer was measured to be exposed: there is no supported CLI path to a shared port, and the one runtime measurement on record reports that sibling bundles are not served in merged mode at all, so this is a structural fix rather than a response to a reachable trigger. Pickup: a bundle restart; no re-bake. (#B514)'
