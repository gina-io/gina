kind: Fixed
body: 'The `getUrl` template filter degrades instead of throwing in a render context that has no request, or no bundle configuration (#B516). On both the swig and the nunjucks engine the filter sent every rule form (`''home'' | getUrl`, `''home@admin'' | getUrl`) and every path given a bundle as its base through a branch that read the request''s headers unguarded, and it read the context''s bundle configuration unguarded before that. A context built outside a request - a mail or scheduled-task renderer that calls the filter factory itself - threw `TypeError: Cannot read properties of undefined (reading ''headers'')`, and a context with no bundle configuration threw on every form, a plain path included. Such a render now gets its URL from the target bundle''s configured hostname, or from the worker''s proxy host when one is known, as a `getRoute()` call with no request in scope does; it never carries `:NaN` or `scheme://undefined`. Two cases still throw, with a named `Error`: a base naming an unknown bundle when the context has no `throwError`, and a render for which no bundle configuration resolves. A request render is unchanged. Server-side only: restart the bundle.'
