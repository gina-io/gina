kind: Fixed
body: '`filter(fn)` on a `Collection`, or on an array one of its query methods returns (`find()`, `orderBy()`, `limit()`, `notIn()`, and so on), now filters like `Array.prototype.filter`: the callback gets `(row, index, array)`, a second argument is its `this`, and the result keeps the methods of a `find()` result, so `.toRaw()` and the chain still work. Those arrays carry their own `filter`, a field projection, and it read a function as a field name: `rows.filter(fn)` returned an empty array with no error. A field name or a list of field names still projects each row (#B517).'
