kind: Fixed
body: '`self.throwError(err)` with a single error object now keeps the object''s `message` and its `ref`, as the `(code, err)` and `(res, code, err)` forms already did. A plain object kept only its `status` and `error`: its `message` reached neither the JSON body, nor the built-in error page, nor the incident log line, and a `ref` on a plain object or on an `Error` was replaced with a fresh one. This hit the relay between bundles: `self.query()` hands its callback the upstream''s error body as a plain object, so `return self.throwError(err)` answered without the upstream''s sentence, under a ref that matched no upstream log line. A ref is still kept only when relay-safe, and `error` is unchanged. A fast lane route''s `ctx.error(err)` answers the same way (#B518).'
