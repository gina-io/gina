kind: Fixed
body: 'The server-side `query` validation rule no longer writes into the shared `app.proxy` configuration. A `query` rule that targets another bundle (`check-user@otherbundle`) bound its request options straight to that bundle''s proxy target inside the process-wide `app` config — the global two-argument `getConfig()` hands its result back by reference — then set `method` and `path` on it, and the framework''s own query path added a `requestTimeout` taken from the calling route''s `queryTimeout` before making its defensive copy. All three persisted for the life of the process. The consequential one is `requestTimeout`, because it is the key the framework reads back. Once a stale value sits on the shared target, the guard that fills it in (`typeof options.requestTimeout === ''undefined''`) can no longer fire, so a later live-check from a different route silently runs on the earlier route''s deadline instead of its own — measured: a route asking for 9s governed by a polluted 1s, against an unpolluted control that correctly used its own. On HTTP/2 that does more than end the call early: the stream-timeout handler evicts and destroys the pooled session for that upstream — shared with every other request to the same authority, measured as one reused client object — and then re-issues the request up to three times. So one route''s live-check could degrade traffic that never touched the rule. It only affects proxy targets that leave `requestTimeout` unset, and a timeout is always armed, so nothing hangs. A configured `path` prefix was overwritten too, and that is a documented `proxyTarget` property rather than a stray key — but it is worth being exact: no part of the framework consumes that value (the two other readers of the target overwrite it or ignore it, and nothing prepends it to an outgoing request), so its effect is on anything in your own code that reads the proxy configuration back. The rule now clones the proxy target before using it; nothing about the outgoing request changes. Present in every release that carries the rule (measured back to `0.3.7`). Pickup: a bundle restart AND a re-bake — measured by identity, `gina.min.js` changes while `gina.min.css` stays byte-identical. (#B522)'
