kind: Fixed
body: 'The server-side `query` validation rule no longer writes into the shared `app.proxy` configuration. A `query` rule that targets another bundle (`check-user@otherbundle`) bound its request options straight to that bundle''s proxy target inside the process-wide `app` config — the global two-argument `getConfig()` hands its result back by reference — then set `method` and `path` on it, and the framework''s own query path added a `requestTimeout` taken from the calling route''s `queryTimeout` before making its defensive copy. All three persisted for the life of the process. Because `path` and `requestTimeout` are configurable `proxyTarget` properties, a configured `path` prefix was OVERWRITTEN with the last-checked route''s url, and that was visible to every other reader of the same configuration — this was not merely stray keys added alongside. The rule now clones the proxy target before using it; nothing about the outgoing request changes. Present in every release that carries the rule (measured back to `0.3.7`). Pickup: a bundle restart AND a re-bake — measured by identity, `gina.min.js` changes while `gina.min.css` stays byte-identical. (#B522)'
