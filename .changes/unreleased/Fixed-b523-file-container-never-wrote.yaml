kind: Fixed
body: 'The logger''s opt-in `file` container connected to the MQ, received every log line and wrote nothing to disk. `setup()` was driven from an argv-derived bundle list that is structurally always empty in a bundle process: it is populated only when `process.argv` matches `bundle:start|stop|restart`, while `core/gna.js` splices argv down to `[node, appPath]` for every process loaded through the CLI. No filename was ever assigned, so each line fell through to a guard that queued it in memory instead. The group is now taken from the logger''s own name, with per-group setup on the first line for a group not yet seen, so merged-process mode is covered too. The container also reopened the file for every single record via `fs.writeFile` with an append flag, which gave concurrent write callbacks no ordering guarantee and left no descriptor for a rotator to rename; it now holds one append stream per group. Measured on a live isolated boot: three runs produced no file at all before the fix and a correctly written, correctly rotated file after, with the enabled flow confirmed as a positive control. (#B523)'
