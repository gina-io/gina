kind: Fixed
body: 'The logger''s opt-in `file` container is now an in-process transport, and writes. It connected to the MQ, received every log line and wrote nothing to disk: the filename was resolved from an argv-derived bundle list that is structurally always empty in a bundle process, because the framework splices `process.argv` down to `[node, appPath]` for every process loaded through the CLI. Fixing that exposed three further defects, each measured on a live daemon topology. Enabling the flow killed the framework daemon: the container dialled the MQ port at construction, that dial happens before the daemon binds its own listener, and the socket error handler called `process.exit(0)` — so `gina start` died before reporting itself ready, and a bundle started without a daemon exited with status 0 one second after boot (#B526). The MQ listener forwards every line to every file-writing session, so each process carrying the flow wrote every bundle''s lines into one shared per-host file and built a full configuration for a bundle it is not, which crashed `gina bundle:start` (#B527). Several processes appending to one file each kept their own rotation state and size counter, so rotation raced and lost lines with no warning. The container now consumes the same in-process event the stdout container consumes and writes only the lines its own process logged, to a file named after the log group — one writer per file, no socket, and no daemon required, so it also works inside a container. Lines whose group is not a bundle, meaning the CLI''s and the daemon''s own output, are not filed, which is the guard the previous write path already applied. Records are written without ANSI escape sequences, and `GINA_LOG_FORMAT=json` is honoured (#B529). A failed open or write is reported once and retried rather than leaving the sink silently dead (#B530), and the container reports through the log flows instead of a raw stdout write that reached nobody under a daemon (#B528). (#B523)'
