kind: Fixed
body: '`gina-container` now applies the documented container logging preset itself. Unless `GINA_LOG_STDOUT` is already set, the launcher sets it to `true` before its own logger and the bundle initialise, so a bundle it runs emits JSON lines and skips the MQ transport — instead of writing ANSI-coloured text into the container stdout while two processes, the launcher and the bundle, keep dialling an MQ listener that cannot exist in that topology. Images synthesised by `gina image:build` inherit the change, since their entrypoint runs `gina-container`. Explicit values win: `GINA_LOG_FORMAT=text` keeps the coloured text with the dial still skipped, and `GINA_LOG_STDOUT=false` restores the previous behaviour in full. Bundles started through a framework daemon (`gina start` + `gina bundle:start`) are unaffected — there the MQ transport feeds `gina tail` and stays on. (#B524)'
