kind: Fixed
body: 'An error raised by the global `getConfig()` / `getLib()` helpers is now answered to the request whose call failed, rather than to whichever request was routed most recently. Those helpers resolve the response to write through a process-wide context slot that the router fills on every routed request and never clears. With one request in flight and another routed behind it, a callback resuming after an await found the later request''s response there: it wrote its own failure to that client, and its own caller was never answered at all — the request simply hung until the caller''s timeout, presenting as an upstream fault rather than an error. The incident reference added in the previous release made the diagnosis harder rather than easier here, because it derived the request identifier from the same wrong response, so the correlation line named a request that had nothing to do with the failure. Both now come from the per-request context the server establishes for every request on both engines, which follows the call across `await`; the process-wide slot remains only for callers that have no request context at all — boot, CLI, cron and workers — which is what it was there for. Pickup: a bundle restart. (#B534)'
