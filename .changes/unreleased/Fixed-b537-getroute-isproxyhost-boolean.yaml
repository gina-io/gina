kind: Fixed
body: '`getRoute()` now hands a caller outside any request a boolean `route.isProxyHost` even when the process never set the proxied-context latch, so cloning that route no longer logs a `JSON.clone(...) possible error detected` warning, with a stack, for a value that was legitimately unset. On the server the proxied classification comes from the request store first and, for a req-less caller (boot, CLI, cron, a bundle''s setup hook), from the `isProxyHost` context latch. The boot-time writer of that latch runs only when the project''s proxy configuration resolved a record for the running scope and env, so a bundle whose `proxy.json` exists but carries no such record boots with the latch unset, and the fallback read returned `undefined`. Every consumer reads the flag by truthiness, so no behaviour hinged on it; the cost was the warning, which the framework''s own test runs reproduce and which trains operators to ignore a diagnostic that is load-bearing elsewhere. The fallback now coerces to `false` — the idiom the sibling readers of the same latch already use — so a proxied route stays proxied, a request-scoped resolution is untouched, and the route matches its documented contract. Reach outside the framework''s test runs is code-read rather than live-driven: an application calling `getRoute()` outside a request on such a bundle, then cloning the result. Pickup: a bundle restart; `lib/routing` ships in the browser bundle, so `gina.min.js` changes (measured by identity, `gina.min.css` byte-identical) — but the client branch never produced the value and the client-side clone never warned, so a re-bake changes bytes, not behaviour. (#B537)'
