kind: Fixed
body: 'A couchbase connector that cannot reach its cluster at boot now fails loudly instead of hanging. Consumers wait on a one-shot `ready` event, and every failure path in `connect()` only re-armed a retry without ever emitting it, so the all-or-nothing ready gate in the model layer never closed, the bundle never signalled that it had started, and `bundle:start` terminated it after roughly 64 seconds with no terminal error logged anywhere. `init()` now arms its own readiness deadline and emits the failure itself, so the existing abort path (log plus exit 1) runs first. Tunable per `connectors.json` entry with `readyTimeout` (milliseconds, default 50000); a value at or above the bundle-start budget cannot take effect, since the CLI terminates the bundle first. Separately, a single failed connect attempt now reports once rather than twice: the SDK settles both its callback and its awaited promise, which armed two competing retry chains and escalated the backoff at twice the intended rate; and a rejection that never calls back no longer throws before arming any retry. Applies to both the SDK v3 and v4 connectors (#B541).'
