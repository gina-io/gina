kind: Fixed
body: 'A bundle whose release tree carries no `config/` directory no longer moves every other bundle''s configuration root. The source-tree fallback that recovers such a bundle wrote that one bundle''s own directory into the process-wide `bundles` path — the registry every other writer and reader treats as the container of ALL bundles — and reassigned the shared loop variable the same loop hands to every bundle walked after it. In a non-dev environment a later, perfectly healthy bundle therefore loaded its SOURCE config instead of its release config without a word, or died on a spliced path: the container was derived by stripping the manifest KEY from a path built from the source DIRECTORY NAME, with an unanchored and unescaped regular expression, so it produced a wrong path whenever the two differ, whenever the project path repeats the bundle name earlier (`/demo` inside `/demo-x`), or whenever the name carries a regular-expression metacharacter. The fallback is now scoped to the bundle it recovers, and the container comes from the parent directory rather than a text substitution. Separately, the three config-directory failures that abort a boot named neither the bundle nor the environment, sending up a raw ENOENT whose only clue was a path the operator had never written down; all three now refuse in the same shape as the routing.json refusal, and the last-chance one reports both the release link and the source tree it tried, in that order. And a `getInstance()` call that reaches a Config whose initialisation aborted now reports the retained reason instead of merging the global context wholesale — which on a worker returned the Config constructor itself and surfaced as an opaque `TypeError: Cannot set properties of undefined (setting ''parent'')` that named neither the bundle nor the file and repeated forever (#B542).'
