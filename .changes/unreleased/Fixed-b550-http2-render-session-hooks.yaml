kind: Fixed
body: 'An XHR redirect over HTTP/2 now delivers the session cookie it just rotated (#B550). `redirect()`''s
  XHR and popin exits answered through the raw HTTP/2 stream, which calls neither `res.writeHead`
  nor `res.end` — so a session middleware that sets its cookie from an `on-headers` hook and
  persists from an `end` proxy emitted neither, and a user signed in immediately before the
  redirect arrived unauthenticated, still presenting the session id that had just been replaced.
  Both exits now terminate through the compat response, as the sibling 303 exit always did.
  The router''s one-shot `inheritedData` consume likewise persists itself instead of relying on
  that same save-on-end proxy, so a redirect that carried a credential-bearing body no longer
  leaves it in the stored session record for the rest of the session. HTTP/1.1 was never
  affected on either engine. The ordinary render path — a `rolling` cookie that did not roll, and
  session mutations dropped during a render — is addressed by #B562 in this same release.'
