kind: Fixed
body: 'Two connectors in one bundle no longer fight over an entity class name. The framework registers each entity''s singleton in a process-wide table that was keyed on the bare class name, which is only unique within one model - so when two connectors of a bundle produced a class of the same name (guaranteed when they share a `database`, and equally possible across two databases that each carry a `user.js`), the one whose connection became ready SECOND was handed the first one''s instance and never attached its own entities. Its `getModel()` returned a bare `{ _connection, getConnection }`, and because the bundle still started and served, every call on the missing entity failed later at request time. Which connector lost depended on connection timing, so it differed between replicas of the same release, and a dev boot could not reproduce it at all. The table is now keyed per bundle, model and class name. As a safety net, a bundle whose declared entity did not reach its model now names the class and refuses to start instead of serving a half-built model layer (#B555).'
