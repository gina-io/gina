kind: Fixed
body: 'A date field no longer submits the previous day for users east of UTC. `isDate` normalised the payload the way every validator does, but it wrote a `Date` OBJECT into it — and a `Date` is the one normalised type that does not round-trip through JSON: `JSON.stringify` renders it via `toISOString()`, which yields a UTC instant. Local midnight in any positive UTC offset is the previous day in UTC, so a user in Paris who picked `2026-09-18` submitted `2026-09-17T22:00:00.000Z`, and anything reading the date part of that string stored the 17th. It was silent because the instant was well-formed, and invisible to servers and CI running in UTC. The field now keeps the parsed `Date` — so `field.isDate(mask).format(...)` chaining is unchanged — while the submitted payload takes a plain `yyyy-mm-dd` string, always, whatever the input mask: the mask governs how input is PARSED, and gina already published these fields as `{type: "string", format: "date"}` in both its routing introspection and its DTO type emission, so the payload now matches the schema it was already advertising. BREAKING for anything that consumed the old shape: `req.body.<field>` is a string rather than a `Date`, and `new Date(payload)` on a date-only string resolves to UTC midnight rather than local midnight (#B558).'
