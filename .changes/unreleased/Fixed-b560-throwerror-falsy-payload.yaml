kind: Fixed
body: '`self.throwError()` now answers the request when it is called with a falsy value. The one-argument form passes the caller''s own payload in the slot that the two- and three-argument forms use for the response, and the guard that protects it from running against an already-released response tested only that slot for truthiness. So `self.throwError(err)` where `err` was an empty string, `null`, `undefined`, `0` or `false` was mistaken for a call arriving after the response had gone: nothing was written, the request was never answered, and the only trace was a warning stating that the response had been released - which it had not - followed by no error text at all, because that message reads the status and message arguments and never the payload. Such a call now renders a 500 like any other. Genuine late calls, and calls made with no arguments, still bail exactly as before (#B560).'
