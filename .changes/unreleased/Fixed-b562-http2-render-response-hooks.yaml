kind: Fixed
body: 'On HTTP/2, a `rolling` session cookie now rolls on an ordinary rendered response, and a session mutation made while rendering is persisted (#B562). The render delegates answer on the raw HTTP/2 stream, which calls neither `res.writeHead` nor `res.end`, so middleware that installs itself by wrapping those two methods — a session''s `on-headers` cookie hook and its save-on-end proxy among them — was inert on every render: the cookie was never emitted, so a rolling expiry never rolled, and a mutation made during the render was silently dropped. A base `writeHead`/`write`/`end` is now installed on the response before the bundle middleware chain runs, so such middleware wraps it, and the six buffering render delegates hand their HTTP/2 send to that base `end` — which a session middleware invokes only once its store write has completed, so a response can no longer reach the client ahead of the record it depends on. The shim is transparent: a response that no delegate has claimed keeps its original methods, leaving redirects, statics, error pages and the built-in endpoints byte-identical. `renderStream()` is deliberately unchanged — it writes chunk by chunk from an async iterable, and buffering it would alter SSE and Range responses. HTTP/1.1 was never affected on either engine.'
