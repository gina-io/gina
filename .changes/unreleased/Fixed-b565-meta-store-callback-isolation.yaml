kind: Fixed
body: 'Fixed the storage metadata store running an application callback from inside its own try/catch. Seven methods - set, remove, acquireRef, releaseRef, listZeroRefs, removeIfZero and listKeys - invoked the callback inside the try that guards their SQLite statement, so an error thrown by the application was swallowed by the store, and the catch then invoked that same callback a second time with the application error presented as a store error. A caller that latches on first settle, as the content-addressed driver verify() does, treated the re-entry as a no-op and never completed, so the operation hung indefinitely instead of reporting. Callbacks now run after the try on every path, a genuine store error still arrives as fn(err), and get() already had the correct shape and is unchanged. (#B565)'
