kind: Fixed
body: 'A page form''s staged upload is now placed with its own form. Which popin, if any, a chosen file belongs to is decided by containment - the popin the real form is inside, captured once at selection - never by "some popin is open" (#B572). Before, a file input in a page form whose file was chosen while an unrelated popin was open - through the file-picker race (a popin opening while the OS picker is already up) or a script assigning `input.files` - had its virtual `gina-upload-*` form appended inside that popin: the staging POST succeeded, none of the generated hidden metadata fields reached the form, the form then saved without the file, and the staging request carried that popin''s `X-Gina-Popin-Id`. Nothing reported it. A form rendered inside a popin keeps the popin placement it always had. In dev mode the console now names the popin the former rule would have used. Restart and re-bake (the browser bundle changed).'
time: 2026-09-22T02:40:00+01:00
