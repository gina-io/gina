kind: Fixed
body: 'A `preOpen: true` popin opened through the declarative `data-gina-dialog` trigger with the default (modeless) modal resolution now reaches `isOpen = true`. The loading shell is born modal, which sets the dialog element''s `open` attribute to the empty string; `popinOpen` guarded its own open call with `getAttribute(''open'')`, which reads that empty string as absent, so on the modeless path it called `show()` on an already-modal dialog, the engine threw `InvalidStateError`, and the popin stayed visibly open while the framework recorded it closed - `close()` returned early, `getActivePopin()` ignored it, and a form inside it was routed as outside any popin. The guard now uses `hasAttribute(''open'')`, so both open calls are skipped for a shell-opened dialog; a modeless-declared popin that was pre-opened keeps the shell''s modal presentation, as it did before (#B574)'
