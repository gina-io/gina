kind: Fixed
body: 'A synchronous throw from a bundle''s `onInitialize` callback — or the rejection of a promise an `async` callback returns — before it has emitted `''complete''` now aborts the boot with `[ FRAMEWORK ] onInitialize threw before emitting ''complete'' — aborting boot: <reason>` on stderr and exit code 1, the same way a model-load failure does, so `gina bundle:start` reports the failure straight away and a container exits 1 with the reason in its log. Previously the throw was only logged: the boot stopped with nothing listening and no failure reported — `gina bundle:start` waited out its startup timeout and printed only "Check your logs", and under `gina-container` the process could even exit with code 0. A throw after `''complete''` still lets the bundle keep starting, and is now logged as such (#B576)'
time: 2026-09-23T01:31:27+01:00
