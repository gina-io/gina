kind: Fixed
body: 'Loading new content into a popin that is already open — `gina.popin.load(name, url)` on an open `data-gina-dialog` popin — no longer leaves the dialog empty. The landing wrote the new body and then fired the popin''s `loaded` event with the popin object as its detail, the form of that event the legacy trigger''s listener only binds on; the declarative trigger''s listener applied the detail as if it were the body, and a body that is not a string is applied as nothing, so the content just written was wiped a moment later, with no error anywhere. That listener now applies nothing for a non-string detail, and the body written by the reload stays. Legacy `data-gina-popin-*` triggers were never affected. Present in every published version since 0.4.6, which introduced the declarative AJAX path (#B579)'
