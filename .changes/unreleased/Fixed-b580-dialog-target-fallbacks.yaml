kind: Fixed
body: 'A malformed `data-gina-dialog-target` value no longer throws: `applyContent` guards the one read the selector engine can refuse, so a selector such as `#slot >` takes the documented fallback (a full replace of the dialog) instead of an uncaught `SyntaxError` inside the loaded-content and preload-consume handlers, which left the popin without its content and the open never fired (#B580). The partial swap''s two silent fallbacks are now announced in dev mode, one `console.warn` per event naming the popin, the selector and which fallback ran: a selector matching nothing in the OPEN DIALOG falls back to a full replace (as documented), and a selector matching nothing in the ANSWER writes the whole answer body into the slot - the second fallback existed before but was undocumented. Production output is unchanged: the notices are gated on `gina.config.envIsDev`, and every fallback keeps the behaviour it had. The attribute keeps its plain-selector grammar on purpose: one selector runs on BOTH sides of the swap - it locates the slot in the dialog and the region in the answer - which makes it the dialog-scoped sibling of `data-gina-form-select`, not of `data-gina-form-target`; there is nothing to resolve relative to an element, so the `this` / `closest` / `find` grammar does not apply to it, and the four keywords are valid CSS that would silently match nothing anyway. Restart and re-bake (the browser bundle changed).'
