kind: Fixed
body: 'A `${secret:...}` reference whose key breaks the placeholder grammar `^[A-Z_][A-Z0-9_]*$` — lowercase or dotted (`${secret:db_password}`), empty, or a valid token padded with surrounding whitespace — is now REFUSED at config load, exactly like a missing key: the error names the config path and the grammar, never the offending text (the internal logger names it at debug level only). Previously such a value was passed through unchanged, so the literal placeholder text reached its consumer as a credential and the only symptom was that consumer''s own failure much later, such as a database driver reporting an authentication error. Genuine mixed content (`https://${secret:HOST}/v1`) still passes through. `gina secrets:check` reports each malformed reference with its file, path and text and exits non-zero; `gina secrets:scan` lists them under "Malformed references"; `connector:test`, `connector:infer` and `connector:models` name the path instead of `<unknown>`. `lib.secrets` gains `getMalformedReferences(config)` beside `getRequiredKeys` and exports `MALFORMED_RE` beside `SECRET_RE`. A bundle that boots today with such a literal will refuse to start after upgrading — run `secrets:check` before the restart; it names every offending entry (#B583)'
time: 2026-09-22T23:00:23+01:00
