kind: Fixed
body: 'A `GINA_VERSION` that names no installed framework version is now refused before the command runs, whether it was exported or set with `--version=<v>`: the CLI exits 1 with a message naming the path it expected and, for a version number, the `env -u GINA_VERSION gina framework:add <version>` command that installs it side by side. Before, only the installed package''s own version was checked, so an exported `GINA_VERSION=latest` (or `--version=latest`, or a version number that is not installed) went on to migrate `~/.gina` to that phantom version (a `latest` entry in `main.json` and `gina.db`, an empty `~/.gina/latest/` directory, `gina version` printing `vlatest`) and the command carried on. A version installed side by side with `framework:add` is accepted as before. A `--<name>=<value>` argument also keeps its value exactly as given: when the flag name had no hyphen of its own, the value''s first hyphen was turned into `_`, so `--version=0.7.2-alpha.2` arrived as `0.7.2_alpha.2`. Entries an earlier run already wrote are not removed. Takes effect on the next `gina` command. (#B584)'
time: 2026-10-03T03:43:56+01:00
