kind: Fixed
body: 'Calling reBind() on a form no longer stacks the validator''s listeners on the form, its fields and its submit trigger: unbindForm detached nothing (its form-level removals passed the validator record, which has no removeEventListener, and its per-element removals passed no handler), so every re-bind attached one more copy of each. On Safari, one keystroke in an autocomplete="off" field inserted one character per re-bind; after a re-bind a consumer''s .on(''submit'') handler was bypassed (its registry key had been deleted, so the validator sent the form itself) and re-registering .on() attached a second handler. The binding now records every listener it attaches and unbindForm detaches exactly those, by reference. Handlers registered with .on() and the declarative data-gina-form-event-on-* hooks survive a reBind(); destroy() removes them too, unless the form has already left the document (a popin replacing or clearing its content), where they die with the element so an answer still on its way reaches them. A form bound again after destroy() claims its submit trigger again. A stray window listener registered per live-checked field is gone. The registry-restoring workaround some applications carried around reBind() is no longer needed (#B585)'
