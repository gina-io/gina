kind: Fixed
body: 'A GET or HEAD query value whose text holds a percent-escape (`%0A`, `%22`, `%5C`, `%25`) is no longer decoded a second time: it used to turn the serialized query document into invalid JSON, so `req.get` came back EMPTY for the whole request (and a `validator::` requirement copying that data 404ed the route), while `100%2525` silently became `100%`. The data helper never percent-decodes a `{`-leading document any more; the isaac query parser decodes query KEYS once, like values (an HTML-form GET `user%5Bname%5D` still nests, and a `+` in a key is now a space, as express''s query parsers, `qs` and `querystring`, already treat it). The same document path serves the browser validator, so a form value holding `%22`/`%0A` no longer empties the validated data set and a pasted `a%20b` is sent as typed; and it serves every route declaring a DTO, whose validated payload went through the same decode — an `application/json` body value holding `%20` reached the action as a space, and one holding `%22` left the action with no payload at all (`req.post` undefined); both now arrive as sent. Pickup: restart AND re-bake. (#B589)'
