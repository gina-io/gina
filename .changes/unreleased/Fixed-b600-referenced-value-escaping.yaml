kind: Fixed
body: 'A value containing a double quote, a backslash or a line break in a field that an `is` condition references (`$password === $passwordConfirm`) no longer stops the validation pass: the rule set was built by pasting the value in unescaped, so in the browser the form could not be submitted and on the server the validation threw. Such values are now compared exactly as typed, and `$&`, `$''` or `$$` in them are no longer rewritten (`ab$$cd` matched `ab$cd`). A referenced field with a number rule is compared as a number when its value is one and as text otherwise; a string literal written in a condition follows JSON escaping (one that is not valid JSON is read as written, as before); and a `$fieldName` value sent by a `query` rule reaches the endpoint as typed. Pickup: restart AND re-bake. (#B600)'
