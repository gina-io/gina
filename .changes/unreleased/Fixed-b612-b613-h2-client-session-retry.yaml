kind: Fixed
body: '`self.query()` over HTTP/2: the client sent an `RST_STREAM(NO_ERROR)` after EVERY completed response — the settled-stream release ran `req.close()` while the stream was not yet marked closed — and the target''s nghttp2 counted those frames against its CVE-2023-44487 reset rate limit, closing the cached session with `GOAWAY(INTERNAL_ERROR)` after about 1,000 calls (the `Session closed with error code 2` failures on long-lived bundle-to-bundle sessions). The release no longer closes the stream: a settled stream closes itself within milliseconds, and the listener drop alone releases it (#B613). An in-flight safe-method call cut by a server GOAWAY — `ERR_HTTP2_SESSION_ERROR` — is now retried on a fresh session under the same safe-method / `retryUnsafe` rule as a stream error; a non-safe method is still never replayed. A session gone between the cache read and the send made `client.request()` throw synchronously (`ERR_HTTP2_INVALID_SESSION`), unguarded; it is now caught and retried on a fresh session for any method, since nothing was sent, and exhausts into a typed 503 (#B612). Pickup: bundle restart, no re-bake'
