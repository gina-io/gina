kind: Fixed
body: 'A model-loading failure on an asynchronous connector now aborts the boot with exit code 1 and the reason on stderr, as it already did on a synchronous one. An entity file the class-name check rejects (a name starting with a digit or an underscore), or an entity constructor that throws, on a connector such as DuckDB or Couchbase used to be logged only as an unhandled promise rejection: the bundle never listened, and under `gina-container` the process exited with code 0, a success status. It now ends with `[ FRAMEWORK ] Model loading failed — aborting boot: <cause>` (#B617)'
time: 2026-09-25T00:24:07+01:00
