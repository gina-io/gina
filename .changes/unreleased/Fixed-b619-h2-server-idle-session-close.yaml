kind: Fixed
body: 'The Isaac server never closed an idle HTTP/2 session: its 120 s idle timer closed only when `session.activeStreams` read 0, and that property does not exist, so the timer re-armed forever and idle sessions were left to the client or the network. An idle session is now closed gracefully after `http2Options.sessionIdleTimeout` (`"120s"`, `120000`; default 120 s, the value the timer always had): open streams finish, no new stream is accepted on that connection, and a client''s next request opens a fresh one — gina''s own client evicts the closed session and reconnects. `0` disables the close; a value that is negative, not a timeout, or above 2147483647 ms logs one warning and uses the default. A quiet open stream (an SSE stream between events) does not keep the session alive — the stream itself finishes — while a stream still sending data does. Node.js only: on Bun the key is ignored with one boot warning and idle sessions are not closed by the server (Bun 1.2 / 1.3 time out busy sessions, and a client''s next request hangs after the close). Pickup: bundle restart, no re-bake (#B619)'
