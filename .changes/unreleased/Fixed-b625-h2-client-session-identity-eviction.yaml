kind: Fixed
body: '`self.query()` over HTTP/2: every eviction of a cached client session deleted the cache entry by KEY, so a dead session''s late `close`, `error` or `goaway` — or an earlier attempt''s retry branch — evicted the LIVE replacement a retry had just cached under the same key. The replacement kept running, keepalive ticking, in no cache: 148 + 160 upstream connections were still open 186 s after a load run (the bundle-to-bundle audit, 2026-09-24), and the next call opened yet another. Every eviction is now identity-checked — it removes only the session it belongs to — and the cache owns the "lost its slot" teardown: an entry that is replaced, LRU-evicted, capped out or deleted stops its keepalive and closes its session gracefully (in-flight calls finish, nothing new is sent on it) instead of leaking it. The per-process session cap now drains the oldest session the same way instead of destroying it under an in-flight call. Pickup: bundle restart, no re-bake (#B625)'
