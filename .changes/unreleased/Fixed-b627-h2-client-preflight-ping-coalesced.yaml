kind: Fixed
body: '`self.query()` over HTTP/2: the pre-flight PING stormed. A cached session counted as stale 3 s after its last PONG while the keepalive pinged only every 5 s, so about 40% of the time every concurrent caller sent its own pre-flight PING; node cancels every ping past its outstanding limit of 10 with `ERR_HTTP2_PING_CANCEL`, and that cancel was read as a dead session — 22 healthy sessions evicted and reconnected per 10 s run at 50 concurrent callers (the bundle-to-bundle audit). Now one pre-flight PING per session serves every caller waiting on it, every response re-stamps the session as fresh (a busy session never pre-flights), and a cancelled PING is inconclusive: the call goes out on the same session and the keepalive skips that tick. Pickup: bundle restart, no re-bake (#B627)'
