kind: Fixed
body: '`self.query()` over HTTP/2: a request refused before the upstream processed it is now retried for any method. The runtime refuses a request queued onto a session that has just started closing — the upstream''s GOAWAY landed between the pre-flight PING and the send — with `REFUSED_STREAM` (RFC 9113 §8.7: closed prior to any processing) or, on node 24 / 26 and Bun 1.4, with an asynchronous `ERR_HTTP2_GOAWAY_SESSION`; a server at its stream limit refuses the same way. Both went through the stream-error path, where only a safe method is replayed, so a POST failed with a 503 although nothing had been processed. The request is now re-sent within the retry budget — on a fresh session, or on the same healthy one when the upstream merely refused a stream. Pickup: bundle restart, no re-bake (#B630, #B631)'
