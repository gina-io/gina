kind: Fixed
body: '`gina scope:link-local`, `scope:link-production` and `env:link-dev` crashed with "Gina has some troubles with this command" and a stack trace when no project could be determined, such as when run outside a project directory without `@<project>`, or when `@<project>` named a project that is not registered: they looked the scope or environment up in the project before checking it. They now print "Project name is required: @<project_name>" or "[ <name> ] is not a valid project name." and exit 1. Their message for a missing argument also named `scope:use` or `env:use` instead of the command that was run. (#B641)'
time: 2026-09-25T04:01:30+01:00
