kind: Fixed
body: '`gina project:add` and `project:import` read `--path`, `--scope` and `--env` whole. A value holding `=` was cut at its second `=`: on a fresh registry a `--path` holding `=` failed with `ENOENT`, `project:import` refused such a path as one that "no longer exists", and `--scope=a=b` or `--env=a=b` registered `a` instead of refusing the name. A `--path` value containing `--scope=` or `--env=` is no longer read as that flag, and a failed removal of the project''s `node_modules/gina` link now reports its own error instead of a `ReferenceError`. `--scope` and `--env` register a missing scope or environment; they do not change the project''s defaults, which `scope:use` and `env:use` set, as the CLI reference now says. (#B644)'
time: 2026-09-25T06:25:38+01:00
