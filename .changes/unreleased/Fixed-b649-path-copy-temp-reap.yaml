kind: Fixed
body: 'A failed file copy through the path helper (`_().cp()`, `PathObject.mv()`, which CLI copy, build and rename paths use) could leave its temporary `*.tmp` file beside the destination: the temporary file was removed only if it existed when the failure was reported, and its creation could finish just after. It is now removed once its stream has closed, before the callback runs. (#B649)'
