kind: Fixed
body: 'Six more commands never ended the process after doing their work, so they hung wherever the CLI was started by its own path (as CI and scripts run it): `gina port:reset` with no registered project, `env:unset`, `env:set` with no key, `port:list --format=json` (with or without `--filename`) and `--format=conf` without `--filename`, `connector:list` without `@<project>`, and a cancelled `protocol:set` prompt. They now exit; the listings exit only once their output has been written. (#B653)'
