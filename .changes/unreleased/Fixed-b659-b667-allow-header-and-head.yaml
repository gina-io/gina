kind: Fixed
body: 'A `405 Method Not Allowed` now carries the `Allow` header that RFC 9110 requires, listing the methods of the routes whose URL matched, with `HEAD` wherever `GET` is listed; a wrong method on a URL whose routes each declare a single method still answers 404, as documented. A `HEAD` request is now served by every route that serves `GET`: it used to answer 404 on a parameterised URL (a `GET` route on `/items/:id`) and 405 on a route declaring several methods (`"GET,POST"`), and only a single-method `GET` route on a static URL served it. On the isaac engine the `access-control-allow-methods` header of a `HEAD` response now reads `HEAD` rather than `GET`, as it already did on the Express engine. Pickup: bundle restart (#B659, #B667)'
