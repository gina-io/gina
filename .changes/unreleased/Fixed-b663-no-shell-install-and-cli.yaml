kind: Fixed
body: 'A first `npm install -g gina` no longer fails when your home directory, or the npm prefix, has a space in its path. The install scripts ran `chown` on `~/.gina` (a no-op, now removed) and created and sourced `~/.profile` through command lines with the path unquoted, and aborted; the sourcing never reached your shell either, so it is removed and a new shell reads the profile. The install''s npm probes and `framework:set` calls also reach such paths whole now, where before they failed without a word. `gina port:reset` reads the project''s bundles itself instead of running `gina bundle:list` through a shell, so it no longer crashes when `gina` is not on your `PATH` or sits under a path with a space, and it no longer consults whichever `gina` comes first on `PATH`. `gina bundle:restart` runs `bundle:stop` and `bundle:start` without a shell, so it works from an install under a path with a space and passes each flag through unchanged. (#B663)'
