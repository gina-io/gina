kind: Fixed
body: '`gina project:start`, `project:stop` and `project:restart` now work from an install whose path holds a space: they ran `bundle:start`, `bundle:stop` or `bundle:restart` through a command line that split the path, and failed. A `bundle:start` that reinstalls a project''s `node_modules` after an architecture or platform change re-links gina with the running install''s own `bin/gina`, so it no longer fails when `gina` is not on your `PATH`, nor uses whichever `gina` comes first there. A flag value holding a space now reaches the `link` steps of `project:` and `bundle:` start, stop and restart as one value instead of two. When a bundle''s pid file is missing, `bundle:stop` finds its process by the exact `gina: <bundle>@<project>` title: `api@shop` no longer matches the process of `api@shopping`, which it could stop instead. (#B665)'
time: 2026-09-27T01:24:39+01:00
