kind: Fixed
body: '`bundle:stop` reads a bundle''s pid file as a positive integer only: a pid file holding `-1` made it send `SIGKILL` to every process the user could signal, and one holding `12abc` to pid 12 (#B693). On a host without `ps`, such as a slim container image, `framework:status` no longer removes the pid file of every running framework: it checks each pid with a signal-0 probe instead of `ps -a`. `gina .` and `framework:open` now open a directory whose path holds a space instead of splitting it in two, and `framework:build` passes each of its arguments to the build script whole. The npm prefix look-ups that the CLI bootstrap and `framework:init` fall back on when no prefix is configured no longer fail when npm is installed under a path holding a space. (#B665)'
