kind: Fixed
body: 'Port lookups no longer take a bundle or project for another whose name begins with it or extends it. `bundle:remove api @shop` also removed the ports of `myapi@shop` and the port registry entry of `api@shopping`; `port:reset` removed the ports of the same bundle in a project whose name begins with its project''s; while allocating ports, `bundle:add`, `bundle:copy` and `env:add` could give environment `dev` the port assigned to `devel`, taking it from `devel`; and `project:add` and `port:reset` could skip an assignment as already made because another value contained it (`api@shop/dev` inside `api@shop/devel` or `myapi@shop/dev`). The first-character refusal of `bundle:add` also names the rejected bundle instead of printing `[ undefined ]`. (#B665)'
