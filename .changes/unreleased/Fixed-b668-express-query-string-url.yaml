kind: Fixed
body: 'On the Express engine, a URL carrying a query string never matched a route or a static file, on Express 4 and 5 alike: `GET /items?page=2` answered 404 while `GET /items` answered 200, and a static requested with a cache-buster (`/css/app.css?v=3`) was not found. The engine kept the query string in `request.url`, so the path handed to route matching, to the statics handler and to the requirement matcher still carried `?…` on its last segment; the built-in isaac engine strips it before dispatch. The Express path now does the same, after the framework''s own `/_gina/*` handlers (which read a `?key=` off the full URL) and before the webroot filter, the statics and the routing loop, with the engine''s query materialised on `request.query` first. `request.originalUrl` keeps the full URL. A consequence to know: the warm route cache is keyed by method and path, so on Express the query variants of one path now share one entry exactly as on isaac — the match verdict is re-evaluated on every hit. Pickup: bundle restart (#B668)'
