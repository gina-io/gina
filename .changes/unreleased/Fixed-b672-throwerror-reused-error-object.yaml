kind: Fixed
body: '`self.throwError()` no longer writes into the error object an action passes it. Up to 0.7.5 the one-argument form `self.throwError({ error, fields })`, and its `flash` and `errors` variants, combined that object with gina''s own error data by writing into it: the object received the response''s `status` and incident `ref`, on an HTML request a `stack`, and on a custom error page that page''s data (`isRenderingCustomError`, `bundle`, `pathname`, `title`). An object an action passes on more than one request, such as a module-level error object, then answered later requests with the first request''s incident ref, on the JSON body and on the error page, and on an HTML request it lost its `fields`, because the `stack` the first request left in it sent the later ones down another branch; a frozen object made `throwError()` itself throw. In the local scope the built-in error page also wrote its trimmed stack text back into the `stack` of an `Error` or a plain object passed in the three-argument form `self.throwError(res, code, err)`, at every call. gina now combines a copy of the object, one level deep (its members are shared), and trims a local copy of the stack. A `ref` the object carries is still honoured; an action that read the incident ref back from its own object after `throwError()` sets its own `ref` on the object instead. A class instance passed as the object is not copied and keeps the old behaviour. Restart your bundles (#B672).'
