kind: Fixed
body: 'A `HEAD` request served by a route that serves `GET` now gives the action the same `req.get` a `GET` would, so a `GET` action that reads `req.get` no longer answers 500 on `HEAD`. gina runs the `GET` action for a `HEAD`, so that the response carries the headers a `GET` would, but it kept the request''s URL and query parameters only in `req.head` and left `req.get` undefined, and an action reading `req.get.<param>` threw. `req.get` is now the same object as `req.head`; `req.head`, `req.getParam()` and `req.getParams()` are unchanged, and `req.method` stays `HEAD`, so the response still has no body. Affected: 0.3.0 to 0.6.33, on routes with a static URL (a `HEAD` on a parameterised or multi-method route answered 404 or 405 there). Pickup: bundle restart (#B675)'
time: 2026-09-26T02:54:21+01:00
