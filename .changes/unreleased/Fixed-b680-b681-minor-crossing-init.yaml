kind: Fixed
body: 'The first gina commands after moving to a new minor version (for example 0.6 → 0.7) no longer fail. On that first run, gina copies each per-version default it keeps in `~/.gina/main.json` (culture, timezone, log level, protocols, scopes and the rest) from the previous minor version to the new one. The copy ran only while the new version was not yet registered in that file, and `gina bundle:start`, `bundle:restart`, `project:start` and `project:restart` register it before the copy runs, as does every `gina-container` boot. When one of those came first, the copy never ran and every later gina command exited 1 with `Cannot read properties of undefined (reading ''split'')` until the file was repaired by hand. The copy now fills whatever the new version is missing, whether or not the version is registered, and keeps any entry already there. Separately, even when the copy ran, the first command exited 1 once with `(reading ''indexOf'')`, because the later steps of that same command still read the file as it was before the copy; they now read the updated file. Exposed: installs that skip npm''s install scripts (Bun, `gina-container` images, a git checkout); an npm install ran the copy first. CLI only: nothing to restart. (#B680, #B681)'
