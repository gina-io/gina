kind: Fixed
body: 'With `settings.swig.autoescape: true`, a Swig page now keeps its CSS and JavaScript. Gina injects the bundle''s stylesheet and script tags into the layout through the `{{ page.view.stylesheets }}` and `{{ page.view.scripts }}` placeholders, and auto-escaping rendered every injected `<link>` and `<script>` tag as visible text, so the page lost all its styles and scripts. The placeholders are now injected with `| safe`, and a layout that already holds either one, bare or with `| safe`, is not given a second copy. With autoescape on, the `nl2br` filter also escapes the text it receives and keeps its line breaks as markup; before, the `<br/>` it added showed as text. With autoescape off (the default until 0.8.0) rendered output is unchanged. A layout that places `{{ page.view.stylesheets }}` or `{{ page.view.scripts }}` itself writes `| safe` when autoescape is on, as with Nunjucks. Pick it up with a bundle restart. (#B690, #B359)'
