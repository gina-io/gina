kind: Fixed
body: 'A bundle started through the framework daemon now shows its boot warnings in the output of `gina bundle:start`, and of `gina bundle:restart`, which prints its start step. Every line the bundle logs at `warn`, `warning`, `error`, `err`, `crit` or `alert` while it starts is written there, before the started line. Until now these lines reached only a `gina tail` already attached when the bundle booted, because the log listener keeps no backlog: running `gina bundle:start` and then `gina tail`, or a container whose init script starts the bundle before its tail, never showed them, including the two boot warnings added in 0.7.0 (Swig `autoescape` not set, and unanchored routing `requirements`). A tail attached before the start still receives these lines, so each one then appears twice. An `emerg` line keeps its `aborted` message, and lines logged after the start still reach only the tail. Restart the framework to pick this up: `gina framework:restart`, or restart the container that runs the framework. (#B691)'
time: 2026-09-27T16:41:26+01:00
