kind: Fixed
body: 'A `getConfig()` or `getLib()` call that names no bundle no longer walks the call stack when it does not need to: `getConfig()` and `getConfig(confName)` resolve to the running bundle without it, and where the walk is still needed (`getConfig(<falsy>, confName)`, `getLib(lib)`) the stack is captured once instead of once per frame examined. When no frame outside `node_modules` qualifies, the call now takes the no-match path instead of throwing a TypeError. On an npm install, every request to a bundle with templates used to pay up to nine stack captures and a caught exception in the render setup, about a quarter of a request''s CPU in a profile of a trivial JSON route; the render setup now reads the bundle''s Swig settings from the request''s own configuration. (#B695)'
