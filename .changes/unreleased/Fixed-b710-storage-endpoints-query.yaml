kind: Fixed
body: 'On the isaac engine (the default), the storage maintenance endpoints of a running bundle now read their query string. Isaac removes the query from the request URL before handing a request to the handlers behind `/_gina/storage/stats`, `/_gina/storage/gc` and `/_gina/storage/verify`, which read `?driver=` and `?dryRun=` from that URL and so never saw them: against a running bundle, `gina storage:gc --dry-run` ran a real garbage collection, removing every unreferenced blob past `sweepGrace` on every `cas` driver (including one whose automatic sweep is off, `sweepInterval: 0`), and `--driver=<name>` was ignored by `storage:stats`, `storage:gc` and `storage:verify`, which reported on or collected every driver. The handlers now read the query from the original request URL. A stopped bundle (the CLI then opens the store itself) and the express engine were not affected, and the endpoints still answer only callers listed in `app.json` `admin.allowFrom`. Affected: 0.6.7 through 0.7.0. Pickup: restart the bundle; nothing to re-bake (#B710)'
time: 2026-09-30T04:12:55+01:00
