kind: Fixed
body: 'A client listed in `server.maintenance.allowFrom` now gets through a maintenance window on the isaac engine over HTTP/1.1, the default engine and protocol. The isaac engine''s maintenance gate admitted it, then rewrote the request''s `Host` without its port before handing it on, and the second maintenance check read that port-less `Host` as the sign of a reverse proxy, closed the address arm and answered 503: the documented IP bypass never let a listed operator reach a page or a static file. The second check now honours the isaac gate''s verdict instead of deciding again. The Express engine, the `bypassKey` header and cookie, and `server.proxy.requireForwardedHeaders: true` were not affected. A reverse proxy on the bundle''s own host that forwards the `Host` with its port and adds no forwarding header cannot be told from a direct client, so a request it relays from a listed address passes too, as it already did over HTTP/2 and on Express. Affected: 0.6.10 through 0.7.0. Pickup: restart the bundle; nothing to re-bake (#B711)'
