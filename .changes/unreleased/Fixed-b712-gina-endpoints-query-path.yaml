kind: Fixed
body: 'A page whose query string ends in a `/_gina/` endpoint path is answered by the page again. The built-in endpoints that #B709 left out of its exact-path matching (the health check, `/_gina/jobs/<id>`, `/_gina/instrument`, and the dev-only `/_gina/inspector`, `/_gina/logs`, `/_gina/agent`, `/_gina/indexes` and `/_gina/reveal`) tested the whole URL, so a URL such as `/web/?next=/_gina/health/check` got the endpoint''s answer instead of the page, on both engines, outside a maintenance window and inside one, where the page''s 503 was due; a WebSocket upgrade to such a URL was taken by the Inspector agent. These endpoints now match the URL''s path only, keeping their prefix tolerance, letter case, methods and gates. The dev-only `/_gina/inspector`, `/_gina/logs`, `/_gina/indexes` and `/_gina/reveal` also answer a URL that carries a query string (`/_gina/logs?x=1`): on the express engine it missed them (a 404, or the maintenance 503 during a window), and on the isaac engine it got the maintenance 503 during a window. Pickup: restart the bundle; nothing to re-bake (#B712)'
