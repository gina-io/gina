kind: Fixed
body: 'On the express engine, a `POST /_gina/maintenance` or `POST /_gina/instrument` carrying a JSON body no longer stops the bundle. The server layer sets an encoding on every non-multipart request, so the body arrived as text, and the reader of these small control bodies threw while joining it: an uncaught exception that ended the process. The reader now accepts text, counts its 4 KB cap in bytes and reports a failure through its callback. Only a caller the endpoint already admits could send it: an address in `app.json` `admin.allowFrom` for the maintenance toggle, the inspector key for the instrumentation window. The isaac engine was not affected. Affected: 0.6.10 through 0.7.0 for `/_gina/maintenance`, 0.4.0 through 0.7.0 for `/_gina/instrument`. Pickup: restart the bundle; nothing to re-bake (#B714)'
time: 2026-09-30T10:33:00+01:00
