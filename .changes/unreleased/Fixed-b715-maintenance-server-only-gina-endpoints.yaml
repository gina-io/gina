kind: Fixed
body: 'During a maintenance window on the isaac engine, `/_gina/storage/stats`, `/_gina/storage/gc` and `/_gina/storage/verify` answer again. They exist only in the engine-agnostic server layer, and the isaac engine''s maintenance gate, which lets through every `/_gina/*` endpoint the engine answers itself, stood in front of them: `gina storage:stats`, `storage:gc` and `storage:verify` failed against a running bundle for the whole window, reporting an invalid response. A health check whose URL carries a query string (`/_gina/health/check?probe=1`) got the maintenance 503 on isaac for the same reason. The isaac gate now lets those exact paths through to the server layer, where the storage endpoints stay restricted to `app.json` `admin.allowFrom`. The express engine was not affected. Affected: 0.6.10 through 0.7.0. Pickup: restart the bundle; nothing to re-bake (#B715)'
time: 2026-09-30T10:32:00+01:00
