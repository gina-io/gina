kind: Fixed
body: '`/_gina/health/check`, `/_gina/assets/routing.json`, `/_gina/release/status` and `/_gina/release/events` answer a URL that carries a query string. They matched their path only when the URL ended there, so the same path followed by a query string (`/_gina/health/check?probe=1`) missed the endpoint: on the express engine it fell through to routing, a 404 (or the maintenance 503 during a window), and on the isaac engine the routing map and the release-watch endpoints with a query string answered the maintenance 503 during a window. The four endpoints now ignore a query string on both engines, and the isaac engine''s routing-map fast path looks its asset up by the file name it matched. The browser fetches the routing map without a query string, so pages were not affected. Pickup: restart the bundle; nothing to re-bake (#B717)'
time: 2026-09-30T16:42:00+01:00
