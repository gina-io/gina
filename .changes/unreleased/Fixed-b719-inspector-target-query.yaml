kind: Fixed
body: 'The standalone Inspector and `gina inspector:open` accept a target URL that carries a query string or a fragment. The Inspector appends `/_gina/<endpoint>` to its `?target=` value, and the command passes a URL argument through as that value, so a pasted page URL such as `http://localhost:3100/page?x=1` built `http://localhost:3100/page?x=1/_gina/agent`: the endpoint path landed in the query string, where the endpoints no longer look for it (#B712), and outside dev mode the agent key became part of another parameter. The target''s query string and fragment are now dropped, then its trailing slashes. Pickup: the bundle reads the Inspector from the framework on every request, so reload the Inspector window, with nothing to restart or re-bake; the command takes effect on its next run (#B719)'
