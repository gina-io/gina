kind: Fixed
body: 'The isaac engine''s own event streams answer HTTP/2 clients: `/_gina/logs` and `/_gina/agent` (the Inspector''s server-log and agent streams) and `/_gina/release/events` (the live release-watch banner). Each sent a `connection: keep-alive` header, which HTTP/2 forbids: node refused the response headers (`ERR_HTTP2_INVALID_CONNECTION_HEADERS`, logged as a warning) and the client never got an answer, so an `http/2.0` bundle reached directly over HTTP/2 streamed none of them. HTTP/1.1 clients, including a proxy that talks HTTP/1.1 to the bundle, were not affected. The header now goes to HTTP/1.1 clients only. Affected: 0.3.0 through 0.7.0 (`/_gina/release/events`: 0.5.18 through 0.7.0). Pickup: restart the bundle; nothing to re-bake (#B722)'
time: 2026-09-30T22:04:00+01:00
