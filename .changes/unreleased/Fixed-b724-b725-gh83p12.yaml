kind: Fixed
body: 'Staged uploads: a file input''s browser placeholder value (C:\fakepath\name) is no longer collected into the form-submit payload — a staged file input''s data travels through its hidden fields, so the input is skipped from the payload while staying available for rule evaluation (#B725). A transport-level request failure (XHR status 0) now reports "the request did not complete" instead of "the request did not reach the server" — honest for a proxy 413 that arrives mid-send over HTTP/2 and for a navigation that aborts the request, both of which reached the server — resolved through an overridable label (gina.config.a11y.transportError) and tagged with a reason of unload or transport (#B724). Reported as gh#83 parts 1 and 2. Browser-bundled: rebuild bundles to pick it up.'
