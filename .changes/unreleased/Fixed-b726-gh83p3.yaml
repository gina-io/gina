kind: Fixed
body: 'Staged uploads: a form submitted while one of its staged uploads is still uploading now waits for it, then sends once with the uploaded file''s metadata, instead of posting the upload''s still-empty hidden fields. While it waits the submit control keeps its busy state and the form''s live region announces the wait once (overridable as gina.config.a11y.uploadPending, default "Waiting for the upload to finish…"); if an upload fails, the waiting submit is cancelled and nothing is sent. This covers every way a validator-bound form is submitted — the submit control, Enter, requestSubmit() and $forms[id].submit() — while a direct $forms[id].send(data) call, which carries its own payload, is not held (#B726, gh#83 part 3). Browser-bundled: rebuild bundles to pick it up.'
