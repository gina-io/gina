kind: Fixed
body: '`gina start` no longer reports another program on the framework port as a running framework. When the port was already in use, it trusted any `~/.gina/procs.json` entry for it without checking: a port held by another program read « already running » (with « PID `null` » when no entry named the port), a stale entry left by a stopped framework was reported as running under a dead pid, and both exited 0 while a half-started framework kept the MQ port busy; any other error opening the port, such as EACCES, made `gina start` hang. « Already running » now needs a recorded pid that is a running gina framework, on Node or Bun. Otherwise the start prints the cause, the fix (`gina framework:set --port=<port>`) and, outside Windows, an `lsof` command that finds the program holding the port, then exits 1 and releases the MQ port; any other error opening the port exits 1 with that error. (#B761)'
time: 2026-10-05T01:30:00+01:00
