kind: Fixed
body: 'The automatic preload hints of an `http/2.0` bundle in production, the 103 Early Hints and the `link` header of the 200, are now limited to `templates.json > preloadHintsMaxSize` bytes, 1,024 by default (`0` = no limit), keeping their entries in order and stopping at the last one that fits; `preloadHintsEnabled: false` sends neither. Both keys can be set in `_common` or in a page''s own entry. The hints had no limit, so behind a proxy with a small response-header buffer (nginx''s `proxy_buffer_size` is one memory page, 4 KiB on most Linux hosts) a page that declared many stylesheets and scripts, or whose layout held many images, was answered 502 « upstream sent too big header ». This is a behaviour change: such pages now send fewer hints, and the assets left out still load once the browser reads the page. Raise the limit only when every proxy in front of the bundle has room for it. (#B765)'
