kind: Fixed
body: 'The stylesheets (`<link rel="stylesheet">`) and scripts (`<script src>`) written in a layout are now hinted in the `link` header of an HTML page, with `as=style` and `as=script`; they never got an `as`, so they were never hinted. A tag the browser could not match a preload to is left out: one carrying `integrity` or `crossorigin`, a stylesheet whose `media` is not `all` or `screen`, an alternate stylesheet, a `type="module"` or `nomodule` script, or a tag followed by another tag''s URL on the same line. (#B766)'
