kind: Fixed
body: 'An `http/2.0` bundle in production no longer sends 103 Early Hints over HTTP/1.1 unless `settings.json > server.earlyHintsOverHTTP1` is `true`. Since 0.6.28 it sent its automatic 103 over HTTP/1.1 too, where it reaches a reverse proxy rather than a browser (browsers act on a 103 only over HTTP/2 and HTTP/3), and nginx older than 1.29, the versions Ubuntu 22.04 and 24.04 and Debian 12 package, takes an upstream 103 for the final response: every HTML page behind it failed (in Chromium: `ERR_HTTP2_PROTOCOL_ERROR`). This is a behaviour change, and it applies to `self.setEarlyHints()` too: a browser connected to the bundle over HTTP/2 gets its 103 as before, and behind a proxy that talks HTTP/1.1 to the bundle the 103 now stops. Turn the key on only behind a proxy that passes 103 responses on (nginx 1.29 or later with `early_hints`, Apache). (#B771)'
