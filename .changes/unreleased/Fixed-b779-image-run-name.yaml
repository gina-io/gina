kind: Fixed
body: '`gina image:run <image>` without `--name` now leaves the container name to podman, as documented. The image reference was taken as the container name: a usual `repo:tag` reference was refused with « invalid --name », so the command failed in its plain form, and a reference that is also a valid container name, such as `demo`, named the container after the image and reported that name. `--name=<name>` still names the container (#B779).'
time: 2026-10-06T02:44:22+01:00
