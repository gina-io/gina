kind: Fixed
body: '`gina framework:restart` now exits with `gina start`''s code when the framework does not start again, after relaying the start''s output and one line naming the failure. It returned 0, with no framework running, when the failed start had already written its pid file, and otherwise ended with an uncaught error and exit 1, the start''s own code lost (#B780).'
