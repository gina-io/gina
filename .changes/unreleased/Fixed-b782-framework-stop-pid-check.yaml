kind: Fixed
body: '`gina stop` now signals a framework only after `ps` shows that the pid it read is still running as that framework, and it reads and removes only its own version''s pid file. It used to remove the pid file of every framework version in the run directory before choosing the one to stop, so stopping one version deregistered the others running beside it, and `gina reset`, which checks those pid files for running frameworks, could then miss them. It then sent `SIGTERM` to the pid that `procs.json` records for the version whenever a pid file held the same pid, whatever process that pid now was (a reused pid, or one recorded in another container''s pid namespace when the run directory is shared), sent `SIGCONT` to the record''s `fakeDaemonPid`, which names the `gina` wrapper that exits once the framework is ready, and printed « has been stopped » whether or not it had signalled anything. Where `ps` cannot identify a process (Windows, an image without `ps`), the pid that the pid file and the record both name is still signalled (#B782).'
