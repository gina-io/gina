body: 'A per-environment settings file with no section, `settings.<env>.json`, is now merged into the bundle''s settings at the top level and wins over `settings.json`, as `settings.<section>.<env>.json` does for its section. It used to be nested under a `<env>` key of the settings instead, so nothing in it took effect (#B784).'
