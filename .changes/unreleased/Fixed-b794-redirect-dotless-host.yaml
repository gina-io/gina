kind: Fixed
body: '`self.redirect()` to an absolute URL whose host has no dot (`http://localhost:<port>/…`, a single-label host such as a container service name, or a bracketed IPv6 address) now redirects to it. Such a URL used to be taken for a route name and answered with a 404 naming the current URL; a `throwError()` fallback given as a route object failed the same way on a bundle served from `localhost`, because the route object''s URL is such an absolute URL. URLs on dotted hosts, route names and relative paths are unchanged (#B794).'
