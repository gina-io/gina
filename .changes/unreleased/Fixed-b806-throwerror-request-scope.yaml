kind: Fixed
body: 'The engine-level error responder built its reply from the request held in a Server-wide slot that every incoming request overwrites, so under concurrency an error raised for one request after any asynchronous gap was built from whichever request had arrived last: the wrong JSON-vs-HTML form (an XHR caller could receive the HTML error page, a page request the JSON body), another request''s URL, routing and session rendered into the custom error page, a mis-correlated `#ERRREF` log line, and `Access-Control-Allow-Origin` computed from the wrong request''s Origin. The responder now resolves the request from the response it is answering, falling back to the previous behaviour only for a non-native response object (#B806). Folded in: an extensionless HTML URL''s built-in fallback page is now served with its real `text/html` content type instead of `undefined` (#B815), and a preflight-shaped request that errored before dispatch no longer throws while building the response (it was handed a never-assigned response slot).'
