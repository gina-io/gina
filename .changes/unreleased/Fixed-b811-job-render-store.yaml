kind: Fixed
body: 'An async job runs with no render context (#B811). The template filters (`getUrl`, `getWebroot`, `t`, `tIcu`) look for their context in the render store first, and the 0.6.31 fix detached a job from the request store only: the job kept the render store of the async chain that started it. A job created while a render context was active ran with that context, the `req` and `res` of its request included. A job that had waited for a worker slot ran with the render context of the job that freed the slot, whichever request had created either, and so did each of its retries. A template filter called in such a job resolved that request''s context, so `getUrl` built its absolute URLs from that request''s host, even when the job had passed a context of its own to the filter factory. A job now runs with no render store for its whole lifecycle, and a filter it calls resolves as in a render made outside a request. Affected: 0.4.6 through 0.7.3. Server-side only: restart the bundle.'
