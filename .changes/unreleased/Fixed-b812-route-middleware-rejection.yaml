kind: Fixed
body: 'An `async` route middleware whose returned promise rejected (an error thrown after an `await`, or thrown by a later middleware it handed over to through `done`) left its request unanswered until the client or a proxy timed out, and the rejection reached the process unhandled. Such a request is now answered with a 500 that names the middleware, carrying an `#ERRREF` correlation reference with the full detail on the paired server log line, as a rejected controller action or reserved hook already was (#B812).'
