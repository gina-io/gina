kind: Fixed
body: 'A `Collection` search that carries a search option (`setSearchOption(field, ''isCaseSensitive'', false)`) now matches the filter value as text. The value was spliced unescaped into the rule''s pattern: a value holding an unbalanced parenthesis threw a `SyntaxError` out of `find()` / `findOne()`, a dot matched any character (so `a.b` also selected `axb`, and `update()` / `delete()` then acted on both rows), and a `$&`-style sequence in a value was expanded. A pattern character in a value now means itself, and a value without one matches exactly as before. A rule template passed to the constructor (`searchOptionRules`) still applies: only the value is escaped. A value holding `<`, `>` or `=` is still a comparison unless `skipEval` is set (#B818).'
time: 2026-10-08T01:05:00+01:00
