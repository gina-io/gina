kind: Fixed
body: 'A `Collection` filter whose dotted key holds `(`, `)` or `[` in its last segment (`find({ ''address.ci(ty'': ''Paris'' })`, also in the `[*]` form) no longer throws a `SyntaxError` out of the search: it matches nothing, like any other dotted key that is not a property path. A regular expression was built from the key and never read (#B821).'
