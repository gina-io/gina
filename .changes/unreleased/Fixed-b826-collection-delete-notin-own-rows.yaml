kind: Fixed
body: '`Collection.delete()` and `notIn()` take the rows they found out as themselves. Given a filter, they located each found row by a key read from the first one, the internal `_uuid` or else `id`: after `toRaw()` or `update()` had stripped that `_uuid`, rows with no `id` threw `No comparison key defined !`, and rows sharing an `id` lost the first row holding it instead of the row found, with no error. The no-key form, `delete(filter, false)`, threw the same way on rows with no `id` and removed nothing for a dotted key. When no key is named and the rows found are rows of the collection or of the chained result searched, each is now removed at its own place. A named key, and rows passed in from elsewhere, are compared by key as before (#B826).'
