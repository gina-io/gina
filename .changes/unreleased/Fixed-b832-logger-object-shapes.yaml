kind: Fixed
body: 'A logged object can no longer make a log call throw. The levelled logger counted the keys of a logged object through the `count()` helper, an ordinary property lookup, so an object with an own `count` key (a parsed body `{"count": 5}`) made the call throw `obj.count is not a function` in the caller. Both writers tested `instanceof Object`, which is false for a null-prototype object (the result of `querystring.parse()`, `Object.create(null)`): such an object fell into a string path, and coercing it there threw `Cannot convert object to primitive value`. An array element `{"toString": "x"}` and a Symbol made the coercion of a value throw too. Keys are now counted with `Object.keys`, a null-prototype object is written like any other object, a value that cannot be coerced is written as its type tag (`[object Object]`), and a Symbol is written with `String()`. An object with an own `hasOwnProperty` key is now written with its commas. Every other value is written exactly as before. Pickup: a bundle restart; the logger is not in the browser bundle (#B832).'
