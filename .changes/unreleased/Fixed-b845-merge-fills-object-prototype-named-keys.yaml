kind: Fixed
body: 'A fill-only `merge()` (the default mode) now keeps a source key named after an `Object.prototype` member — `toString`, `valueOf`, `isPrototypeOf`, `hasOwnProperty`, `propertyIsEnumerable`, or gina''s own `count` — when the target holds that name only through `Object.prototype`: the merge read the inherited function as an existing value and wrote it back as an own key, so the source''s value was lost and JSON output omitted the key; a PUT form or JSON field so named reached the action as nothing. A target that owns the key, or inherits it from its own prototype (an entity''s query methods, a class''s own `toString`), keeps winning as documented. `lib/merge` is in the browser bundle: pickup is a bundle restart and a re-bake (#B845).'
time: 2026-10-30T00:05:31+01:00
