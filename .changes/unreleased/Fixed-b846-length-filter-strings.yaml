kind: Fixed
body: 'The `length` template filter now returns a string''s length, on swig and on nunjucks (#B846). Up to 0.7.7, `{{ "abc" | length }}` rendered empty, `{% if title | length %}` was false for any string, and the documented `{{ "hello" | length }}` rendered empty instead of 5; only a string that reads as JSON, such as `''{"a":1}''` or `"5"`, gave its length. On nunjucks a string passed through `| safe` now counts its characters as well (a JSON-looking one counted 2). Swig hands a filter an empty string for a missing or null variable, so on swig `{{ missing | length }}` now renders 0 where it rendered empty, and `{{ missing | length | default("No") }}` gives 0 instead of "No", as swig''s own `length` filter does; `{% if missing | length %}` stays false. Arrays, objects and collections count as before.'
