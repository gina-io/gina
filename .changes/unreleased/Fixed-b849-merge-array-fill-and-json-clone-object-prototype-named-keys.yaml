kind: Fixed
body: 'Two more places lost a key named after an `Object.prototype` member. `merge()`''s array-element fill tested ownership with the element''s own `hasOwnProperty`, so a PUT body such as `list[0][hasOwnProperty]=1&list[0][b]=2` answered 500 « newTarget[a].hasOwnProperty is not a function »; it now tests through the built-in and keeps both keys. And `JSON.clone` — the server''s and the browser bundle''s — filled a key only when the target had no value for it, read through the prototype chain, so a cloned object lost `toString`, `valueOf`, `hasOwnProperty` or `count` to the inherited function; it now fills a key the target does not own. A GET `inheritedData` carrying `toString` (top-level or nested) or a nested `hasOwnProperty` reaches the action whole. Pickup is a bundle restart and a re-bake (#B849).'
