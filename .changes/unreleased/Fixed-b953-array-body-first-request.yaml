kind: Fixed
body: 'A `POST` or `PATCH` whose body is a top-level JSON array (`[{"a":"1"},2]`, whatever its content type, `application/json` included) now reaches the action as that array in `req.post` / `req.patch` on every request, the same object as `req.body`. The first request to each path got an object keyed by index (`{ "0": …, "1": … }`), a separate object from `req.body`, while every later request to the path got the array; on a route with URL placeholders each new value is a new path, and a `true`, `false` or `on` segment beside the array was a boolean on that first request only. The route''s URL placeholders are now named properties of the array on every request, with the 0.7.6 `true` / `false` / `on` rule; one named like a property of the array itself (`length`, `map`, …) or with digits only (`:5`) is in `req.params` only, on every request. A `PUT` is unchanged: `req.put` and `req.body` hold an object keyed by index. Server-side: restart the bundle to pick it up. (#B953, #B965)'
