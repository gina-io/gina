kind: Fixed
body: 'An HTTP/1.1 `self.query()` call that reaches its `requestTimeout` now fails with an error that names the timeout (#B969): a native `Error` whose `code` is `ETIMEDOUT`, with `status` 503, `retryCount` (the attempt it was on) and the message « [HTTP1] No response from <hostname> after <time> ». Up to 0.7.7 the timeout failed like a reset connection, `ECONNRESET` « socket hang up », which reads « `Controller::query()` could not connect to [ … ] using port N » when the port belongs to a bundle; it carried no `status`, so `throwError(err)` and an `.onComplete()` handle answered 500 where they now answer 503, the status of an HTTP/2 timeout. A response whose headers had arrived before the timeout and whose body then stalled never called back at all; it now fails with the same error. The re-send rule is unchanged: a GET, HEAD, OPTIONS or TRACE, or a call with `retryUnsafe`, is still re-sent (twice by default) before the error is delivered, a refused connection still reads « could not connect », and the `server.query.circuitBreaker` circuit breaker still counts the timeout.'
