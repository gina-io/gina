kind: Fixed
body: 'On Bun, an HTTP/2 `self.query()` call''s `requestTimeout` now belongs to that call (#B971). Bun''s `ClientHttp2Stream.setTimeout()` sets the session''s one timer, so up to 0.7.7 a timeout could fire late or for the wrong call: a hung call beside a sibling that finished first never called back on Bun 1.4 and failed late on Bun 1.2 and 1.3; a call with a long timeout failed at a sibling''s short one, with a message naming its own; on Bun 1.4 a timeout above 5 s, the default 10 s included, never fired, because the keepalive PING refreshed the timer; a response still streaming past the timeout failed mid-body; on Bun 1.2 and 1.3 a slow upload failed at the timeout; and each call left a `timeout` listener on the session or its socket. A stream now has its own timer on Bun, following what Node.js does: response headers do not refresh it, data and the completed upload do, and an upload that still moves does not time out. Node.js is unchanged. Server-side: restart the bundle.'
