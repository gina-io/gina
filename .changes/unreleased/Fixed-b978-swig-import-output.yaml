kind: Fixed
body: 'Gina now requires `@rhinostone/swig` `^2.9.4` in both manifests. On the default render path, swig up to 2.9.3 dropped what a template had rendered before an `{% import %}`: the output above the tag, the layout''s output before a block that holds one, every item of a `for` loop that holds one, and a macro''s output before the tag; an import at the very top of a template was not affected. 2.9.4 keeps that output, so a template whose import follows other output now renders it (a comment and blank lines above the import come out as those blank lines). On the async loader path (`settings.template.swig.loader`), swig up to 2.9.3 failed to compile a template with an `{% include %}` or `{% import %}` inside a `for` loop or a `filter` tag, or an `{% include %}`, `{% import %}` or `{% block %}` anywhere in a macro body, even when the macro was never called; 2.9.4 renders the loop and filter cases and a template that only defines such a macro, and calling the macro throws an error that names it and its template. Upgrading gina installs 2.9.4 or later (a project copy loaded through `swig.useProject`, or a frontend selected through `swig.package`, keeps its own version, so update it there); restart the bundle. (#B978)'
time: 2026-10-24T22:56:27+01:00
