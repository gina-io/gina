kind: Fixed
body: 'A `self.query()` call over HTTP/2 that is retried after a 502, a stream error or a stream that ended early now leaves its session to the other calls in flight on it: the session is dropped from the cache and closed once they have answered. Before, the retry destroyed the session and those calls failed with a 500 (a typed `STREAM_ERROR` on Bun 1.4, a 500 with no error code elsewhere); a session error or a connection reset still closes the session at once. A call that was never sent, still waiting for a session that never connected when gina dropped that session (at another call''s timeout or, on Bun, at the keepalive deadline), is now sent again on a new session whatever its method (on Bun it failed with a 500). A stream that ends without its response (a reset before any response, or its session destroyed under it) now follows the premature-close rule: a safe method, or a call with `retryUnsafe: true`, is sent up to twice more, then the call fails with `PREMATURE_CLOSE` (503); before, it came back as `{ status: 200, empty: true }` or as a 500, so an upstream that resets a stream before answering (with `NO_ERROR`, or on Bun with any code) now receives a safe method up to three times. On Bun 1.2 and 1.3, an empty response now comes back as `{ status: 200, empty: true }` as on Node.js, where it was a 500, and a refused connection or a failed TLS handshake gets its typed error (`ECONNREFUSED` 503, `STREAM_ERROR` 500), where it was a 500 with no error code or, for a failed handshake on 1.2.21, an empty success; neither is sent again. Known limit on Bun 1.2 and 1.3: an empty response that completes while its session is being closed after another call''s retry is read as incomplete (a safe method is sent again, an unsafe one fails with `PREMATURE_CLOSE`). Server-side only: a running bundle picks this up at its next restart. (#B981, #B968, #B628, #B982)'
