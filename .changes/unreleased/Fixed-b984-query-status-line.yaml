kind: Fixed
body: 'A `self.query()` answer with a 4xx or 5xx status whose body carries no gina `status` (an empty body, text, JSON without `status`, the HTML page a proxy in front of a bundle answers with itself) now reaches the caller as an error carrying that status, on HTTP/1.1 and HTTP/2 (#B984): `{ status, error, message }`, with `error` the label `core/status.codes` gives the status and `message` the body text, the JSON text, or the label for an empty body. The promisified call rejects with it, an `.onComplete()` handle receives it as `err`, and a `forward` route answers it through `throwError()` with its status, where it relayed it to the client as a 200 carrying the body. Up to 0.7.6 only the body''s `status` was read, so such an answer was delivered as a success: an empty one as `{ status: 200, empty: true }` over HTTP/2 and as an empty string over HTTP/1.1, any other with its body. A body carrying `status` still decides, and a status the map does not know (such as 599) is still delivered as a success.'
