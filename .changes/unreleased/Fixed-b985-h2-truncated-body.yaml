kind: Fixed
body: 'An HTTP/2 `self.query()` response whose body is cut short mid-transfer is no longer delivered as a success (#B985). A body shorter than the response''s `content-length`, and any body on a session gina tore down itself (its keepalive or pre-flight PING deadline, a stream error that ends the session, the boot warmup''s deadline), now follow the premature-close rule: a safe method, or a call with `retryUnsafe`, is sent again on a fresh session, and any other call fails `PREMATURE_CLOSE` (503). Up to 0.7.6 the caller got the partial body as a success, or an uncoded `{ status: 500 }` when it was JSON. On Bun 1.2 and 1.3, an empty response that completes while its session is being closed is no longer read as incomplete. A body sent with no `content-length` and cut by the connection closing or resetting is still delivered as received.'
