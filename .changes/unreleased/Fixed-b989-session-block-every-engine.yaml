kind: Fixed
body: 'With an async swig loader (`settings.template.swig.loader`) and with nunjucks (`render.engine: nunjucks`, with or without `settings.template.nunjucks.loader`), a page rendered for a request that has a session now gets the request''s session block under `page.data.session` (`id`, `lastModified`, `createdAt`, `expiresAt`, `timeout`), as with the default swig renderer. Up to 0.7.5 those three renderers never built it: a template read no session value, and the client bootstrap in the page kept its `{{ page.data.session.id }}`, `.timeout`, `.createdAt` and `.lastModified` placeholders as written, so in the browser `gina.session.id` was that text and `gina.session.timeout` was `NaN`. An action''s own `session` member keeps its keys and gets the keys of the block it lacks, an action''s own `page.data` member gets the block, and the object the action passes is not written. A page without a session, or with a session whose store sets no `createdAt` or `lastModified`, now gets empty values in the bootstrap instead of the placeholders. Restart your bundles (#B989).'
