kind: Fixed
body: 'A form re-bound while one of its file inputs shows files the user staged keeps those files (#B990). `$forms[id].reBind()`, `.bind()`, or `destroy()` followed by `validateFormById()`, read the staged previews in `<input id>-preview` as saved files: a file shown without an image (a PDF whose staging answer carries no `preview` thumbnail) lost its entry, so its reset control removed nothing and the form still saved the file the user had removed; beside an image on a `multiple` input, its reset removed the image instead and the form still saved the PDF; and an image staged logged « did not find `upload delete trigger` » for a delete link the page never had. A re-bind now leaves the input''s staged files as they are while their reset controls are on the page. Once the page has replaced the preview container, for instance to show the saved file after a save, the container is read again as before, and a form re-bound before any staging or after a reset is unchanged.'
