kind: Fixed
body: 'An element carrying `disabled` (any value but "false") in popin content now does nothing when clicked, wherever the click lands on it, for a link with an `href` and for a `gina-popin-close` element. Before, a link carrying `disabled` when the popin content was loaded was left to the browser, so a click on it followed the link in the whole page or opened its `target` window, and it stayed that way once `disabled` was removed; on a link that became disabled later, a click on an icon or a `<span>` inside it loaded the link into the popin, and a click on the link itself, although ignored, left the popin unable to close through `gina.popin.close(name)` or a form''s `close()`; and a click on markup inside a disabled close element closed the popin. A link whose `disabled` is removed, or that carries `disabled="false"`, now works as the same link without it: it loads into the popin or opens its `target` window, and a link carrying its own `id` closes the popin, as it already did when it was never disabled. An `<a>` with no `href` that carries `disabled` is still left as written. Browser-bundled: restart the bundle and re-bake it (`gina bundle:build`) to pick it up. (#B994, #B1007, #B1008)'
