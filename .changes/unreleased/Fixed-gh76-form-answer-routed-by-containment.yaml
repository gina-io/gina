kind: Fixed
body: 'A form''s `text/html` XHR answer is now routed by the popin the SUBMITTING form is rendered in, resolved by containment at submit, never by "the active popin". A page form whose answer arrived while a popin was open had that popin''s content replaced by the answer; arriving while a popin was still loading (reachable through a trigger opted out of preload, a programmatic load, or a click before the hover warm - not through a hovered default trigger) it raised a false `422` error callback, `Popin x is not open !`, after a successful server write; and with two popins open the answer landed in whichever open one had been registered first. The answer of a form that is not inside a popin is delivered to its own handler unchanged; a form inside a popin still loads its answer into that popin, and `popinLoadContent` now loads into the popin it is called on. `getActivePopin()` returns open popins only. In dev mode a console notice names the popin the former rule would have targeted (https://github.com/gina-io/gina/issues/76)'
