kind: Fixed
body: 'A popin constructed with `preOpen: true` now treats the time between its loading shell showing and its content landing as an explicit state, `isLoading`, instead of a half-state nothing could name. Five things went wrong in that window: `loadContent()` on the popin threw `is not open !` for the whole round trip; `close()` returned without closing, so the shell could not be dismissed programmatically; a load that failed fired `error` and left the skeleton showing with nothing to dismiss it; a native Escape closed the dialog behind the plugin''s back, and the content landing afterwards ran the real open and re-opened the dialog the user had just dismissed (measured on the published bundle); and the close-time teardown keyed on a class a dialog shell never carries. Now `loadContent()` on a loading popin injects into the dialog and completes the open, so `open` fires once, from that completion, and content still in flight lands afterwards as any later `loadContent()` would; `close()` and `destroy()` on a loading popin cancel the load (a transport still in flight is aborted, and a cancelled load fires no `error`), tear the shell down, release the trigger and fire `close`, so a dismissed dialog never comes back when its content arrives; the native `close` listener is bound when the shell shows, so an Escape during the load takes that same path; and a load that fails fires `error` first, so a listener that calls `loadContent()` keeps the dialog with its own content, then closes the shell if nothing handled it. A popin without `preOpen` shows nothing while it loads and never enters the state. Three visible changes: `loadContent()` no longer throws while the popin is loading, a loading popin closes, and a failed load closes its shell unless an `error` listener loaded content into it. `getActivePopin()` still returns open popins only, so a loading popin is not the active one (https://github.com/gina-io/gina/issues/76)'
