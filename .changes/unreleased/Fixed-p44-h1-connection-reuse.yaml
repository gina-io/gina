kind: Fixed
body: 'Bundle-to-bundle `self.query()` calls over HTTP/1.1 now reuse their connections. Each call used to build its own connection pool and throw it away, so every call opened a new TCP connection (500 sequential calls to one bundle opened 500); calls to the same upstream now share one keep-alive pool, kept for the life of the bundle (the same 500 calls use one connection). Each upstream gets its own pool, so a `bundle@project` call still reaches its own upstream, and two upstreams, or one host reached with two CAs, never share one. `maxSockets` (default 100) now limits the concurrent connections to one upstream, which it never did before: a call beyond the limit waits for a free connection, and its `requestTimeout` starts once it has one. At most 50 pools are kept per process; the least recently used one is retired without cutting a call in flight. HTTP/2 calls are unchanged. Pickup: bundle restart, no re-bake (#P44)'
