kind: Security
body: 'A page served from the render cache no longer sends one visitor''s cookies to the others. A cache entry stored every header of the response that filled it, `Set-Cookie` included, and every hit sent them back: a cookie set before the render, by a middleware (the CSRF plugin''s `gina-csrf-token` included) or by the action, reached every visitor of the cached page until the entry expired, and the `fs` strategy also wrote it to the entry''s `.meta` file. The session cookie of `gina.plugins.Session` was not affected (express-session adds it when the response starts, after the entry is stored). An entry now stores no `Set-Cookie` on any strategy (memory, `fs`, `redis`), and both engines'' hits skip it in an entry stored by an earlier release, so a cookie set on a cached route reaches only the visitor whose request filled the entry. Pickup: a bundle restart, no re-bake (#B1101).'
