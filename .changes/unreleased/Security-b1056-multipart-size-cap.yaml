kind: Security
body: '`upload.maxFieldsSize` now counts the bytes a multipart request sends (#B1056): past the cap the upload stops, the files it staged are removed, the request is answered HTTP 431 and cut: on HTTP/1.1 the connection closes, on HTTP/2 the request''s stream stops being read while the session keeps serving its other streams, so a client still writing may read the close, or stall, instead of the answer. A request under the cap is unchanged. Pickup: a bundle restart, no re-bake.'
