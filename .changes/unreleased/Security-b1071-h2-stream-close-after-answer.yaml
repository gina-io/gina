kind: Security
body: 'Over HTTP/2, a request answered while its client is still sending the body no longer leaves its stream open: once the answer has gone out whole, the server closes the stream with RST_STREAM(NO_ERROR), and the session keeps serving its other streams. This covers the 431 past `upload.maxFieldsSize` counted on a multipart request that sends no `content-length`, the 413 past `server.maxBodySize`, the 400 of a multipart body that fails to parse, and, on Bun 1.2 and 1.3, the 431 sent before the body of a request whose `content-length` is past the cap. Before, the client could keep sending into a request nobody reads: one more stream window (up to 640 KB) on Node.js and Bun 1.4, then a stall, and on Bun 1.2 and 1.3 everything it sent, which the bundle held in memory. HTTP/1.1 requests are unchanged. Pickup: a bundle restart, no re-bake (#B1071).'
