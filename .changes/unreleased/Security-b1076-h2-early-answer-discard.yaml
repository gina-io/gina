kind: Security
body: 'On Bun, over HTTP/2, a request answered before its body is read no longer keeps what its client still sends: the body is discarded, and once the answer has gone out the server closes the stream with RST_STREAM(NO_ERROR). This covers the `/_gina/*` control endpoints and the cross-origin guard, the maintenance gate, the admin endpoints answered ahead of routing, a static file answered to a request that carries a body, and the stops of #B1071 when the client never reads its answer (a zero receive window). Before, Bun 1.2 and 1.3 held everything the client sent in memory, without bound, and Bun 1.4 held the client at the stream window. Node.js and HTTP/1.1 requests are unchanged. Pickup: a bundle restart, no re-bake (#B1076).'
