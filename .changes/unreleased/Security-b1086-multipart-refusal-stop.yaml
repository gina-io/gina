kind: Security
body: 'Over HTTP/2, a multipart upload that gina refuses while it parses the body now stops at the refusal: the parts it staged are removed, and once the answer has gone out the server closes the stream with RST_STREAM(NO_ERROR). This covers the 400s for too many files (`upload.maxFields`), an upload group that is not configured, an extension the group does not allow and a second file in a single-file group, the 500s of an upload directory that cannot be created, of a write error and of a multipart listener that throws, and the 400s past `upload.maxTextFieldSize` and `upload.maxTextFields`. Before, a refused file part was never read, so the parse waited on it while the client kept sending: Bun 1.2 and 1.3 held everything the client sent in memory, without bound, and Node.js and Bun 1.4 held the client at the stream window with the stream left open; when the client finished sending, the parts staged before a refused file part, or after a refused text field, stayed on disk (Node.js and Bun 1.4). A client that never reads the answer (a zero receive window) is held at the stream window on Node.js, and on Bun what it sends is discarded. HTTP/1.1 answers are unchanged: the connection closes after them, as before. Pickup: a bundle restart, no re-bake (#B1086).'
