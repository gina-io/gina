kind: Security
body: 'Gina now requires `@rhinostone/swig` `^2.12.1` in both manifests. Up to 2.12.0, a key from the template data that names `__proto__`, `constructor` or `prototype`, or a list holding one of those names, reached the prototype chain wherever a template read a value with it: a subscript such as `{{ foo[k] }}` printed the Object constructor, a call on such a value could run text from the data as JavaScript, and a native `{% set %}` whose bracket target took the key (`{% set obj[k].x = 1 %}`) put a property on `Object.prototype` for the whole process (advisory GHSA-8mf3-p375-389g). A template is exposed when it indexes a value with a key that the request controls. 2.12.1 reads such a key as missing, and a native `set` target given one throws « Unsafe assignment to "__proto__" via bracket notation is not allowed (prototype-chain guard) » when the template runs; a template indexing with an ordinary key renders as before. The templates Gina ships use no bracket subscript, and Gina compiles a template each time it renders it and stores no compiled output, so restarting the bundle picks the fix up; output an application precompiled with swig 2.12.0 or earlier (`swig compile`, a stored `precompile()` result) keeps the old behaviour until it is recompiled with 2.12.1. Upgrading gina installs 2.12.1 or later (a project copy loaded through `swig.useProject`, or a frontend selected through `swig.package`, keeps its own version, so update it there to 2.12.1); restart the bundle. (#B1088)'
