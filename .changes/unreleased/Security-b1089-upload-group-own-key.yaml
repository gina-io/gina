kind: Security
body: 'An upload part whose `group` parameter names a member of `Object.prototype` (`__proto__`, `constructor`, `hasOwnProperty`, `toString`, …) is now answered HTTP 400 as an unconfigured upload group, like any other unknown name. Up to 0.7.8 such a part passed the configured-group check, which read the name on `upload.groups` without asking whether it was one of its own keys, and the rules then read on the group were skipped: the file was accepted whatever its extension, a single-file group accepted several, and the file was staged to the default upload directory instead of the group''s. This let a client, with no account, sidestep a restricted `untagged` group or a named group''s allow-list. Restart the bundle; the browser bundle does not change. (#B1089)'
