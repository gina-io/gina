kind: Security
body: '`self.requireController()` no longer keeps a copy of the required controller on every call outside development. Its cache guard had been commented out since 0.1.0, so each call evicted the super controller and the required controller from the require cache and required them again, and every copy stayed referenced by the router module for the life of the process: memory grew by about the required controller''s source size per call once V8 had flushed its code, until the process ran out of memory. Every call that passed an options object was affected, as an action''s `self.requireController(namespace, self._options)` does, and so was `resumeRequest()` when it replays a non-GET request into another namespace (a call without options threw before reaching the require cache, #B1031), so a route reachable without authentication let a client exhaust the process''s memory by repeating requests. Outside development both modules now load once per process, as a routed controller''s do, so a required controller''s module-level code runs once rather than on every call; in development they are still required again on every call, and the old copies are now released. (#B1126)'
