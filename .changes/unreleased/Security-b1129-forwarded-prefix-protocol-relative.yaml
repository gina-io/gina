kind: Security
body: 'On the isaac engine, an `X-Forwarded-Prefix` request header whose value opens with two slashes is now refused like a malformed one, and the page keeps the bundle''s own webroot. Such a value passed the path-character check added in 0.6.8, but the public webroot composed from it (`//evil.example/<webroot>/`) is a protocol-relative URL: the browser fetched the client routing table (`_gina/assets/routing.json`) from the host it names, and the gina stylesheet too when `gina.min.css` was not already linked, and the client then built its route URLs from the table that host served. A client reaching the bundle directly, or through a proxy that passes the header on (nginx does unless its configuration sets `X-Forwarded-Prefix`), could send such a value; with the concurrent-render and render-cache defects fixed in the same release (the second is #B1131), it could reach other clients'' pages. (#B1129)'
