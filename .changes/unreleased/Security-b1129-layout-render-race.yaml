kind: Security
body: 'With the render cache off, the default when `settings.json` has no `server.cache` block, in production as in development, concurrent renders of swig pages sharing a layout no longer serve one another''s request values. Every such render wrote the layout to one shared file under `templates/html/.gina-layout-cache/`, wrote the request''s whispered values into it (`page.environment.hostname`, `.webroot`, `.culture`, the validation labels, the proxy host), and swig compiled the page from that file, so under parallel load a page could carry another request''s hostname, webroot or culture, or arrive without gina''s client loader, and on a bind-mounted templates directory the file could be found absent (`ENOENT`, a 500). Those values come from request headers (`X-Forwarded-Host`, `X-Forwarded-Prefix`, `Accept-Language`, the culture cookie), so one client''s headers could reach other clients'' pages. Each render now assembles its layout in memory and swig compiles the page against it through the engine''s loader; with the cache off nothing is written under `.gina-layout-cache`, and with the cache on the file is still written, now without the values that vary per request (#B1131). (#B1129)'
