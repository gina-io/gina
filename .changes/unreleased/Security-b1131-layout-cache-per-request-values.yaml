kind: Security
body: 'With the render cache on (`server.cache.enable`), the first page render no longer fixes the values a swig page''s client loader reads for each request, for every later visitor. Those values (the public hostname and webroot, built from `X-Forwarded-Host` and `X-Forwarded-Prefix`, the proxy host, the negotiated culture and its validation labels) and a layout''s `{{ page.section }}` were written into the layout before swig compiled it, and with the cache on each view''s compiled template is kept and the layout is written under `templates/html/.gina-layout-cache/` and read back by every later compile, a restarted process included. So the first page render after that file was created (after a deploy that starts without it, or after the directory was emptied) gave its hostname, webroot and culture to every later render of every view sharing the layout, until the file was removed: a client reaching that render first with forwarded headers of its own fixed a foreign webroot or hostname for everyone, and a route''s output cache replayed the page. Swig now renders these values from each request''s data; every other value is written into the layout as before, and the http/2 preload hints still resolve a layout URL written with `{{ page.environment.webroot }}`. A layout file an earlier release wrote is primed again on the next compile. Pages a route''s `fs` or `redis` output cache stored before the upgrade are not served after it, since that cache is namespaced by framework version, unless `GINA_CACHE_NAMESPACE` keeps its value across the upgrade: then run `gina cache:clear`. The output cache still keys a page on its URL alone, so a cached page keeps the host and culture of the request that filled it until it expires. (#B1131)'
