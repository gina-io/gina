kind: Security
body: 'A route''s output cache (`cache` in `routing.json`) keyed a page on its URL alone, so the request that filled an entry decided what every later visitor of that URL got until the entry expired: its host in the absolute links and form actions `getUrl()` builds and in gina''s client loader values, its webroot, and its language in the translated text and the validation labels. Where a bundle accepts a client''s `Host` or `X-Forwarded-Host` (reached directly, or through a proxy that forwards them), a request carrying another host could fill an entry so that every visitor''s links and form submissions went to that host. The key now also carries the request''s forwarded scheme and host, its forwarded prefix and the culture its culture cookie or `Accept-Language` selects, compared as written (`fr` and `fr_FR` are two entries); an `fs` entry is stored under a directory named for them, and `GET /_gina/cache/stats` lists each entry''s `variant`. A page is stored only when it was rendered with those values: a culture taken from a URL prefix, or set by a middleware, that the headers do not select is rendered each time. A script that pre-fills cached routes now fills only the entries for the host, scheme and language it sends, so make it send what your visitors send. Entries stored before the upgrade are not read after it; with a constant `GINA_CACHE_NAMESPACE`, `fs` files from before stay on disk until `gina cache:clear` removes them. Server-side: restart each bundle. Affected since 0.1.6 (#B1132)'
