kind: Security
body: 'WebSocket over HTTP/2 (`app.onWebSocket()` and `method: "ws"` routes): a session now answers at most `maxPendingAutoPongs` Pings automatically (60 by default) while earlier Pongs are still waiting to be written, and resets the stream past that: the session closes with 1006. Before, a client that sent Ping frames and did not read the Pongs made the session queue every Pong, so memory grew until the process ran out of it. A session also no longer answers a Ping after it has sent its Close frame, and a close the peer leaves unanswered for the close timeout (5 s) now resets the stream instead of half-closing it, so data still queued at that moment is dropped. `param.wsOptions` (and `onWebSocket()`''s third argument) accepts `maxPendingAutoPongs`; `0` restores the unbounded behaviour. Only bundles serving WebSocket routes on Isaac with `http2Options.enableConnectProtocol: true` were affected. Restart the bundle. (#B1139)'
