kind: Security
body: 'Isaac bundles whose `settings.json` sets `ioServer.integrationMode` to `"attach"`: Isaac''s own upgrade listener, which hands engine.io the upgrades on paths other than engine.io''s own (a bundle''s push path, for instance), no longer hands it an upgrade on engine.io''s own path (`/engine.io/` unless `ioServer.path` says otherwise), which engine.io''s own listener already serves, nor any upgrade when the websocket transport is disabled, and it drops the socket if engine.io throws. Before, a WebSocket request could throw inside that listener and stop the bundle. Upgrades on other paths reach engine.io as before. Only bundles in attach mode were affected. Restart the bundle. (#B1140)'
