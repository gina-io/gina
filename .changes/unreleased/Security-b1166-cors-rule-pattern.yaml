kind: Security
body: 'The rule that picks a response''s `Access-Control-Allow-Origin` compiled regular expressions from the request: a value from the request''s `Origin` (or, without one, its scheme and `Host`) that it never used, and, for an HTTP/1.1 request without an `Origin`, a pattern from its `Host` tested against a `Referer` that is always empty at that point. An `Origin` or `Host` that is not a valid pattern, or a request with no `Host` at all, made the rule throw. On a static file the throw stopped the bundle process; on a page, a 404 or a preflight the request was left unanswered. Through 0.7.13 every bundle ran the rule, whatever its configuration; in 0.7.14 a bundle runs it for a configured `access-control-allow-origin` name. The rule now compiles no pattern from the request: an HTTP/1.1 request without an `Origin` takes the bundle''s configured scheme, a `{name@project}` token with no bundle configuration behind it is left as written, and a rule that throws (a configured value that is not a string) sends no `Access-Control-Allow-Origin` and logs the error instead of stopping the bundle. A bundle restart picks it up (#B1166)'
