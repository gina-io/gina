kind: Security
body: 'gina compared a request''s method with each rule''s `method` by compiling the request''s method as a regular expression. Over HTTP/1.1 Node answers a method it does not know with a 400 before the request reaches gina, but an HTTP/2 client can send any token as its method: `*` or `+` made the compile throw, so the request was never answered, and a method such as `.` matched every rule, so an action ran under a method its rule does not list, without its body; a long run of `.*` made the match backtrack for seconds, during which the bundle answered no other request. A request whose method is not in Node''s `http.METHODS` now gets a 501 (Not Implemented) before any rule is compared, and the method is matched as text; the methods Node lists match as before. A bundle restart picks it up (#B1168)'
