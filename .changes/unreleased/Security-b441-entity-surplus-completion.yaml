kind: Security
body: 'A completion that an emit-style entity method signals AFTER its call has settled is now discarded at the entity''s `emit`, never buffered for the next caller. A method that emitted its completion trigger more than once per call — once per iteration of an internal loop, for instance — settled its caller on the first emit correctly, but every later emit reached the entity after the dispatcher had drained the queue and removed itself, so it took the legacy buffering path into `_arguments`; the NEXT detached (`util.promisify`-style) caller of that method then consumed the buffered entry as its own result, the caller after it too, and the buffer grew by one entry per surplus emit until the bundle restarted. Measured on a built `--env=prod` release: callers B and C both received A''s record and `_arguments` read 2, 4, 6. Entity-context callers (`entity.method()` returning a Promise) were immune through their per-call clear, and development mode masked the defect entirely because its per-call clear runs on every wrapped call — a clean local reproduction is not evidence a deployment was unaffected. Where such a method reads a user-scoped record, an ownership check could pass on another principal''s row. Every settle path now stamps the call''s resolver, and the `emit` override treats a completion of an already-settled call as surplus: not buffered, and reported once per call at debug level as `DISPATCH:REPEAT_EMIT` when a method emits its completion a second time (one late completion after a Promise or timeout settle stays silent). `DISPATCH:NO_CONTEXT` now also fires when a completion reaches the entity outside any call''s async context with nothing pending — that case used to log nothing, so a zero count was ambiguous. Numbered `<trigger>1`, `<trigger>2` loop variants are unaffected, and the dispatcher lifecycle is unchanged. Pickup: a bundle restart; no re-bake. (#B441)'
