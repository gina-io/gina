kind: Security
body: 'A failed Couchbase N1QL statement no longer carries its own result rows into the error it raises. The connector used to place the query service''s whole response envelope — result documents included — on `error.stack` and `error.cause.http_body`, so a `RETURNING` statement that lost a CAS race, or a SELECT that timed out part-way, wrote the records it had already produced into any log that printed the error (the controller error path prints the stack; a `console.error(err)` prints the cause). Both now carry the envelope with `results` replaced by a row-count marker; `errors`, `requestID`, `status`, `signature` and the classifier''s `first_error_code`/`retry` are unchanged, the SDK''s own error object is copied rather than mutated, and a body the connector cannot parse is dropped rather than forwarded. Anything that read result rows back out of a query error''s stack trace will no longer find them. (#B509)'
