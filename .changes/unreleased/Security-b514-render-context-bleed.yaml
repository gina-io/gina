kind: Security
body: 'A response rendered on the default swig path no longer carries a concurrent request''s context. The template filters `getUrl`, `getWebroot`, `t` and `tIcu` resolve per-request context through `getRenderCtx()`, which reads an AsyncLocalStorage store first and falls back to the process-wide `SwigFilters.instance._options` singleton — and that store was entered by the two `-async` render delegates alone, leaving every bundle on the DEFAULT path (the one taken unless a bundle opts into `settings.template.swig.loader`) resolving against the singleton. Both default delegates are themselves async and await between the per-request stamp of that singleton and the template invocation, unconditionally so on the layout read, so a concurrent request''s stamp lands inside the window and the resumed render emits the other in-flight request''s negotiated culture, webroot and proxy classification into its own response — the wrong language for a visitor, and absolute URLs built from a host the other client chose. Measured on a built `--env=prod` release: 50 of 50 concurrent request pairs served one response carrying the other request''s context before the fix and 0 of 100 after, with a serialized control and a reused keep-alive connection reading clean throughout. Development mode masked it, because `lib/index.js` re-requires the filter module per request there and no singleton is shared. `controller.render-swig.js` and `controller.render-v1.js` now enter the same store the async delegates use, so the singleton remains only for callers outside a request, such as a bundle''s own mail or cron renderer. Pickup: a bundle restart; no re-bake. (#B514)'
