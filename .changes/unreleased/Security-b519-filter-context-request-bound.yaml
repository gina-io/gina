kind: Security
body: 'The context-bearing template filters (`getUrl`, `getWebroot`, `t`, `tIcu`) could resolve another request''s context when a template ran on a request path outside a render delegate (#B519, #B809). The filters find their context at call time: a per-render store first, then a process-wide slot that every filter-factory call stamped, every request''s render included. A template executed in a controller action through the engine handle (`self.engine.compile(...)(data)`, `compileFile`), with no render store of its own, therefore resolved the context of whichever request had rendered last on the worker: its negotiated culture, and absolute URLs built from that request''s host. No concurrency was needed. A scheduled task, a worker or a WebSocket handler rendering with no context of its own read the last request''s context the same way. Inside a request the filters now resolve that request''s own context: the render store, else the request''s own store, on which the controller registers its options. A filter-factory call made inside a request is bound to that request instead of the process-wide slot, which is now read and written only outside a request and so never holds a request''s context. The default nunjucks delegate runs its render inside the render store like the other delegates. Affected: every release through 0.7.3. Server-side only: restart the bundle.'
