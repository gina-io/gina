kind: Security
body: 'The framework''s third `throwError` — the one behind the global `getConfig()` and `getLib()` helpers, reached when a configuration slice or a library cannot be resolved during a live request — no longer writes the error''s full stack to the HTTP response, and now records the failure server-side. It used to answer in every scope with the raw stack in the `error` string — the framework''s install path and version directory, the application''s file paths and line numbers, the bundle, environment and library names — and emitted no log line at all, so an operator could neither see it happen nor search for past occurrences. It now does what the other two error builders have done since 0.5.24: a short incident `ref` is minted and returned as a top-level field on the JSON body, ONE full-detail line (message, stack, cause, request id) is logged before the response is written, keyed by that ref, and outside local scope the response carries the message line only. Local scope keeps the stack in the `error` string, as before, so the dev toolbar is unaffected; a relay-safe `ref` supplied on the error is honoured. The one-argument string form now reports the string instead of `undefined`, and the never-reachable HTML arm of this path is removed. Affects every release since `0.1.0`. Pickup: a bundle restart; no re-bake. (#B533)'
