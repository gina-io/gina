kind: Security
body: 'A queued async job now runs inside a detached copy of the request context that created it. The worker pumps its queue from the settle chain of the job that just finished, so under load a job created by one request ran inside the per-request context of whichever request''s job had freed the worker slot — measured on a single-worker bundle: a job created by request B executed seeing request A''s context, response objects included. Everything that reads that context then attributed the job to the wrong request: an absolute URL the job built through `getRoute().toUrl()` used the other request''s proxy context and host; a failure the job raised through the global `getConfig()` / `getLib()` helpers was handled as that other request''s — written to its response, or handed to its middleware chain once the response had gone out; and a JSON log line the job wrote carried the other request''s id. `create()` now captures the creating request''s identity and proxy context — never its `req`, `res` or `next` — and the whole lifecycle of the job (its record transitions, the deferred function, a retry it arms, its completion webhook) runs inside that copy; a job created outside any request runs with no request context at all, even when the worker that starts it was freed by a request''s job. `throwError` treats a detached context as authoritative: with no live response to answer, a failing job is logged (fatal) or the error is thrown to the job (non-fatal), never written to any client. The per-request context has existed since `0.4.5`, where the misattribution reached JSON log lines only; the URL-host reader arrived in `0.6.28` and the response reader in `0.6.30`. Nothing about the job record changes, so durable stores serialise exactly what they did. Pickup: a bundle restart; no rebuild. (#B543)'
