kind: Security
body: 'A request carrying a top-level field named `count` no longer crashes the bundle. gina installs a `count()` helper on `Object.prototype`, and the framework reached it as `<container>.count()` on containers whose keys the CLIENT chooses: the parsed request body, the query bag, route params, uploaded files, data handed to `self.query()`, a routing rule''s validator data, and whatever a template pipes through `| length`. An own property of that name shadows the helper, so the framework called a string. On the body branches, which parse inside a try, that surfaced as a 500; on the query branches, which do not, it reached the process as an uncaughtException and the bundle EXITED — unauthenticated, one request, on any URL including one matching no route, because the body parse runs before routing resolves. A route param of that name left the request hanging open instead of answering. Every published version is affected. The framework now reaches the helper through a form no own property can shadow, via a small `ownCount()` on each affected module; it is the same function body, so every other receiver shape counts exactly as before, and `null` and `undefined` still throw exactly as the shorthand did — the empty-object seeding in the body-parse branches depends on that. Nested fields (`{"outer":{"count":1}}`) and near-misses (`counter`) were never affected, and are unchanged. Application code calling `x.count()` is untouched: the helper stays on `Object.prototype`. Counts over framework-built objects (response headers, the routing table, config) deliberately keep the shorthand. Pickup: a bundle restart AND a re-bake (#B546).'
