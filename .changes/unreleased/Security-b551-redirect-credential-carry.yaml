kind: Security
body: 'Credentials no longer ride a redirect. `self.redirect()` carries the request''s parameters to the redirect target - on the session as `inheritedData`, or in the target URL when the bundle has no session - and for a `POST` that container is the parsed body verbatim, so a login form''s plaintext password was carried with it. On the session that meant the password was written to the session store, where on an authenticated flow it survived the redirect target''s own request; where the bundle has no session it meant the password appeared in the redirect URL, and so in access logs, proxy logs, browser history and any `Referer` the target sends onward. A rejected login attempt was carried the same way. Fields whose names match the framework''s existing redaction list - the same maintained, tokenising matcher the Inspector uses to mask these values in its own pane, covering `password`, `secret`, `token`, `apikey`, `authorization`, `credentials` and their case and separator variants - are now dropped from what is carried, while everything else travels exactly as before; keys describing rules or configuration, such as `passwordRules`, are deliberately still carried. Behaviour change: an application that deliberately carried a field with one of those names across a redirect no longer receives it at the target and should pass it by another route (#B551).'
