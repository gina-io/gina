kind: Security
body: 'The built-in error pages now HTML-escape every value they render. A crafted link to any route whose action redirects - carrying a query string such as `?error=<script>...` - made the fallback error page reflect that value as markup and execute it in your application''s origin, in every scope and on every released version; a newly scaffolded bundle, which configures no `errorFiles`, hit exactly that page. The same escaping is applied to the engine-level error page (whose text is built from the request path by its 404, 403 and 500 callers) and to the three nunjucks error-document fallbacks. Behaviour change: an application that deliberately passed HTML in an error title or message now sees it escaped - that reflection was the vulnerability. The scope gate on stack traces is unchanged (#B554).'
