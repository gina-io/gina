kind: Security
body: '`self.redirect()` no longer lets a request parameter decide whether the redirect happens. A key named `error` in the incoming query string or request body was read as an instruction to raise an error, so any unauthenticated request to any route whose action redirects could force a 500 by adding `?error=` - on both engines, with no route opt-in, and in every released version. An EMPTY value was worse: the empty string is falsy, so the late-call guard inside `throwError()` mistook it for a call on an already-released response, logged "ignoring late error:" with nothing after the colon and returned without writing anything, leaving the request unanswered for as long as the client held the connection - and nothing reaps that, because `server.timeout` defaults to 0 so that SSE and WebSocket responses are not cut off. The key is now an ordinary parameter: it rides the redirect in `inheritedData` like every other one, which is what the documented "carrying request data across the redirect" example always described - that example could not work as written while the gate stood (#B559).'
