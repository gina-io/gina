kind: Security
body: 'Over HTTP/2, a static file served by the built-in engine no longer carries another request''s response headers (#B566). The first static request after boot registered a byte-serving listener on the server that kept that request''s response object for the life of the process and served every later static through it, folding the captured response''s headers — its `Set-Cookie`, its request id and its CORS headers among them — onto every other client''s stream. Any middleware that sets a per-request header eagerly (the framework''s own CSRF plugin does) turned that into a cross-user cookie delivery. The same listener served an HTML static it had not seen before as a raw binary, and once a directory URL had been requested it answered that directory''s index URL with a destroyed stream for the rest of the process''s life. The listener and its server-push branch are removed: every HTTP/2 static is now served by the static handler on the request''s own response, so it carries that request''s headers, the dev `cache-control: no-store` set and the production `ETag`/`Last-Modified` with `304` support that the listener path never emitted. HTTP/2 server push, which browsers no longer support and which only a push-capable client could reach, is no longer implemented. Every published version is affected. HTTP/1.1 was never affected. Pickup: a bundle restart; no rebuild.'
