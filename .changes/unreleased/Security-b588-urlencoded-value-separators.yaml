kind: Security
body: 'An `application/x-www-form-urlencoded` POST, PUT or PATCH body is no longer percent-decoded as a whole before it is split, so an encoded `&` or `=` inside a field value or a field NAME can no longer act as a separator and add or override other fields of the request (`role=user&bio=hi%26role%3Dadmin` arrived as `role=admin`, and so did `role=user&a%26role%3Dadmin=x`). The body now follows the standard form algorithm: split on `&`, then at the first `=`, each name and value decoded exactly once, so `field=a%26b` is `a&b`, `field=a%3Db` is `a=b`, a raw `=` inside a value is kept (`token=YWJj==` keeps its padding) and a typed `100%25` (sent `100%2525`) stays `100%25` instead of collapsing to `100%`. A quoted token in a value keeps its quotes (`%22true%22` is six characters, and so is a raw `"true"` in a hand-built body); a value that is a JSON document is parsed as JSON and keeps its own types, so a quoted `"true"` inside it stays a string (a text pass over the whole body used to turn it into a boolean), and under a bracket name it nests (`items[0]={…}` now gives `items` an element instead of a field literally named `items[0]`); a value that merely starts with `{` or `[` is kept verbatim instead of dropped; and a value-less `{`-leading segment no longer replaces the whole body. Bare `true`/`false`/`on`/`null` stay strings on this path, as they always did. Pickup: restart AND re-bake — the helper ships in the browser bundle. (#B588)'
