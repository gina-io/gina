kind: Security
body: 'A request-parsing failure no longer writes the unparsed body or query to the log. The data helper''s three parse-failure lines printed the whole document, segment or value verbatim at error level (the body of a malformed `{`-leading request that is not labelled `application/json`, or every parameter of a GET whose serialized query document failed to parse, a password or a token included), and the same lines ship in the browser bundle, so they reached the console too; the isaac query parser warned with a query value the same way. The remaining sites now log metadata only — the helper''s document line the input''s length, its first character and the error''s name, the isaac warn the parameter''s name, the value''s length and the error''s name — never the value, and never the parse error''s message, which can quote the input; the two segment-level lines are gone, because a urlencoded value that is not JSON is now kept as text instead of reported (#B588). (#B590)'
