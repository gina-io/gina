kind: Security
body: 'A request-parsing failure no longer writes the unparsed body or query to the log. The data helper''s three parse-failure lines printed the whole document, segment or value verbatim at error level (the body of a malformed `{`-leading request that is not labelled `application/json`, or every parameter of a GET whose serialized query document failed to parse, a password or a token included), and the same lines ship in the browser bundle, so they reached the console too; the isaac query parser warned with a query value the same way. All four sites now log the input''s length and the error''s name only. (#B590)'
