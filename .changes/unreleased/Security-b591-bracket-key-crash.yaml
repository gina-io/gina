kind: Security
body: 'A bracket-notation field name whose non-last segment is numeric while its container is not an array (`0[a]=1`, or `a[0][b]=2` after `a[x]=1`) no longer throws inside the nesting helper. The throw was a TypeError on a null slot the helper had just seeded for itself, and from the GET/HEAD `inheritedData` call site it had no try/catch: one unauthenticated `GET /any-url?inheritedData=0%5Ba%5D%3D1` exited the bundle process (measured: exit 143, the next request refused). A urlencoded POST/PUT/PATCH with the same field name answered 500, and the validator''s client-side twin threw inside the browser, breaking the whole submission. Such a segment now creates a plain object slot (`0[a]=1` nests as the key `0` holding `a`); every previously non-throwing shape is unchanged. (#B591)'
time: 2026-09-23T06:20:10+01:00
