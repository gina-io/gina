kind: Security
body: 'A request field named `__proto__`, `constructor` or `prototype` at the top level of a urlencoded body or a query document is now dropped: assigned flat, a JSON-valued `__proto__` pair swapped the PROTOTYPE of the parsed request object, so `req.post.polluted` read an attacker-chosen value that `Object.keys` and `hasOwnProperty` could not see (the process-wide pollution was already closed by #B446; this is the per-request object). (#B592)'
time: 2026-09-23T06:27:34+01:00
