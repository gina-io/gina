kind: Security
body: 'The Couchbase connector no longer writes caller or configuration values into N1QL statement text unvalidated. A `$N` inside `SEARCH()` was spliced into the statement as a double-quoted string literal with no escaping — a search term containing a `"` made the statement malformed, and the substitution rewrote every placeholder up to the statement''s last `)` — and is now bound as a query parameter, which Couchbase documents for `SEARCH()`''s query argument on every server version that has the function. A `$N` written as a field-path segment (`doc.flags.$1`) cannot be bound, so its argument is still written after the dot, but only when it is a string of identifiers separated by dots (`identifier(.identifier)*`); anything else is refused before dispatch with a `TypeError` (code `GINA_COUCHBASE_INVALID_FIELD_PATH`), delivered to the query callback when there is one and thrown otherwise. The scope written for `$scope` and stamped as `_scope` on inserted documents is now resolved once when the connector loads and must match `^[A-Za-z0-9_./-]+$` (letters, digits, `_`, `.`, `-` and `/` — the `/` so that a scope registered under the retired `scope:add <bundle>/<scope>` form keeps booting); otherwise the bundle refuses to boot (code `GINA_COUCHBASE_INVALID_SCOPE`, exit code 1). Behaviour changes inside `SEARCH()`: a non-string search term is no longer turned into a string, a value parameter following the call keeps its real type, and a statement compiles one prepared plan instead of one per search term. (#B608)'
time: 2026-09-24T19:34:45+01:00
