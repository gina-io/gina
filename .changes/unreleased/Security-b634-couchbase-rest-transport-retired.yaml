kind: Security
body: 'The Couchbase connector no longer has a REST query transport. With `useRestApi: true` on a couchbase entry of `connectors.json`, every N1QL query was sent over plain HTTP to the query service with the cluster credentials in an `Authorization: Basic` header, even when the entry used `couchbases://`, so the credentials travelled unencrypted where the connection was meant to be TLS. Who was exposed: a couchbase connector configured with both `useRestApi: true` and `couchbases://`; the option is off by default and was not documented. The same transport rewrote every single quote in the statement into a double quote and inserted parameter values without escaping, so a value holding `"` or `\` produced a malformed or different query. The option is now ignored, with one warning when the connector connects, and those queries go through the Couchbase SDK like every other query. (#B634, #B623)'
