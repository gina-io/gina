kind: Security
body: '`gina project:add` no longer passes `--scope` or `--env` through a shell. When either value named a scope or an environment that was not registered yet, the command registered it by running `scope:add` or `env:add` through a shell command line with the value spliced in unquoted, so shell syntax in the value ran as a command, as the user running `project:add`. Who was exposed: automation that builds these flags from data it does not control, such as a branch or ticket name, and runs `project:add` with them; the second shell parse defeated that automation''s own quoting. Typing the command yourself crossed no boundary, and `project:import` was never exposed: it refuses a project that is not registered, and for a registered one the CLI already refused any value that project does not list, before any child could run. `project:add` now checks both values with the scope and environment name rules before anything is written, so an invalid one is refused with exit 1 and no longer leaves the project half-added, and the child commands are started from an argument vector. `project:import` skips that check, so a name registered by an older release, which the rules may now reject, keeps importing. (#B640)'
