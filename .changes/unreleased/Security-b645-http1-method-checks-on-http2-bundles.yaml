kind: Security
body: 'On a bundle whose `server.protocol` is `http/2.0`, a request that arrives over HTTP/1.1 is now held to each route''s declared `method`. Such a bundle also serves HTTP/1.1 through the HTTP/2 server''s `allowHTTP1` fallback: a client that does not negotiate HTTP/2, or a reverse proxy that talks HTTP/1.1 to the bundle (nginx''s `proxy_pass` does). The router read the request method from the HTTP/2 `:method` pseudo-header whenever the bundle was configured for HTTP/2, and an HTTP/1.1 request carries none, so every method passed the method checks. Any method then ran a single-method route whose URL has no `:param` segment, and any method ran a multi-method route, parameters or not: a GET reached a POST-only action (and a GET is never asked for a CSRF token), a DELETE ran a `GET, POST` route, and a POST on a URL declared for both GET and POST ran whichever route was declared first. The route cache is keyed by method and path, so one such request also left the wrong action as the cached answer for every later client using that method on that path, HTTP/2 clients included, until a restart or until the entry was evicted — and a client could evict it with enough requests to any route that takes a parameter. Single-method routes with a `:param` segment were not affected, nor were bundles on the default `http/1.1` protocol. An HTTP/1.1 CORS preflight on such a bundle is now answered 204, as an HTTP/2 one is; it used to be routed, and the route''s action ran for the OPTIONS request. Pickup: restart. (#B645)'
