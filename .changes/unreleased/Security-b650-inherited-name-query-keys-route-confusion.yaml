kind: Security
body: 'A query key named like a member every object inherits — `toString`, `valueOf`, `toLocaleString`, `isPrototypeOf` — no longer counts as a route requirement. For a GET or DELETE request on a route that declares `requirements`, the router treats each request key that names a requirement the URL does not bind as a whole `:key` segment as an extra URL variable, and it looked the name up with a plain property read, which also finds those inherited members. Each such key, with a value shaped like that member''s source text, replaced one leading segment of the compared URL — the first the always-empty leading position, the second the bundle webroot, the next ones the path — so a request reached a route whose path differs from its own, including a path outside the bundle''s webroot, and the action received `req.params.toString` as a string. A path-based control applied outside the route, such as a reverse-proxy location rule, could be bypassed this way; the reached route''s own middleware and authorization still ran. Only requirements a route declares itself now count. Every release since 0.1.0 is affected, on Node.js and on Bun. Pickup: restart and re-bake. (#B650)'
