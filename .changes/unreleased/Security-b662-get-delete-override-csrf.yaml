kind: Security
body: 'A plain `GET` no longer runs an action whose route is declared `"method": "DELETE"`. So that the popin and link plugins could send their anchors as a `GET`, the router served any `GET` to such a URL as a `DELETE`, for any client. A cross-site navigation carrying the visitor''s session cookie could therefore run a `DELETE` action: on the Express engine even with the Csrf plugin adopted as documented, because the plugin runs before routing and treats a `GET` as safe (the default isaac engine refused it), and on either engine when the plugin is not used, since the Session plugin''s default `SameSite=Lax` cookie is sent on a top-level cross-site navigation. The override is now granted only to an XHR (`X-Requested-With: XMLHttpRequest`) that is not a browser cross-origin request: a `Sec-Fetch-Site` of `same-origin` or `none` passes, `same-site` and `cross-site` are refused, and an `Origin` that differs from the host is refused. Any other `GET` answers 404 on a URL whose only route is `DELETE`, and 405 on a route whose method list includes `DELETE`. The override now sets the request method to `DELETE`; on a route declaring several methods it used to hand the action the whole list (`req.method === "POST,DELETE"`). Client code that sends a `GET` to a DELETE-only route from outside the bundle''s own pages, or without the header, must send a real `DELETE`. Affected: every version up to 0.6.33, on both engines. Pickup: bundle restart (#B662, #B660)'
