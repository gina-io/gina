kind: Security
body: 'CLI commands that start other gina commands, or look up bundle processes, no longer build shell command lines. `project:start`, `project:stop` and `project:restart`; the `link-node-modules` and `link` steps that run on every `project:` and `bundle:` start, stop and restart; the `framework:link` step of a `bundle:start` that reinstalls a project''s `node_modules`; the `node_modules` repair step of `framework:link`; and the process lookups of `bundle:stop` and `minion:kill` all spliced the project or bundle name, and the forwarded `--` flags, into a command line run by `sh`, unquoted or inside single quotes, so shell syntax in a registered name or in a flag value ran as a command, as the user running gina. Who was exposed: automation that builds these names or flags from data it does not control and runs the commands with them, and anything that can send a `bundle:start` to the local framework daemon, which already runs any framework command for whoever reaches its socket (loopback only by default). Typing a command yourself crossed no boundary. These children now start from argument vectors, and `bundle:stop` and `minion:kill` read the `ps -ef` listing themselves. (#B665)'
time: 2026-09-27T01:24:38+01:00
