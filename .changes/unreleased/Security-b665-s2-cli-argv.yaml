kind: Security
body: 'More CLI commands no longer build shell command lines. `framework:status`, `framework:restart`, `framework:build`, the download and extract steps of `framework:add`, `gina .`, `framework:open`, the default-browser probes, browser launch and fallbacks of `inspector:open`, and the npm prefix look-ups of the CLI bootstrap and of `framework:init` put values into a command line run by `sh`: the arguments you passed, file paths, the Inspector URL, a pid file''s content. Shell syntax in any of them ran as a command, as the user running gina. The isaac engine''s brotli and gzip compressions of its routing files, which run at every boot, did the same with the cache path. Each value came from that user''s own command line, settings or files, so no boundary was crossed; these commands now start their children from argument vectors, and Windows keeps the command lines that need cmd.exe (`start`, `where` and `npm.cmd`). `framework:status` also listed every user''s processes and named a pid file after the title of any `gina-`-titled one, so another local user''s process titled `gina-v/../../x` made it write `x.pid` outside the run directory: it now lists the current user''s processes only and accepts only a framework daemon''s `gina-v<version>` title. (#B665, #B677)'
time: 2026-09-27T17:52:29+01:00
