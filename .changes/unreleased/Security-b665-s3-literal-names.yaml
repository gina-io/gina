kind: Security
body: 'The CLI now matches project, bundle and environment names literally when it looks them up in the port and project registries. It built regular expressions from the names, so a `.` in a name matched any character, and a name holding `+`, `(` or `[` broke the lookup or made the command throw: `project:remove @my.app` also removed the ports of `my-app`, `env:remove` could remove, and `port:list` list, another project''s entries, and `bundle:start` did not recognise the mounted line of a bundle whose name holds `+`, so it waited out its start timeout and stopped the bundle. The install scripts match the install prefix literally too: a prefix holding `c++` made `npm install -g gina` fail. These names come from your own registry and command line, or from what can reach the framework''s command socket, which listens on loopback by default. (#B665)'
