kind: Security
body: 'On the Express engine with Express 5, one request could stop the bundle: a DELETE, or a POST, PUT or PATCH sent without a body, on any URL, before routing and with no authentication. The Express 5 support added in 0.6.9 shadowed Express''s `req.query` getter with a plain writable property so the framework''s own assignments would work, but that left `request.query` undefined until the GET and HEAD branches assigned it; the DELETE branch and the empty-body fallback of the body-carrying branches counted it as it was, and the resulting TypeError inside the request''s end handler took the uncaught-exception path and exited the process. The property is now an accessor: on the first read it materialises Express''s own parse — honouring the app''s `query parser` setting at read time — as a plain, writable object of the request (a plain copy, because the default `simple` parser returns a null-prototype object that the framework''s `count()` helper cannot iterate), and assignments still store. Express 4, where the query middleware assigns the property on every request, and the default isaac engine were never affected. No layer is registered and no router is created at engine construction, so an `app.set(...)` made in `onInitialize` keeps its effect. Affected: `>= 0.6.9 <= 0.6.33` with `engine: "express"` and Express 5 installed. Pickup: bundle restart (#B666)'
