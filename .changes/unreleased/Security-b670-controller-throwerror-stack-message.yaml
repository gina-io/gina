kind: Security
body: 'A controller''s `self.throwError()` no longer sends a stack trace passed as the message to clients outside the local scope. A call such as `self.throwError(res, 500, err.stack)` or `self.throwError(500, err.stack)`, or an error object whose `message`, `error` or `title` holds a stack, put the file paths and frames in the JSON body and on the built-in HTML error page in every scope, because only the `stack` field was stripped. Outside the local scope such a value now keeps its first line in the JSON body, on the fallback page and in the data a custom error page receives, and the full text goes to the server log line that carries the incident ref. On the HTML path that line now logs the error''s own text rather than the `throwError` call site, and a `self.throwError(res, code, { ... })` call now writes one at all (it logged no line for its ref before). Local scope is unchanged. The engine-level error responder has done the same since 0.5.21. Affected: every version up to 0.6.33. Pickup: bundle restart (#B670)'
