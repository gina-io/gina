kind: Security
body: 'The start command that `gina tail --follow` re-runs when a bundle crashes is now saved under the framework home (`<GINA_HOMEDIR>/run/<bundle>@<project>.argv`, `~/.gina/run/` by default, written with mode 0600) instead of the system tmp directory, and on POSIX systems it is re-run only when that file is a regular file owned by the current user that group and other cannot write; any other file is refused with a warning. Where the tmp directory is shared between local users (`/tmp` on Linux by default), another user could create the file first: the owner''s own `gina bundle:start` then failed to overwrite it, and the next crash restart ran that user''s program under the owner''s account. Affected: every version up to 0.6.33. Pickup: restart `gina tail`, then start each bundle once so its file is written in the new place; until then a crashed bundle is not restarted automatically (#B676)'
time: 2026-09-26T12:40:49+01:00
