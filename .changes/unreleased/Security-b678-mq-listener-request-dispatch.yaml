kind: Security
body: 'The framework log listener (the MQ listener on port 8125, loopback by default) no longer stops the framework daemon when a connecting client sends a log frame whose `request` field names an inherited object member (such as `__proto__` or `constructor`) or the listener object''s own `name` field: such a value reached an array method on a non-array, or a call on a non-function, and threw out of the socket handler, ending the daemon process that also serves the command socket on 8124. The listener now accepts only a short identifier as a request name and dispatches only to its own methods, refusing any other frame with a warning and keeping the connection and the process. The listener binds loopback by default, so this was reachable only by a process on the same host. Affected: every version up to 0.6.33. Pickup: framework restart (#B678)'
