kind: Security
body: 'On the default (isaac) engine, a request carrying a very long `X-Forwarded-Prefix` header no longer ties up the bundle: the mount-path length and character-set check now runs before the trailing-slash trim, so an over-length value is discarded before any regular expression sees it. The trim used a pattern that backtracks quadratically on a long run of slashes, and it ran on the raw header on every request, so one request with a 15 KB header cost roughly 100 to 170 ms of CPU (about 8 seconds at the 64 KB an HTTP/2 header list admits) — enough for a few such requests a second to saturate a single-threaded bundle. A legitimate mount path (at most 255 characters) is unaffected; anything longer is ignored as before. Affected: every version from 0.3.10 to 0.6.33 on the isaac engine. Pickup: bundle restart (#B679)'
