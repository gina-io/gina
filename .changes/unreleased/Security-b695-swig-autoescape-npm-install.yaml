kind: Security
body: '`settings.swig.autoescape: true` is now applied when gina is installed with npm. A bundle''s Swig settings were read on every request through a helper that located the calling bundle by walking the call stack and skipping every frame whose path contains `node_modules`. Under an npm install (a global install, a project dependency, the image built by `gina image:build`) every framework file sits there, so the walk found nothing and threw; the render setup caught the error and continued with auto-escaping off while the bundle''s configuration said it was on, and nothing was logged. Affected: 0.5.25 to 0.7.0, npm installs only; gina run from a repository checkout was not. After upgrading, auto-escaping becomes active on such installs for every bundle that sets `autoescape: true`: before upgrading, print `gina.csrfInput` with `| safe` and mark every other variable that carries trusted markup with `| safe` (the 0.7.0 migration checklist). (#B695)'
