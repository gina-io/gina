kind: Security
body: '`run()` (also `gna.run`) and `Shell::run()` in `lib/shell` no longer write every command''s output to the fixed files `out.log` and `err.log` in the temp directory (`opt.tmp` / `GINA_TMPDIR`, the system temp directory by default): each run now gets a private directory of its own under that base — created with mode 0700 and an unpredictable name, removed with its two files when the command exits — and a failure while reading the output back is delivered as the run''s error instead of leaving the caller waiting. Two runs sharing a temp directory used to read each other''s output as their own (the later one received the earlier one''s stdout and stderr, the earlier one got nothing), and a run whose files a sibling had already removed never called back. Where the temp directory is shared between local users (`/tmp` on Linux by default), another user could create those names first, which stopped `gina project:add` / `project:import` and any `run()` call on that host, and on hosts without the kernel''s `fs.protected_regular` / `fs.protected_symlinks` protections let that user read the command output or have it appended to a file of their choosing. Affected: every version up to 0.7.0. Pickup: the CLI on its next command, a bundle calling `run()` on its restart; nothing to re-bake (#B702, #B664)'
