kind: Security
body: 'The framework CLI''s log-listener port file (`mq-listener-v<version>.port`, written by every `gina` command and read by `gina tail`) now lives under the framework home (`<GINA_HOMEDIR>/run/`, `~/.gina/run/` by default, written with mode 0600) instead of the system temp directory. Where that directory is shared between local users (`/tmp` on Linux by default), another user could create the file first: every `gina` command of the other users then failed at start-up, and on hosts without the kernel''s `fs.protected_symlinks` protection a symbolic link there had the command overwrite a file of that user''s choosing with the port number. Affected: every version up to 0.7.0. Pickup: restart the framework (`gina framework:restart`) and any running `gina tail`; nothing to re-bake (#B704)'
time: 2026-09-28T23:00:34+01:00
