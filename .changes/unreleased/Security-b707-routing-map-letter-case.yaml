kind: Security
body: 'One unauthenticated GET for the client routing table spelled in another letter case, such as `/_gina/assets/Routing.json`, no longer ends a bundle on the isaac engine (the default). Its routing-table fast path tested the URL without regard to letter case, then looked the file up by the requested spelling with an exact comparison: any spelling other than `routing.json` found nothing, and reading the empty result threw an uncaught `TypeError` that ended the process, before routing and every route guard, with any path prefix. The looked-up name is now lower-cased, so every spelling the test accepts serves the table. A request the bundle classified as proxied was served the host-stripped table and escaped the crash, but that classification reads request headers that a client reaching the bundle directly sets itself. The express engine serves the table from memory and was not affected. Affected: 0.1.6 through 0.7.0. Pickup: restart the bundle; nothing to re-bake (#B707)'
time: 2026-09-30T23:36:00+01:00
