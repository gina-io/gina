kind: Security
body: 'The cross-origin write guard in front of the built-in `/_gina/*` control endpoints now covers every URL those endpoints answer. Since 0.6.10 it refused a write from a page on another origin only when the URL began with `/_gina/` in lower case, while several endpoints also answer a leading segment (`/web/_gina/maintenance`, `//_gina/maintenance`), the endpoint path at the end of the query string (`/?next=/_gina/maintenance`) or another letter case (`/_GINA/cache/clear`, `/_GINA/storage/gc`). A page on another origin, visited by an operator browsing from an address listed in `app.json` `admin.allowFrom` (loopback by default), could therefore turn maintenance mode on (a 503 for every visitor), flush the render cache, run a storage garbage collection or trigger a release rebuild. The guard now looks for `/_gina/` anywhere in the URL, in any letter case; a cross-origin browser request with an unsafe method to an application URL that merely contains `/_gina/` (in its query string, for instance) is refused too, while same-origin pages and non-browser clients are unaffected. Affected: 0.6.10 through 0.7.0. Pickup: restart the bundle; nothing to re-bake (#B708)'
