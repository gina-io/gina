kind: Security
body: 'The admin `/_gina/*` endpoints (`/_gina/info`, `/_gina/cache/stats`, `/_gina/cache/clear`, `/_gina/storage/*`, `/_gina/release/*`, `/_gina/maintenance`) and `/_gina/metrics` no longer admit a request relayed by a reverse proxy running on the bundle''s own host. They authorise a caller by network address alone (`app.json` `admin.allowFrom` and `metrics.allowFrom`, loopback by default), and a proxy on the same host connects from loopback, so every client it forwarded was admitted: anyone who could reach the site could turn maintenance mode on (a 503 for every visitor), flush the render cache, run a storage garbage collection or read the process and cache state, with no browser and no credential. Blocking `/_gina/` at the proxy did not close it either, because several of these endpoints also answered a nested path (`/_gina/health/check/_gina/maintenance`, which a proxy location for the health check forwards), the endpoint path at the end of the query string, another letter case or an empty leading segment. A loopback entry now admits a caller only when it connects directly: a request from 127.0.0.1 or ::1 that carries a forwarding header (`X-Forwarded-*`, `Forwarded`) or a Host without a port is refused with 403, and the first refusal is logged once. An address listed explicitly, such as a proxy on another host, still admits what it relays. The endpoints now match only their exact path, at the root or under the bundle''s own webroot, with any query ignored; `/_gina/storage/*` and `/_gina/release/*` match in lower case only. A same-host proxy that forwards the Host header with its port and adds no forwarding header cannot be told from a direct client and is still admitted: call these endpoints on the bundle''s own port from the host or the pod, and block `/_gina/` at the edge. A bundle bound directly to port 80 or 443 receives a Host without a port from every direct client; set `server.proxy.requireForwardedHeaders: true` there to keep loopback access. Affected: 0.3.14 through 0.7.0. Pickup: restart the bundle; nothing to re-bake (#B709)'
