kind: Security
body: 'The staged-upload client layer rendered a staging request''s error message with innerHTML, so a reverse-proxy or WAF HTML error page — or a server error that reflects request text such as a rejected upload filename — was parsed as live markup in the page. The upload error slot now builds the message with createElement and textContent, so a server error message is always rendered as text (#B727, gh#83 part 4). Browser-bundled: rebuild bundles to pick it up.'
