kind: Security
body: 'A request whose urlencoded body, or whose GET/HEAD `inheritedData` query value, carried a bracket-notation field descending into a slot an earlier pair had set to null — for example `a=[null]&a[0][b]=1` — threw inside the request-body parser. On a GET or HEAD that throw had no handler and exited the bundle process, so one unauthenticated request could take a bundle down (an availability defect of the same class as the earlier bracket-nesting crash). The parser now replaces a null slot with a fresh container and nests through it; a non-null primitive still boxes and no-ops as before. A security advisory accompanies this fix (#B792).'
time: 2026-10-06T07:46:12+01:00
