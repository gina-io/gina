kind: Security
body: 'In every environment except dev, a route middleware that called one of the controller methods the framework gives it (`self.renderJSON()`, `self.redirect()`, `self.throwError()`, `self.render()`, `self.query()`, `self.getConfig()` and the others) after an `await` or in a callback used the methods of whichever request had last passed through the same middleware file: its answer could be written to another request in flight, and the request it belonged to was never answered. A bundle `controllers/setup.js` had the same defect. Each middleware instance and each `setup.js` run now gets the methods of its own request, and nothing is written onto the middleware class or onto the `setup.js` export. In `setup.js`, `this` is now an object that inherits from the export: read the framework members through `this`, not through the exported function by name, and keep state that must outlive a run elsewhere than on `this`. A security advisory accompanies this fix (#B807).'
