kind: Security
body: 'A value taken from a request can no longer start a line of its own in the text-format log (CWE-117). The levelled logger used to turn the two written characters backslash + n, r or t inside a logged string into a real control character, and it let a real line feed held by a logged value through, so a logged request value could forge a log line, and escaping it first with JSON.stringify did not help. Now: (1) a written backslash + n, r or t is written as it is; (2) the keys and the string values of a logged object or array, nested arrays included, are written with their control characters as visible escapes — \n, \r, \t, or \uXXXX for the other C0 controls, DEL, the C1 controls and the line separators U+2028 and U+2029; (3) the framework lines that print a request value write it the same way: the multipart upload field names, groups and extensions, the request-body parse warnings, a static file name with an unknown extension, the validator isDate and condition warnings, the route placeholder warning, the template file name lines, the engine.io message lines, the redirect notice, and the error lines of core/server.js, the controller, the context helper and lib/lane, which keep a real line break only before a stack frame or a "caused by:" line; (4) on the isaac engine a query string with no = that is not JSON is reported by its length and the name of the error, at warn, instead of an error stack quoting it. Behaviour changes in the text format: a written backslash + n, r or t no longer breaks the line, so pass a real line feed for a multi-line message; a multi-line string held inside a logged object prints on one line, so pass the Error itself to keep a multi-line stack; an error line writes a line break that no stack frame follows as a visible \n, so a 404 logs "Page not found: \n/path" on one line; the request-body parse warnings print the message of the parser, not its stack; and the upload 400 messages name the field, group or extension with its control characters shown. The JSON format (GINA_LOG_FORMAT=json) still writes one line per message, and its message value follows the same changes. The log redaction now reads a message both as written and with its visible escapes decoded, so a credential next to an escaped control character is masked as it was, and a credential that itself holds a written backslash + n, r or t, printed until now, is masked too. Not changed: a real line feed in a plain string argument still starts a new line, as with Node, and an Error logged by application code keeps its message as it is. Picked up by a bundle restart and a re-bake of the browser bundle (the validator and the routing library changed); the framework daemon and a running gina tail take the logger change at their own restart. (#B830)'
