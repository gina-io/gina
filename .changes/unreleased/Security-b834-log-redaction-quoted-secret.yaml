kind: Security
body: 'A resolved secret that holds a quote is now masked when it is logged inside an object or through `console.log` (CWE-532). The log redaction (#B433) masks every value the secrets resolver substituted for a `${secret:KEY}` placeholder, but the object writers escape the quotes of a string value before the redaction runs: the levelled logger writes a double quote as `\"` and a single quote as `\''`, and the raw `console.log` path renders an object with `JSON.stringify`, which writes a double quote as `\"`. A secret value holding a quote then no longer matched, and it was printed in full in the logged line, on both paths and inside an array logged through `console.log`. The decoded reading of the redaction now reads these two quote escapes too, so the secret is found and masked; as with the control-character escapes of #B830, that reading only adds masks, and nothing else in a log line changes. Still printed (#B838), five shapes on three paths: a secret that holds a backslash, a backspace (U+0008), a form feed (U+000C) or a lone surrogate, when it reaches the log JSON-escaped, as an object or an array logged through `console.log` or as a JSON string the caller built with `JSON.stringify`, logged at any level; and a secret that holds a carriage return (alone or as CR LF), inside a plain string passed to a level method, which writes the carriage return as a line feed before the redaction runs. Passing the object itself to `console.info` or `console.error` masks all five; a plain string does not mask the carriage-return shape. Pickup: a bundle restart; the logger is not in the browser bundle (#B834).'
