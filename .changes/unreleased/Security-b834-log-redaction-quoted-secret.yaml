kind: Security
body: 'A resolved secret that holds a quote is now masked when it is logged inside an object or through `console.log` (CWE-532). The log redaction (#B433) masks every value the secrets resolver substituted for a `${secret:KEY}` placeholder, but the object writers escape the quotes of a string value before the redaction runs: the levelled logger writes a double quote as `\"` and a single quote as `\''`, and the raw `console.log` path renders an object with `JSON.stringify`, which writes a double quote as `\"`. A secret value holding a quote then no longer matched, and it was printed in full in the logged line, on both paths and inside an array logged through `console.log`. The decoded reading of the redaction now reads these two quote escapes too, so the secret is found and masked; as with the control-character escapes of #B830, that reading only adds masks, and nothing else in a log line changes. Still printed (#B838), by the renderer that writes the value: `JSON.stringify` (an object, an array or an object key logged through `console.log`, or a JSON string the caller built, logged at any level) prints a secret that holds a backslash, a backspace (U+0008), a form feed (U+000C) or a lone surrogate; `util.inspect` (an `Error` that carries the value in one of its own properties, logged at any level or through `console.log`, alone or inside an object) prints a secret that holds a backslash, a lone surrogate or a control character, a tab, a line feed and a carriage return only when the `Error` sits inside an object logged through `console.log`; and a plain string passed to a level method prints a secret that holds a carriage return, which is written as a line feed before the redaction runs. A secret that holds no backslash, no control character and no lone surrogate is masked on every one of these paths, and a plain object or an array passed to a level method masks every character, unless the value sits inside an `Error` that it holds. Pickup: a bundle restart; the logger is not in the browser bundle (#B834).'
