kind: Security
body: 'A resolved secret that holds a quote is now masked when it is logged inside an object or through `console.log` (CWE-532). The log redaction (#B433) masks every value the secrets resolver substituted for a `${secret:KEY}` placeholder, but the object writers escape the quotes of a string value before the redaction runs: the levelled logger writes a double quote as `\"` and a single quote as `\''`, and the raw `console.log` path renders an object with `JSON.stringify`, which writes a double quote as `\"`. A secret value holding a quote then no longer matched, and it was printed in full in the logged line, on both paths and inside an array logged through `console.log`. The decoded reading of the redaction now reads these two quote escapes too, so the secret is found and masked; as with the control-character escapes of #B830, that reading only adds masks, and nothing else in a log line changes. A secret that holds a backslash, a control character, a lone surrogate or a line break, and the renderers other than the logger''s object writer, are covered by the #B838 entry of this release. Pickup: a bundle restart; the logger is not in the browser bundle (#B834).'
