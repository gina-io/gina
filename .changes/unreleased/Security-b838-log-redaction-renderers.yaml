kind: Security
body: 'A resolved secret is now masked whichever renderer writes it into a log message (CWE-532). The log redaction (#B433) searched a message as the logger''s own object writer writes a value. Three other writers alter a value before the redaction runs, and a secret they had altered was printed in full: `JSON.stringify` (an object, an array or an object key logged through `console.log`, or a JSON string the caller built) for a secret that holds a backslash, a control character or a lone surrogate; `util.inspect` (an `Error` that carries the value in one of its own properties, logged at any level or through `console.log`, alone or inside an object) for the same characters, for a long multi-line value, which it splits after each line feed, and for a multi-line value in the message of a nested `Error`, which it indents; and a plain string passed to a level method for a secret that holds a carriage return, which is written as a line feed. The secret values are now searched on every layer of backslash escaping of a message, up to three (a value can be rendered more than once: an `Error` held by an object logged through `console.log`, a JSON string held by an object or by an `Error`), and the line breaks of a secret match the layout those writers give them. Nothing else in a log line changes: the pattern rules read a message as before, and a line that holds no backslash, or only the escapes of the logger''s object writer, is searched exactly as before. Not masked: a value that is not written as its own characters (the bytes of a Buffer, base64, URL-encoding, the escapes of another serialiser); a value under more than three layers of escaping; and a secret that sits inside a longer string of more than 10,000 characters held by an `Error`, which `util.inspect` cuts (the head of a secret that is the whole cut string is masked). Pickup: a bundle restart; the logger is not in the browser bundle (#B838).'
