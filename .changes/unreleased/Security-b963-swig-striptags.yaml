kind: Security
body: 'Gina now requires `@rhinostone/swig` `^2.9.5` in both manifests. Up to 2.9.0, swig''s `striptags` filter ran in time quadratic in the length of its input: on text with many `<` and no `>` after them, 100,000 characters took about four seconds, so a template that applied `striptags` to request data could be made to block the event loop. 2.9.1 runs it in linear time with the same output (advisory GHSA-rvx7-jqr9-c242). Gina''s own code and templates never call `striptags`. Up to 2.9.1, `@rhinostone/swig-core` built a range of any size, so a large bound from template data could exhaust the heap (advisory GHSA-f8f4-95q3-38qw): native swig has no range syntax, so gina''s rendering never reaches that code, and 2.9.2 returns an empty range above 1,000,000 elements. Up to 2.9.4, nothing bounded how deeply templates nested on swig''s async render path, so a template that includes, imports or extends itself, directly or through another template, loaded templates until the heap ran out and the process aborted (advisory GHSA-86pr-x856-xrq5): gina renders on that path when a bundle sets `settings.template.swig.loader`, and 2.9.5 fails such a render once more than 1,000 templates are nested, or at once for an `extends` cycle. Up to 2.9.4, with swig''s memory compile cache, the first page that overrode a block nested inside a tag of a cached layout put its override into that layout, so other pages extending it showed that page''s block (advisory GHSA-g628-5x3r-g298): gina builds the engines of both its render paths with `cache: false`, so its rendering never reaches that code. Upgrading gina installs 2.9.5 or later (a project copy loaded through `swig.useProject`, or a frontend selected through `swig.package`, keeps its own version, so update it there to 2.9.5, which also carries the frontend fixes of 2.9.3: filters in all three, Twig ranges and `batch`, Jinja2 `slice` and `batch`, and Jinja2 and Django `for` loops); restart the bundle. (#B963, #B973, #B978, #B983)'
