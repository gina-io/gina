kind: Security
body: 'Gina now requires `@rhinostone/swig` `^2.9.6` in both manifests. Up to 2.9.0, swig''s `striptags` filter ran in time quadratic in the length of its input: on text with many `<` and no `>` after them, 100,000 characters took about four seconds, so a template that applied `striptags` to request data could be made to block the event loop. 2.9.1 runs it in linear time with the same output (advisory GHSA-rvx7-jqr9-c242). Gina''s own code and templates never call `striptags`. Up to 2.9.1, `@rhinostone/swig-core` built a range of any size, so a large bound from template data could exhaust the heap (advisory GHSA-f8f4-95q3-38qw): native swig has no range syntax, so gina''s rendering never reaches that code, and 2.9.2 returns an empty range above 1,000,000 elements. Up to 2.9.4, nothing bounded how deeply templates nested on swig''s async render path, so a template that includes, imports or extends itself, directly or through another template, loaded templates until the heap ran out and the process aborted (advisory GHSA-86pr-x856-xrq5): gina renders on that path when a bundle sets `settings.template.swig.loader`, and 2.9.5 fails such a render once more than 1,000 templates are nested, or at once for an `extends` cycle. Up to 2.9.4, with swig''s memory compile cache, the first page that overrode a block nested inside a tag of a cached layout put its override into that layout, so other pages extending it showed that page''s block (advisory GHSA-g628-5x3r-g298): gina builds the engines of both its render paths with `cache: false`, so its rendering never reaches that code. Up to 2.9.5, swig rendered on the locals object a caller passed, so a name a template set (`{% set %}`, a macro, an import, a loop variable) landed in that object and a later render given the same object read it, and with swig''s memory compile cache a compile given locals in its options kept them for later compiles of the same file (advisory GHSA-25w8-77gg-4ccw): gina''s own copy keeps a plain object an action passes to `self.render()` unwritten (#B988) and returns a class instance as is, which 2.9.6 covers by rendering on a copy of the locals made at the top of each render, and gina compiles with `cache: false`, so its rendering never reaches the cached case. 2.9.6 also changes what a template sees: a top-level property of the locals that is not enumerable is no longer visible, a top-level getter is read once per render, and on the async render path `{% parent %}` renders the block above, a macro that holds `{% parent %}` throws, and an imported template''s own sets stay out of the template that imports it. Upgrading gina installs 2.9.6 or later (a project copy loaded through `swig.useProject`, or a frontend selected through `swig.package`, keeps its own version, so update it there to 2.9.6, which also carries the frontend fixes of 2.9.3: filters in all three, Twig ranges and `batch`, Jinja2 `slice` and `batch`, and Jinja2 and Django `for` loops); restart the bundle. (#B963, #B973, #B978, #B983, #B997)'
