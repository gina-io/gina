kind: Security
body: '`self.render()` and `self.renderWithoutLayout()` no longer write into the object an action passes them. Up to 0.7.5 the render combined that object with gina''s own page data by writing into it: the default swig renderer added the request''s session block (`page.data.session`, with the session id), its `page.view` and, with the Csrf plugin adopted, its `gina.csrfToken` and `gina.csrfInput`; the nunjucks renderers and the async swig renderer wrote the request''s Csrf values into an object''s own `gina` member, and its `page.view` values into an object''s own `page.view` member. Because the combine keeps a value that is already there, an object an action passes to more than one render (a module-level object, a `require()`d JSON module) carried the first request''s session id, CSRF token and URL into the pages of later requests, the client bootstrap''s `gina.session` included. The session cookie stays signed, so the id alone does not open the session. Each render now combines a copy: the object itself, its `page`, `page.view`, `page.data`, `page.environment`, `gina` and `session` members, and every member gina''s data also holds are new for the render, and everything else is shared, so a template reads the same values as before. What changes: a change the action makes to the object after calling the render, at its top level or in those members, may no longer reach the template, the object no longer gains `page`, `gina` or `session` keys, and an object frozen with `Object.freeze()` renders where a render that had to add a key to it failed with a 500. A class instance passed as the object, or placed at one of those paths, is not copied and keeps the old behaviour. Restart your bundles (#B988).'
