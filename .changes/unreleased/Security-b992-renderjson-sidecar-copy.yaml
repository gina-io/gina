kind: Security
body: '`self.renderJSON()` no longer writes its Inspector sidecars into the object an action passes it. In development, and during a production instrumentation window for a request carrying `x-gina-inspector: true`, renderJSON adds the request''s query log (`__ginaQueries`: each statement''s text and its parameter shapes, or its values with `inspector.queries.captureValues`) and its timeline (`__ginaFlow`) to the response object when they are not empty. Up to 0.7.5 it added them to the action''s own object, so an object an action passes to more than one renderJSON call, such as a memoized or cached response object, kept the first request''s sidecars and sent them in every later response built from it, to any client, external ones included, and after the window had closed. renderJSON now writes the sidecars into a copy of the object, made once per response, one level deep (its members are shared). A class instance passed as the object is not copied and keeps the old behaviour. Restart your bundles (#B992).'
time: 2026-10-25T17:30:25+01:00
