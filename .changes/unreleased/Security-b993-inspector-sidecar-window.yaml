kind: Security
body: '`self.renderJSON()` no longer adds its Inspector sidecars to a response during a production instrumentation window. Up to 0.7.6, while a window opened through `/_gina/instrument` was open, renderJSON added the request''s query log (`__ginaQueries`: each statement''s text, its parameter shapes or, with `inspector.queries.captureValues`, its values, the `.sql` file''s server path, the bundle and connector names and the result counts) and its timeline (`__ginaFlow`) to the JSON response of any request carrying `x-gina-inspector: true`. `self.query()` sends that header on a call to another bundle so that the caller can merge the callee''s capture into its own, but any client can send it, so during a window an unauthenticated client could read its own request''s query log and timeline. The sidecars are now added in development only. During a window the capture leaves only over the authenticated `/_gina/agent` channel, and a caller''s Inspector no longer shows the queries and timeline of a bundle it calls: open a window on each bundle that serves the page. Affects 0.4.0 to 0.7.6, for a bundle that enables `inspector.instrumentation` and while a window is open; development is unchanged. Restart your bundles. A security advisory accompanies this fix (#B993).'
