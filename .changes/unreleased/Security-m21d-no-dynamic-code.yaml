kind: Security
body: 'The browser bundle ships no dynamic-code call any more. A custom form validator (`forms/validators/<name>/main.js`) is compiled by the browser as an inline script carrying the page''s own CSP nonce instead of through eval: same scope contract (`this.getValidationContext()`), same name in DevTools, one compile per validator per page, and no ''unsafe-eval'' needed. The two unreachable calls the bundled RequireJS (`require.exec`, the transpiler-plugin path) and engine.io-client (its global-object shim) carried are rewritten at build time by exact match, so a dependency bump that moves them fails the build instead of shipping them. On the server, where custom validators are not wired, a function registered on the gina context is attached as it is. Supply-chain scanners flagged the eval on some published versions and not others, which swung the package score between two values on identical bytes (#M21d)'
