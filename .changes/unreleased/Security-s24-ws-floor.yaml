kind: Security
body: 'Gina now requires `ws` `^8.23.0` in both manifests (it was `^8.22.0`). Up to 8.22.0, a peer that sent Ping frames and stopped reading made `ws` queue an automatic Pong for each one, without limit, until the process ran out of memory (advisory GHSA-37g9-w4hg-h9qr, every `ws` release from 8.0.0 before 8.23.0). 8.23.0 closes the connection once 60 automatic Pongs are waiting to be written (`maxPendingAutoPongs`). Gina loads `ws` for the Inspector agent WebSocket at `/_gina/agent`, which exists in dev mode and, outside dev, only when `settings.json` `inspector.agent.enabled` is true, where it then requires the agent key, and, through engine.io, for a bundle whose `settings.json` sets `ioServer.integrationMode` to `"attach"` (engine.io now runs on gina''s `ws` too, #S25). Upgrading gina installs 8.23.0 or later; restart the bundle. (#S24)'
time: 2026-11-18T14:34:46+01:00
