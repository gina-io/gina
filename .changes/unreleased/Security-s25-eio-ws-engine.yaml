kind: Security
body: 'A bundle whose `settings.json` sets `ioServer.integrationMode` to `"attach"` now runs engine.io''s WebSocket transport on gina''s own `ws` (`^8.23.0`), unless its `ioServer` block names a `wsEngine`. engine.io pins its own `ws` range, below 8.23.0 in every 6.6.x release (`~8.21.0` in 6.6.9 to 6.6.11, the latest), so an install from the registry placed an older `ws` under engine.io that gina''s `ws` range did not reach, and such a bundle stayed exposed to ws''s advisory GHSA-37g9-w4hg-h9qr: a peer that sent Ping frames and stopped reading made `ws` queue an automatic Pong for each one until the process ran out of memory. A project whose own `package.json` overrides `ws` decides the version gina loads as well: raise such an override to `^8.23.0`. Upgrading gina installs `ws` 8.23.0 or later; restart the bundles in attach mode. (#S25)'
