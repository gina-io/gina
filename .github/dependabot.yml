version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Suppress noisy semver-patch bumps for every npm dependency — patch updates
      # are low-risk and are applied by hand when needed. Minor/major bumps still
      # open PRs (capped by open-pull-requests-limit below).
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    open-pull-requests-limit: 5

  # Keeps the SHA-pinned actions in .github/workflows/*.yml current: Dependabot
  # bumps the commit hash and the trailing "# vX.Y.Z" comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
