name: Runtime Smoke

# Runs the end-to-end container smoke (`npm run smoke`) against every supported
# runtime, per push: it packs the candidate tarball, installs it globally inside
# a clean runtime container, boots the api + frontend + db bundles and asserts
# HTTP 200 plus a real SQLite INSERT -> SELECT round-trip.
#
# Two jobs:
#   - bun-smoke:  TWO Bun legs (oven/bun). Bun is a SUPPORTED runtime
#     (package.json `engines.bun`, `>= 1.2`). Images are PINNED for
#     reproducibility, so a Bun upstream regression surfaces only on a
#     deliberate pin bump — never as a random CI flake. The two legs exist
#     because the declared range spans two DIFFERENT code paths through
#     `lib/sqlite-driver`; see the matrix comment for which is which, and
#     which of the two pins may be bumped.
#   - node-smoke: one leg per supported Node major (matching the cut-time
#     `npm run smoke` default set), on the FLOATING `node:NN` major tags —
#     deliberately unpinned, mirroring test.yml's setup-node major pins.
#     Before 2026-07-29 the Node legs ran only at cut time; per-push they make
#     the release-time smoke a re-confirmation instead of a first run.
#
# BLOCKING: a red result here FAILS the workflow and gates develop/master, the
# same as the Node test legs. The FILE keeps its historical `bun-smoke.yml`
# name on purpose — GitHub keys a workflow's run history by file path, so
# renaming the file would orphan every prior run.

on:
  push:
    branches: [develop, master]
    paths:
      - 'framework/**'
      - 'bin/**'
      - 'utils/**'
      - 'script/smoke_test_tarball.js'
      - 'script/smoke_in_container.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/bun-smoke.yml'
  pull_request:
    branches: [develop, master]
    paths:
      - 'framework/**'
      - 'bin/**'
      - 'utils/**'
      - 'script/smoke_test_tarball.js'
      - 'script/smoke_in_container.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/bun-smoke.yml'
  workflow_dispatch:

jobs:
  bun-smoke:
    name: Bun container smoke (${{ matrix.bun }})
    runs-on: ubuntu-latest

    strategy:
      # Same rationale as node-smoke below: a tooling flake on one leg must not
      # cancel or obscure the sibling leg's verdict.
      fail-fast: false
      matrix:
        # TWO legs, because `engines.bun` declares `>= 1.2` and the series on
        # either side of 1.4 take DIFFERENT paths through `lib/sqlite-driver`:
        #
        #   oven/bun:1.4.2  — Bun 1.4 ships `node:sqlite`, so the seam resolves
        #                     it FIRST and the `bun:sqlite` adapter self-retires.
        #                     The smoke reports `driver DatabaseSync` here.
        #                     THIS is the leg to bump as newer Bun releases are
        #                     validated.
        #
        #   oven/bun:1.3.14 — the last release BEFORE `node:sqlite` landed, so
        #                     it is the only leg that drives the real
        #                     `bun:sqlite` adapter end-to-end (the smoke reports
        #                     `driver BunDatabaseSync`). A regression there is
        #                     boot-fatal for a 1.2-1.3 consumer: the session and
        #                     job stores throw from init when no driver resolves.
        #                     DELIBERATELY FROZEN — do NOT bump this pin. Moving
        #                     it past 1.4 silently deletes the only coverage the
        #                     adapter path has. Retire this leg only by raising
        #                     the `engines.bun` floor above 1.3.
        bun: [oven/bun:1.4.2, oven/bun:1.3.14]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js (pack the tarball + run the smoke orchestrator)
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # ubuntu-latest ships Docker with a running daemon. The orchestrator packs
      # the candidate with `npm pack --ignore-scripts` (no install, no `prepare`
      # commit) and runs it in a disposable oven/bun container. `--node=` selects
      # ZERO Node legs, so the Bun leg drives the exit code.
      - name: Bun-only container smoke
        run: npm run smoke -- --node= --bun --bun-image=${{ matrix.bun }}

  node-smoke:
    name: Node container smoke (node:${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      # A tooling flake on one leg (image pull, container create) must not
      # cancel or obscure the verdicts of the sibling legs — the orchestrator
      # already distinguishes COULD-NOT-RUN from a real red in its output.
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v6

      # The orchestrator itself runs on ONE fixed Node (packs the tarball,
      # drives docker); the version under test is the container image below.
      - name: Use Node.js (pack the tarball + run the smoke orchestrator)
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # One Node leg per matrix entry: `--node=NN` selects the single `node:NN`
      # container (floating major tag) and no `--bun` means no Bun leg, so this
      # leg alone drives the exit code.
      - name: Node container smoke
        run: npm run smoke -- --node=${{ matrix.node }}
