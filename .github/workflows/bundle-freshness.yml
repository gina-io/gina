name: Bundle Freshness

# Verifies that the committed dist/vendor/gina/ bundle matches what would
# be produced by rebuilding from the current source.  Catches the
# source-committed-without-rebuild gap that .githooks/pre-commit (cheap,
# "did you stage dist?") cannot detect — i.e. a stale dist was staged
# alongside a fresh source change.
#
# Precedent: #SCS1e (commit 48b8fd26) shipped four validator walker
# replacements as source-only.  The bundle was not rebuilt until commit
# 69fb32fc picked it up as a side effect of toolbar removal.  Any browser
# loading gina.min.js between those two commits still ran the original
# eval('data.' + localValue).  See llms.txt §72.

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

# Cancel any in-flight check for the same ref when a newer one kicks off.
concurrency:
  group: bundle-freshness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freshness:
    name: Verify dist matches source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Set up Java (for Closure Compiler)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli

      - name: Install dev dependencies
        run: |
          # `npm ci` (not `npm install`) — strictly respects package-lock.json
          # so devDeps like engine.io-client (which gets baked into the bundle
          # via build.json) don't drift between local rebuilds and CI rebuilds.
          # See llms.txt §72 / 2026-04-24 incident.
          npm ci --ignore-scripts
          ln -sf $(pwd) node_modules/gina

      - name: Prepare framework dependencies
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FW_DIR="framework/v${VERSION}"
          if [ ! -f "${FW_DIR}/package.json" ]; then
            cat > "${FW_DIR}/package.json" <<EOF
          {
            "name": "gina-framework",
            "version": "${VERSION}",
            "dependencies": {
              "@rhinostone/swig": "^2.7.2"
            }
          }
          EOF
          fi
          (cd "${FW_DIR}" && npm install --ignore-scripts)

      - name: Verify every .br decodes to its committed source
        # ⚠️ ORDERING IS LOAD-BEARING: this MUST run BEFORE "Rebuild bundle".
        # After a rebuild the working tree holds the RUNNER's freshly-compressed
        # .br AND its freshly-minified sibling, so comparing them would pass
        # trivially — a control that cannot fail, checking the runner's own output
        # instead of what is committed. The pristine-tree assertion below enforces
        # that ordering rather than trusting it, so a future step reshuffle fails
        # loudly instead of silently neutering this gate.
        #
        # The freshness half for the compressed artifacts, arch-independent by
        # construction: it never compares compressed BYTES (which diverge between
        # arm64 and x86_64 for some inputs — see the note below), only what they
        # DECODE TO.
        #
        # The chain (the two halves are a conjunction; their order does not matter):
        # the LATER "Verify dist is in sync" step proves the committed uncompressed
        # artifact equals the runner's rebuild, i.e. it is fresh. THIS step proves
        # each committed .br decodes to exactly that artifact. Together they establish
        # the .br is fresh
        # — which is the property "freshness" actually means — without ever
        # requiring two machines to agree on a compressed byte stream.
        #
        # Measured 2026-08-06: the arm64 and x86_64 artifacts for the same bundle
        # differ in raw bytes (114651 vs 114657) and decode to the IDENTICAL
        # content, so a byte comparison fails where this one passes. A deliberately
        # stale .br decodes to different content and is still caught.
        run: |
          fail=0
          checked=0

          # 0. the dist must still be exactly as committed. If a rebuild has already
          #    run, every pair below is the runner's own output and this gate proves
          #    nothing — so refuse to report a green rather than report a hollow one.
          if ! git diff --quiet -- ':(glob)framework/v*/core/asset/plugin/dist/vendor/gina/**'; then
            echo "::error::bundle-freshness: the dist is already modified at this point."
            echo "::error::This step must run BEFORE 'Rebuild bundle' — otherwise it compares"
            echo "::error::the runner's fresh output against itself and always passes."
            exit 1
          fi

          # 1. every .br must decode to its uncompressed sibling
          while IFS= read -r f; do
            src="${f%.br}"
            if [ ! -f "$src" ]; then
              echo "::error file=$f::orphan .br — no uncompressed sibling at ${src}"
              fail=1
              continue
            fi
            if ! brotli -dc "$f" | cmp -s - "$src"; then
              echo "::error file=$f::STALE — this .br does not decode to ${src}."
              echo "::error::A browser sending 'Accept-Encoding: br' would be served different"
              echo "::error::content from one that does not. Rebuild and stage the dist:"
              echo "::error::  bash framework/v*/core/asset/plugin/build --env=prod"
              fail=1
            fi
            checked=$((checked + 1))
          done < <(find framework/v*/core/asset/plugin/dist/vendor/gina -type f -name '*.br')

          # 2. every artifact the build COMPRESSES must HAVE a .br. The byte-diff
          #    above can no longer see a DELETED .br (the path is excluded there),
          #    so without this a removed artifact would slip through silently.
          #
          #    The three finds below mirror the build script's own brotli calls
          #    EXACTLY (core/asset/plugin/build: css/*.css, js/*.min.js,
          #    html/*.html). Do not widen this to the whole dist tree: assets under
          #    beemaster/ and inspector/ are NOT compressed by the build, and
          #    demanding a .br for them turns this gate permanently red.
          for pair in "css:*.css" "js:*.min.js" "html:*.html"; do
            d="${pair%%:*}"; pat="${pair#*:}"
            while IFS= read -r a; do
              if [ ! -f "${a}.br" ]; then
                echo "::error file=$a::missing ${a}.br — the build emits one for this artifact"
                fail=1
              fi
            done < <(find framework/v*/core/asset/plugin/dist/vendor/gina/"$d" -type f -name "$pat" 2>/dev/null)
          done

          # 3. a run that checked nothing is a control that cannot fail — exactly how
          #    this gate went dead once before, on a 0-match pathspec.
          if [ "$checked" -eq 0 ]; then
            echo "::error::bundle-freshness: found 0 .br artifacts — gate misconfigured."
            exit 1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "OK: ${checked} .br artifacts each decode to their committed source."

      - name: Install Closure Compiler JARs
        run: bash framework/v*/core/asset/plugin/lib/js/install-closure-compiler.sh

      - name: Rebuild bundle
        run: |
          bash framework/v*/core/asset/plugin/build --env=prod \
            --sass-bin="$PWD/node_modules/.bin/sass" \
            --csso-bin="$PWD/node_modules/.bin/csso" \
            --rjs-bin="$PWD/node_modules/.bin/r.js"

      - name: Verify dist is in sync with source
        run: |
          # *.gz files are excluded: gzip output is platform-specific (Apple
          # gzip on the maintainer's Mac vs GNU gzip on Linux runners produce
          # different deflate bytes for the same input — even Node's zlib
          # disagrees Mac↔Linux because it links the system zlib).
          #
          # *.br is now excluded from the BYTE comparison too, and checked by
          # CONTENT in the next step instead. This block used to assert that
          # "Brotli IS cross-platform deterministic (single canonical reference
          # impl)" and compare .br bytes. That premise is FALSE and cost a red on
          # a correct dist (2026-08-06): measured with brotli 1.1.0 on BOTH sides,
          # one bundle compressed to 114651 bytes on arm64 (macOS and Linux alike)
          # and 114657 on x86_64, which is what the runners use. The variable is
          # CPU ARCHITECTURE, not OS and not version. It is also INPUT-DEPENDENT —
          # the immediately preceding bundle compressed identically on both — which
          # is why this gate stayed green for so long before tripping.
          #
          # Dropping .br outright (as .gz is dropped) would have been the easy fix
          # and is NOT safe: a .br regenerated from stale source while its
          # uncompressed sibling is fresh would then ship, and every browser sending
          # `Accept-Encoding: br` would run the OLD code while everyone else ran the
          # new one — the llms.txt §72 failure mode, served selectively. The content
          # check below keeps that protection without comparing compressed bytes.
          #
          # NOTE: the pathspecs MUST carry :(glob) magic. A bare 'framework/v*/...'
          # pathspec does NOT treat v* as a wildcard under git's default magic — it
          # matches zero files, so `git diff --exit-code` always returns 0 and the
          # gate silently passes (it was a no-op for exactly this reason). :(glob)
          # makes * and ** behave as expected against the version directory.
          #
          # Guard: if the include pathspec matches no tracked files (a future path or
          # glob typo), fail loudly rather than silently pass — a 0-match pathspec is
          # how this gate went dead in the first place.
          if [ "$(git ls-files -- ':(glob)framework/v*/core/asset/plugin/dist/vendor/gina/**' | wc -l)" -eq 0 ]; then
            echo "::error::bundle-freshness: dist pathspec matched 0 tracked files — gate misconfigured."
            exit 1
          fi
          if ! git diff --exit-code -- \
                  ':(glob)framework/v*/core/asset/plugin/dist/vendor/gina/**' \
                  ':(exclude,glob)framework/v*/core/asset/plugin/dist/vendor/gina/**/*.gz' \
                  ':(exclude,glob)framework/v*/core/asset/plugin/dist/vendor/gina/**/*.br'; then
            echo ""
            echo "::error::Bundle is out of sync with source."
            echo "::error::A source file under one of the AMD-aliased paths in build.json"
            echo "::error::was modified without a corresponding rebuilt dist staged."
            echo "::error::"
            echo "::error::Locally:"
            echo "::error::  bash framework/v*/core/asset/plugin/build --env=prod"
            echo "::error::  git add framework/v*/core/asset/plugin/dist/vendor/gina/"
            echo "::error::"
            echo "::error::See llms.txt §72 for the rebuild-gate discipline."
            exit 1
          fi
          echo "Bundle is fresh — uncompressed dist matches source (*.gz is not checked; *.br is checked by content in the next step, not by bytes)."
