name: Tests

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dev dependencies
        run: |
          npm install --ignore-scripts
          ln -sf $(pwd) node_modules/gina

      - name: Prepare framework dependencies
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FW_DIR="framework/v${VERSION}"
          if [ ! -f "${FW_DIR}/package.json" ]; then
            cat > "${FW_DIR}/package.json" <<EOF
          {
            "name": "gina-framework",
            "version": "${VERSION}",
            "dependencies": {
              "@rhinostone/swig": "^2.7.2"
            }
          }
          EOF
          fi
          (cd "${FW_DIR}" && npm install --ignore-scripts)

      - name: Run tests
        # The canonical file list lives in package.json's `test` script — the
        # single source of truth for CI, CONTRIBUTING.md and local runs alike.
        # It used to be inlined here while `npm test` pointed at a glob that
        # matched nothing (0 tests, exit 0 — a silent green), and CONTRIBUTING
        # named a third, wider set. Keep the list in package.json only.
        run: npm test

      # Every step above runs gina from this checkout, where no framework path
      # contains `node_modules`; an npm install puts every framework file under
      # `node_modules/gina`, and code that branches on the path shape behaves
      # differently there (#B695: `settings.swig.autoescape` was silently off on
      # npm installs). Boot one bundle from a copy of this commit placed under
      # `…/node_modules/gina` — a real directory, the path an install produces —
      # and check the configured escaping through the container-boot test's seam.
      - name: Swig autoescape from an npm-shaped install path (#B695)
        run: |
          COPY="$RUNNER_TEMP/nm/node_modules/gina"
          mkdir -p "$(dirname "$COPY")"
          git worktree add --detach "$COPY" HEAD
          mkdir "$COPY/node_modules"
          for d in node_modules/* node_modules/.bin; do b=$(basename "$d"); [ "$b" = gina ] && continue; ln -s "$PWD/$d" "$COPY/node_modules/$b"; done
          ln -s "$COPY" "$COPY/node_modules/gina"
          FW_DIR="framework/v$(node -p "require('./package.json').version")"
          ln -s "$PWD/$FW_DIR/node_modules" "$COPY/$FW_DIR/node_modules"
          B359_GINA_ROOT="$COPY" node --test "$COPY/test/integration/container-boot-swig-autoescape.test.js"

      # Published-types gate (#DTO3b): gna.d.ts drift + a consumer fixture
      # compiled by tsc THROUGH the exports map (skipLibCheck:false), with a
      # can-fail control. tsc's behaviour is node-version-independent, so one
      # matrix leg suffices.
      - name: Check published types
        if: matrix.node-version == 24
        run: npm run types:check
