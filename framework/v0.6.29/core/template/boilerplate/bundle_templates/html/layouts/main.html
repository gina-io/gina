<!DOCTYPE html>
<html lang="{{ page.view.lang }}">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta charset="utf-8">
        <title>{{ page.view.title }}</title>
        <meta name="generator" content="Gina I/O">
        <meta name="expires" content="never">
        <meta name="robots" content="index, follow, noarchive">
        <meta name="distribution" content="global">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="manifest" href="/manifest.webmanifest">
        <meta name="theme-color" content="#2b2b2b">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
        <script>
            // Progressive Web App — register the service worker (see public/sw.js).
            // Edit or remove this block to change PWA behaviour.
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('/sw.js').catch(function (err) {
                        console.warn('Service worker registration failed:', err);
                    });
                });
            }
        </script>
    </head>
    <body>
        <div class="outer-wrap">
            <div class="content wrap">
                {% include "./includes/error-msg-outdated-browser.html" %}
                {% include "./includes/error-msg-noscript.html" %}

                {% block content %}
                    <p>If you view this message you didn’t define a <strong>content</strong> block in your template.</p>
                {% endblock %}
            </div>
        </div>
    </body>
</html>
