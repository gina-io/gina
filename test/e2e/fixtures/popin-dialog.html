<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>gina popin dialog a11y fixture</title>
    <!-- The BUILT popin stylesheet — native ::backdrop, @starting-style enter/exit
         transitions, body[data-gina-popin-scroll-lock] scroll-lock. Served by
         runtime-server.js, which resolves framework/v<version> from package.json,
         so the link survives the per-release framework-dir rename. -->
    <link rel="stylesheet" href="/css/vendor/gina/gina.min.css">
    <style>
        body { height: 300vh; } /* tall page so scroll-lock is observable */
        dialog.gina-popin-container { min-width: 20rem; padding: 1.5rem; }
    </style>
</head>
<body>
    <h1>Page</h1>

    <button id="open-modal" type="button" data-gina-dialog="d-modal" data-gina-dialog-modal>Open modal</button>
    <button id="open-nonmodal" type="button" data-gina-dialog="d-nonmodal" data-gina-dialog-modal="false">Open non-modal</button>

    <dialog id="d-modal" class="gina-popin-container">
        <h2>Modal title</h2>
        <button class="gina-popin-close" type="button">Close</button>
        <input id="m-first" type="text" aria-label="first">
        <input id="m-last" type="text" aria-label="last">
    </dialog>

    <dialog id="d-nonmodal" class="gina-popin-container">
        <h2>Non-modal title</h2>
        <button class="gina-popin-close" type="button">Close</button>
        <input id="n-first" type="text" aria-label="first">
    </dialog>

    <!--
        Minimal vanilla harness that mirrors the a11y CONTRACT the gina/popin
        entry layer guarantees (resolveModal → showModal vs show; aria wiring;
        focus return; non-modal Escape + scroll-lock shims). It is intentionally
        framework-free so the spec validates the native-dialog + CSS layer without
        booting the full gina runtime. The contract here is kept in lock-step with
        popin/main.js (wireTriggerAria / associateLabel / focusInitial /
        applyNonModalShims / popinClose focus-return / bindNativeCloseSync).
    -->
    <script>
        (function () {
            var lastTrigger = null;

            function associateLabel($el) {
                var $title = $el.querySelector('[id$="-title"]') || $el.querySelector('h1,h2,h3,h4,h5,h6');
                if (!$title) { return; }
                if (!$title.id) { $title.id = ($el.id || 'gina-popin') + '-title'; }
                $el.setAttribute('aria-labelledby', $title.id);
            }
            function focusInitial($el) {
                var $t = $el.querySelector('[autofocus]')
                    || $el.querySelector('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])');
                if ($t) { $t.focus(); } else { $el.setAttribute('tabindex', '-1'); $el.focus(); }
            }
            function onKeydownFactory($el) {
                return function (e) {
                    if (e.key === 'Escape' || e.keyCode === 27) { e.preventDefault(); close($el); }
                };
            }
            function applyNonModalShims($el) {
                document.body.setAttribute('data-gina-popin-scroll-lock', 'true');
                $el.__onKeydown = onKeydownFactory($el);
                $el.addEventListener('keydown', $el.__onKeydown);
            }
            function removeNonModalShims($el) {
                document.body.removeAttribute('data-gina-popin-scroll-lock');
                if ($el.__onKeydown) { $el.removeEventListener('keydown', $el.__onKeydown); $el.__onKeydown = null; }
            }
            // Mirror of popin/main.js bindNativeCloseSync: a native close (Escape on a modal,
            // a method="dialog" form) runs the plugin's close, whose teardown returns focus to
            // the trigger; focus is never left to the browser's own restoration, which has
            // nothing to restore where a click does not focus a button (WebKit on macOS).
            function bindNativeCloseSync($el) {
                if ($el.__closeSyncBound) { return; }
                $el.__closeSyncBound = true;
                $el.addEventListener('close', function () { close($el); });
            }
            function close($el) {
                if (typeof $el.close === 'function') { $el.close(); } else { $el.removeAttribute('open'); }
                removeNonModalShims($el);
                if (lastTrigger) { lastTrigger.focus(); }
            }

            document.addEventListener('click', function (event) {
                var $trigger = event.target.closest && event.target.closest('[data-gina-dialog]');
                if ($trigger) {
                    event.preventDefault();
                    var id = $trigger.getAttribute('data-gina-dialog');
                    var $el = document.getElementById(id);
                    if (!$el) { return; }
                    lastTrigger = $trigger;
                    $trigger.setAttribute('aria-haspopup', 'dialog');
                    $trigger.setAttribute('aria-controls', id);
                    associateLabel($el);
                    bindNativeCloseSync($el);
                    var attr = $trigger.getAttribute('data-gina-dialog-modal');
                    var modal = (attr != null && attr !== 'false');
                    if (modal) {
                        $el.showModal();
                    } else {
                        $el.show();
                        applyNonModalShims($el);
                        focusInitial($el);
                    }
                    return;
                }
                if (event.target.classList && event.target.classList.contains('gina-popin-close')) {
                    var $dlg = event.target.closest('dialog');
                    if ($dlg) { close($dlg); }
                }
            });
        }());
    </script>
</body>
</html>
