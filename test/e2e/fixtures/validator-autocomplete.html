<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>gina Safari autocomplete e2e harness</title>
    <!-- Empty data-URI icon: suppress the favicon.ico request for a clean console. -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/css/vendor/gina/gina.min.css">

    <!--
        RUNTIME harness for the Safari `autocomplete="off"` workaround (#B1055:
        `readonly` until focus, every key native). Boots the
        REAL built gina bundle with a NON-EMPTY forms whisper
        (/js/gina.onload.autocomplete.js) so core.js scans + binds forms; the
        live-checked text input below carries autocomplete="off", which is
        what routes it through handleAutoComplete on a REAL-Safari UA
        (#B135 gate) — the companion specs are therefore webkit-project-only.

        Load order matches a real gina render: the onload defines
        onGinaLoaded + __ginaWebroot, THEN the gina bundle boots.
    -->
    <script src="/js/gina.onload.autocomplete.js"></script>
    <script src="/js/gina.min.js"></script>
    <script>
        // Minimal page: the framework's own `ginaloaded` listener loses the
        // attach race, so invoke onGinaLoaded manually to flip
        // isFrameworkLoaded (the loader's guard makes a duplicate call a
        // no-op). core.js then scans forms and publishes gina.validator.
        (function () {
            var tries = 0;
            function kick() {
                try {
                    if (
                        window.gina
                        && window.gina.config
                        && typeof window.onGinaLoaded === 'function'
                        && !window.gina.isFrameworkLoaded
                    ) {
                        window.onGinaLoaded(window.gina);
                    }
                } catch (e) {
                    if (window.console && console.error) {
                        console.error('[harness] onGinaLoaded threw', e && e.stack || e);
                    }
                }
                if ((!window.gina || !window.gina.isFrameworkLoaded) && tries++ < 100) {
                    setTimeout(kick, 50);
                }
            }
            kick();
        }());
    </script>
    <style>
        body { margin: 0; padding: 1rem; font-family: system-ui, sans-serif; }
    </style>
</head>
<body>
    <h1>gina Safari autocomplete harness</h1>

    <!--
        A live-checked text field with autocomplete="off": on a REAL-Safari UA
        this is exactly the shape registerForLiveChecking routes through
        handleAutoComplete (`readonly` until focus). The field carries an
        explicit id — the workaround keys its per-element event names off $el.id.
    -->
    <form id="acform" data-gina-form-rule="acform" data-gina-form-live-check-enabled="true" action="/ac-sink" method="post">
        <label>Reference <input id="ref-input" type="text" name="ref" autocomplete="off"></label>
        <button id="acform-submit" type="submit">Submit</button>
    </form>
</body>
</html>
